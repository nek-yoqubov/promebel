<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>PRO MEBEL CRM — ИИ-аналитик</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
<style>
.ai-wrap{display:flex;gap:16px;padding:12px 16px 0;align-items:flex-start}
.ai-side{width:260px;flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;top:12px;max-height:calc(100vh - 24px)}
.ai-side .btn{height:42px}
.ai-side .sh{display:none}
.ai-chats{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.ai-chat{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:14px}
.ai-chat:hover{background:var(--card)}
.ai-chat.on{background:var(--card-2);color:var(--ink)}
.ai-chat .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-chat .x{opacity:0;border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}
.ai-chat:hover .x{opacity:1}
.ai-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
.ai-msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.ai-m{max-width:100%;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.5;word-break:break-word}
.ai-m.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);max-width:85%;white-space:pre-wrap}
.ai-m.a{align-self:stretch;background:var(--card);border:1px solid var(--line)}
.ai-m.a p{margin:6px 0}.ai-m.a ul{margin:6px 0;padding-left:20px}
/* таблица: мельче шрифт, прокрутка вбок, тень с той стороны, где есть ещё колонки */
.tw{--tw-sh:color-mix(in srgb, var(--ink) 22%, transparent);margin:8px 0;width:fit-content;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;
  background:
    linear-gradient(to right, var(--card) 30%, transparent) left center / 28px 100% no-repeat local,
    linear-gradient(to left, var(--card) 30%, transparent) right center / 28px 100% no-repeat local,
    linear-gradient(to right, var(--tw-sh), transparent) left center / 16px 100% no-repeat scroll,
    linear-gradient(to left, var(--tw-sh), transparent) right center / 16px 100% no-repeat scroll;
}
.tw table{border-collapse:collapse;font-size:12.5px;line-height:1.35}
.tw th,.tw td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.tw th{font-weight:700;color:var(--ink-2)}
.tw td.n,.tw th.n{text-align:right;font-variant-numeric:tabular-nums}
.ai-m .src{margin-top:8px;font-size:13px;color:var(--muted)}
.ai-m .src a{color:var(--info);word-break:break-all}
.ai-tag{display:inline-block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.ai-pick{align-self:stretch;background:var(--card);border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px}
.ai-pick .q{font-size:14px;color:var(--ink-2);margin:6px 0}
.ai-pick .opts{display:flex;flex-wrap:wrap;gap:6px}
.ai-pick .opts button{border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);border-radius:18px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.ai-pick .opts button.on{border-color:var(--brand);color:var(--brand)}
.ai-bar{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.ai-bar .composer{padding:0}
.ai-web{width:var(--tap);height:var(--tap);flex:none;border-radius:50%;border:1px solid var(--line-2);background:var(--card);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ai-web.on{background:color-mix(in srgb, var(--info, #3b82f6) 18%, transparent);border-color:var(--info, #3b82f6);color:var(--info, #3b82f6)}
.ai-hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.ai-hint:empty{display:none}
.ai-steps{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ai-steps .st{display:flex;gap:6px;align-items:center}
.ai-steps .st::before{content:'✓';color:var(--ok, #22c55e);flex:none;width:12px}
.ai-steps .st.cur::before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid var(--brand);border-right-color:transparent;
  animation:aispin .8s linear infinite;align-self:center}
.ai-steps .sec{margin-left:auto;font:600 12px/1 'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;flex:none}
.ai-m .body:not(:empty){margin-top:6px}
.ai-how{margin-top:8px;font-size:12.5px;color:var(--muted)}
.ai-how summary{cursor:pointer}
.ai-how .ai-steps{margin-top:4px}
@keyframes aispin{to{transform:rotate(360deg)}}
/* выпадающий список @ / № */
.ai-ref{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:0 -6px 24px #0005;max-height:min(46vh,340px);overflow:auto;z-index:5;padding:4px}
.ai-ref[hidden]{display:none}
.ai-ref .it{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer}
.ai-ref .it.on,.ai-ref .it:hover{background:var(--card-2)}
.ai-ref .nm{flex:1;min-width:0}
.ai-ref .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-ref .nm i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-ref .tp{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c)}
.ai-ref .em{padding:10px;color:var(--muted);font-size:13.5px}
.ai-ref .hd{padding:6px 10px 2px;font-size:12px;color:var(--muted)}
/* правила */
.rl-sec{margin:0 0 18px}
.rl-sec h3{font:800 14px 'Manrope';color:var(--ink-2);margin:0 0 4px}
.rl-sec .sub{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.rl-it{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}
.rl-it .t{flex:1;min-width:0;font-size:14px;line-height:1.45;word-break:break-word}
.rl-it .t i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.rl-it button{flex:none;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink-2);border-radius:10px;height:32px;min-width:32px;padding:0 9px;cursor:pointer;font-size:13px}
.rl-it button.ok{color:#22c55e;border-color:#22c55e66}
.rl-it button.no{color:var(--late)}
.rl-add{display:flex;gap:6px}
.rl-add textarea{flex:1;min-height:42px;resize:none;font:inherit;font-size:14px;border-radius:12px;padding:9px 12px;font-size:14px}
.rl-add .btn{height:42px;flex:none}
.rl-st{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--card-2);color:var(--muted)}
.ai-side .btn.ghost{height:38px}
.ai-side .cnt{position:static;margin-left:6px;display:inline-flex}
.ai-empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px;line-height:1.6}
.ai-down{position:absolute;right:4px;top:-50px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--card-2);color:var(--ink);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px #0004}
.ai-down.on{display:flex}
.ai-back{display:none}
.tbar .tt.ai-t{text-align:center}

/* телефон и планшет: список чатов — выезжающая панель слева */
@media (max-width:1023px){
  .ai-wrap{padding:8px 12px 0}
  /* на телефоне значок интернета — в шапке рядом с «+», чтобы полю ввода хватало места */
  .composer .ai-web{display:none}
  .tbar .ai-webtop.on{color:var(--info, #3b82f6);background:color-mix(in srgb, var(--info, #3b82f6) 16%, transparent)}
  .ai-side{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:80;max-height:none;background:var(--panel);
    padding:calc(10px + env(safe-area-inset-top)) 10px 10px;border-right:1px solid var(--line);
    transform:translateX(-102%);transition:transform .2s ease-out}
  .ai-side.open{transform:none}
  .ai-side .sh{display:flex;align-items:center;justify-content:space-between;font:800 17px 'Manrope';padding:4px 4px 6px}
  .ai-chats{max-height:none;flex:1}
  .ai-chat{padding:11px 10px;font-size:15px}
  .ai-chat .x{opacity:.55}
  .ai-back{display:block;position:fixed;inset:0;z-index:79;background:#0006}
  .ai-back[hidden]{display:none}
  .ai-main{min-height:calc(100vh - var(--tbar) - var(--tabbar) - 20px)}
  .ai-bar{bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:8px}
  /* клавиатура открыта — нижняя панель прячется, поле ввода прижимается к клавиатуре */
  body.kb .tabbar{display:none}
  body.kb.shell{padding-bottom:0}
  body.kb .ai-bar{bottom:0}
  /* читает ответ (не внизу страницы) — нижние вкладки уезжают, поле ввода опускается на их место */
  .tabbar{transition:transform .2s ease-out}
  .ai-bar{transition:bottom .2s ease-out}
  body.tbhide .tabbar{transform:translateY(100%)}
  body.tbhide .ai-bar{bottom:0}
}
</style>
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1>ИИ-аналитик</h1></div>
  <div class="ai-wrap">
    <aside class="ai-side" id="side">
      <div class="sh"><span>Чаты</span><button class="ib" id="sideClose" aria-label="Закрыть"></button></div>
      <button class="btn" id="newBtn">Новый чат</button>
      <button class="btn ghost" id="rulesBtn">Правила<span class="cnt" id="rulesCnt" hidden></span></button>
      <div class="ai-chats" id="chats"></div>
    </aside>
    <div class="ai-back" id="back" hidden></div>
    <section class="ai-main">
      <div class="ai-msgs" id="msgs"></div>
      <div class="ai-bar">
        <button class="ai-down" id="down" aria-label="Вниз"></button>
        <div class="ai-ref" id="ref" hidden></div>
        <div class="composer">
          <button class="ai-web" id="mWeb" type="button" aria-label="Интернет" title="Поиск в интернете"></button>
          <textarea id="q" rows="1" placeholder="Ваш вопрос…"></textarea>
          <button class="send" id="send" title="Отправить"></button>
        </div>
        <div class="ai-hint" id="hint"></div>
      </div>
    </section>
  </div>
</main>

<div class="modal sheet" id="rulesM" hidden>
  <div class="modal-box" style="max-width:600px">
    <div class="modal-head"><h2>Правила для ИИ</h2><button class="icon-btn" id="rulesX" aria-label="Закрыть"></button></div>
    <div class="modal-body" id="rulesBody"></div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const MOBILE = matchMedia('(max-width:1023px)');
const MENU = '<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
const GLOBE = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>';
const HINT_DB = 'Имена клиентов и сотрудников не уходят в ИИ: перед отправкой они заменяются метками.';
const HINT_WEB = 'Интернет: поиск по рынку и конкурентам. База в этом режиме недоступна, данные компании в поиск не уходят.';
let CHAT = null, WEB = false, BUSY = false, PENDING = null, TITLES = {}, TRACK = null, REFS = [];

const seen = k => { try{ return localStorage.getItem(k) === '1'; }catch(e){ return false; } };
const mark = k => { try{ localStorage.setItem(k, '1'); }catch(e){} };
const draftGet = () => { try{ return localStorage.getItem('ai_draft') || ''; }catch(e){ return ''; } };
const jobGet = () => { try{ return JSON.parse(localStorage.getItem('ai_job') || 'null'); }catch(e){ return null; } };
const jobSet = v => { try{ v ? localStorage.setItem('ai_job', JSON.stringify(v)) : localStorage.removeItem('ai_job'); }catch(e){} };
const draftSet = v => { try{ v ? localStorage.setItem('ai_draft', v) : localStorage.removeItem('ai_draft'); }catch(e){} };

(async () => {
  if(!await requireAuth()) return;
  await renderShell({ title:'ИИ-аналитик', tab:'ai' });
  const { data: ok } = await sb.rpc('ai_chat_access');
  if(!ok){ location.replace('index.html'); return; }

  // шапка на телефоне: ☰ — чаты, по центру название чата, «+» — новый чат
  const tb = document.querySelector('.tbar');
  if(tb){
    const left = tb.querySelector('.logo, #shellBack');
    const menu = document.createElement('button');
    menu.className = 'ib'; menu.id = 'menuBtn'; menu.setAttribute('aria-label', 'Чаты'); menu.innerHTML = MENU;
    left ? left.replaceWith(menu) : tb.prepend(menu);
    tb.querySelector('.tt').classList.add('ai-t');
    tb.querySelector('.ta').innerHTML = '<button class="ib ai-webtop" id="webTop" aria-label="Интернет" title="Поиск в интернете">' + GLOBE + '</button>' +
      '<button class="ib" id="newTop" aria-label="Новый чат">' + icon('plus') + '</button>';
    $('webTop').onclick = () => setMode(!WEB);
    menu.onclick = openSide;
    $('newTop').onclick = newChat;
  }

  $('send').innerHTML = icon('send');
  $('down').innerHTML = icon('down');
  $('sideClose').innerHTML = icon('x');
  $('sideClose').onclick = closeSide;
  $('back').onclick = closeSide;
  $('newBtn').onclick = newChat;
  $('rulesBtn').onclick = () => { closeSide(); openRules(); };
  $('rulesX').innerHTML = icon('x');
  $('rulesX').onclick = () => { $('rulesM').hidden = true; };
  $('rulesM').addEventListener('click', e => { if(e.target === $('rulesM')) $('rulesM').hidden = true; });
  if(new URLSearchParams(location.search).get('rules')) openRules(); else rulesCount();
  $('mWeb').innerHTML = GLOBE;
  $('mWeb').onclick = () => setMode(!WEB);
  $('send').onclick = () => send();
  // нажатие на кнопки не забирает фокус у поля — иначе клавиатура прячется посреди нажатия и всё прыгает
  for(const b of [$('send'), $('mWeb')]) b.addEventListener('pointerdown', e => e.preventDefault());
  $('down').onclick = () => { scrollEnd(); };
  const q = $('q');
  q.value = draftGet(); grow();
  q.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !MOBILE.matches && $('ref').hidden){ e.preventDefault(); send(); } });
  q.addEventListener('input', () => { grow(); draftSet(q.value); refInput(); });
  q.addEventListener('click', refInput);
  q.addEventListener('keydown', refKey, true);
  q.addEventListener('blur', () => setTimeout(refClose, 150));
  q.addEventListener('focus', () => document.body.classList.add('kb'));
  q.addEventListener('blur', () => document.body.classList.remove('kb'));

  // пролистал вверх пальцем — клавиатура убирается, черновик остаётся в поле
  let y0 = null;
  addEventListener('touchstart', e => { y0 = e.target.closest('.ai-bar') ? null : e.touches[0].clientY; }, { passive:true });
  addEventListener('touchmove', e => {
    if(y0 != null && e.touches[0].clientY - y0 > 30 && document.activeElement === q) q.blur();
  }, { passive:true });
  addEventListener('scroll', downBtn, { passive:true });
  addEventListener('resize', downBtn);

  // экран погас или вкладка свернулась — по возвращении сразу забираем свежее состояние ответа
  document.addEventListener('visibilitychange', () => { if(!document.hidden && TRACK) TRACK.kick(); });
  addEventListener('pageshow', () => { if(TRACK) TRACK.kick(); });

  setMode(false);
  const j = jobGet();
  if(j && j.chat) openChat(j.chat); else newChat();
})();

function grow(){ const t = $('q'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
function setMode(w){
  WEB = w;
  for(const b of [$('mWeb'), $('webTop')]) if(b){ b.classList.toggle('on', w); b.setAttribute('aria-pressed', w ? 'true' : 'false'); }
  $('q').placeholder = w ? 'Вопрос про рынок…' : 'Ваш вопрос…';
  // подсказки показываются, пока человек не отправил первый вопрос в этом режиме
  $('hint').textContent = w ? (seen('ai_hint_web') ? '' : HINT_WEB) : (seen('ai_hint_db') ? '' : HINT_DB);
}
function setTitle(t){ const el = document.querySelector('.tbar .tt'); if(el) el.textContent = t || 'ИИ-аналитик'; }
function openSide(){ $('side').classList.add('open'); $('back').hidden = false; $('q').blur(); }
function closeSide(){ $('side').classList.remove('open'); $('back').hidden = true; }

function downBtn(){
  const gap = document.documentElement.scrollHeight - (scrollY + innerHeight);
  $('down').classList.toggle('on', gap > 240);
  document.body.classList.toggle('tbhide', MOBILE.matches && gap > 120);
}
function scrollEnd(){ scrollTo({ top: document.documentElement.scrollHeight, behavior:'smooth' }); }
// длинный ответ — показать его начало, дальше человек листает сам (кнопка ↓ появится)
function scrollToMsg(el){
  const head = MOBILE.matches ? 64 : 12;
  const top = el.getBoundingClientRect().top + scrollY - head;
  scrollTo({ top: Math.min(top, document.documentElement.scrollHeight), behavior:'smooth' });
}

async function api(body){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return { error:'Сессия истекла, войдите заново' };
  try{
    const r = await fetch(SUPABASE_URL + '/functions/v1/ai-chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SUPABASE_KEY, Authorization:'Bearer ' + session.access_token },
      body: JSON.stringify(body)
    });
    let res; try{ res = await r.json(); }catch(e){ return { error:'Сервер не ответил (' + r.status + '). Попробуйте ещё раз.' }; }
    if(!r.ok && !res.error) return { error:'Ошибка сервера (' + r.status + ')' };
    return res;
  }catch(e){ return { error:'Нет связи с сервером' }; }
}

async function loadChats(){
  const r = await api({ action:'list' });
  if(r.error){ $('chats').innerHTML = '<div class="sub">' + esc(r.error) + '</div>'; return; }
  TITLES = {};
  for(const c of r.chats || []) TITLES[c.id] = c.title;
  if(CHAT && TITLES[CHAT]) setTitle(TITLES[CHAT]);
  $('chats').innerHTML = (r.chats || []).map(c =>
    '<div class="ai-chat' + (c.id === CHAT ? ' on' : '') + '" data-id="' + esc(c.id) + '"><span class="t">' + esc(c.title) +
    '</span><button class="x" title="Удалить" data-del="' + esc(c.id) + '">×</button></div>').join('') ||
    '<div class="sub" style="padding:6px 10px">Чатов пока нет</div>';
  $('chats').querySelectorAll('.ai-chat').forEach(el => el.onclick = e => {
    if(e.target.dataset.del) return delChat(e.target.dataset.del);
    openChat(el.dataset.id);
  });
}

function stopTrack(){ if(TRACK){ TRACK.stop(); TRACK = null; } BUSY = false; $('send').disabled = false; }

function newChat(){
  stopTrack();
  CHAT = null; PENDING = null;
  setTitle('');
  $('msgs').innerHTML = '<div class="ai-empty">Задайте вопрос про продажи, клиентов, долги, остатки или KPI.<br>' +
    'Например: «Топ-10 клиентов за октябрь», «Как продаёт Мебельный8 в ноябре», «На сколько хватит остатков Egger».<br>' +
    'Для рынка и конкурентов включите режим «Интернет».<br>Чтобы указать клиента или сотрудника точно — наберите @ или №.</div>';
  closeSide();
  loadChats();
  downBtn();
  if(!MOBILE.matches) $('q').focus();
}

async function openChat(id){
  stopTrack();
  CHAT = id; PENDING = null;
  closeSide();
  setTitle(TITLES[id]);
  $('msgs').innerHTML = '<div class="loading">Загрузка…</div>';
  const r = await api({ action:'open', chat_id:id });
  if(r.error){ jobSet(null); $('msgs').innerHTML = '<div class="empty">' + esc(r.error) + '</div>'; return; }
  if(CHAT !== id) return;
  $('msgs').innerHTML = '';
  let run = null;
  for(const m of r.messages){
    if(m.role === 'assistant' && m.status === 'running'){ run = m; continue; }
    if(m.role === 'assistant' && m.status === 'error'){ addMsg('assistant', '⚠️ ' + (m.error || 'Ответ не получен'), [], m.web); continue; }
    const d = addMsg(m.role, m.text, m.sources, m.web);
    if(m.role === 'assistant') addHow(d, m.steps);
  }
  if(run) track(run.id, run.web, run);
  else { const j = jobGet(); if(j && j.chat === id) jobSet(null); }
  loadChats();
  scrollTo({ top: document.documentElement.scrollHeight });
  downBtn();
}

async function delChat(id){
  if(!confirm('Удалить этот чат?')) return;
  const r = await api({ action:'delete', chat_id:id });
  if(r.error) return toast(r.error);
  if(id === CHAT) newChat(); else loadChats();
}

function addMsg(role, text, sources, web){
  const box = $('msgs');
  const empty = box.querySelector('.ai-empty'); if(empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'ai-m ' + (role === 'user' ? 'u' : 'a');
  if(role === 'user') d.textContent = text;
  else {
    d.innerHTML = (web ? '<span class="ai-tag">Интернет</span>' : '') + md(text) +
      (sources && sources.length ? '<div class="src">Источники:<br>' + sources.map(s =>
        '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title || s.url) + '</a>').join('<br>') + '</div>' : '');
  }
  box.appendChild(d);
  return d;
}

async function send(picks){
  if(BUSY) return;
  const text = picks ? PENDING.text : $('q').value.trim();
  if(!text) return;
  BUSY = true; $('send').disabled = true;
  if(!picks){ addMsg('user', text); $('q').value = ''; draftSet(''); grow(); refClose(); }
  if(MOBILE.matches) $('q').blur();
  const web = WEB;
  const wait = addMsg('assistant', '');
  wait.innerHTML = '<div class="ai-steps"><div class="st cur">Отправляю вопрос…</div></div>';
  scrollEnd();
  const refs = REFS.filter(x => text.includes(x.text));
  const r = await api({ action:'send', chat_id: CHAT, text, web, picks: picks || {}, refs });
  wait.remove();
  if(r.need_pick){ BUSY = false; $('send').disabled = false; showPicks(text, r.need_pick); return; }
  PENDING = null; REFS = [];
  if(r.error && !r.job_id){ BUSY = false; $('send').disabled = false; scrollToMsg(addMsg('assistant', '⚠️ ' + r.error)); downBtn(); return; }
  if(!CHAT) CHAT = r.chat_id;
  mark(web ? 'ai_hint_web' : 'ai_hint_db'); setMode(WEB);
  loadChats();
  track(r.job_id, web);
}

/* Правила: личные — сразу и только для себя; общие — для всех, действуют после одобрения руководителем.
   Нейронка сама может только предложить общее правило (до 5 в день) или сохранить личное по просьбе. */
async function rulesCount(){
  const r = await api({ action:'rules' });
  const n = (r.proposed || []).length;
  $('rulesCnt').hidden = !n; $('rulesCnt').textContent = n;
  return r;
}
async function openRules(){
  $('rulesM').hidden = false;
  $('rulesBody').innerHTML = '<div class="loading">Загрузка…</div>';
  const r = await rulesCount();
  if(r.error){ $('rulesBody').innerHTML = '<div class="empty">' + esc(r.error) + '</div>'; return; }
  const when = d => d ? new Date(d).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' }) : '';
  const src = x => x.source === 'ai' ? 'предложила нейронка' : x.source === 'admin' ? 'руководитель' : 'вручную';
  const item = (x, btns, meta) => '<div class="rl-it" data-id="' + x.id + '"><div class="t">' + esc(x.text) +
    (meta ? '<i>' + esc(meta) + '</i>' : '') + '</div>' + btns + '</div>';
  const del = '<button data-act="del" title="Убрать">×</button>';
  let h = '';
  if(r.admin && r.proposed.length){
    h += '<div class="rl-sec"><h3>Ждут решения · ' + r.proposed.length + '</h3><div class="sub">Заработают для всех только после одобрения.</div>' +
      r.proposed.map(x => item(x, '<button class="ok" data-act="ok" title="Одобрить">✓</button><button class="no" data-act="no" title="Отклонить">✗</button>',
        [x.who, src(x), when(x.at)].filter(Boolean).join(' · ') + (x.reason ? '\nПочему: ' + x.reason : ''))).join('') + '</div>';
  }
  h += '<div class="rl-sec"><h3>Мои правила</h3><div class="sub">Только для вас, действуют сразу. Например: «всегда показывай суммы и в долларах».</div>' +
    (r.mine.length ? r.mine.map(x => item(x, del, src(x) + ' · ' + when(x.at))).join('') : '') +
    '<div class="rl-add"><textarea id="rlMine" rows="1" maxlength="300" placeholder="Новое личное правило…"></textarea><button class="btn" data-add="personal">Добавить</button></div></div>';
  h += '<div class="rl-sec"><h3>Общие правила</h3><div class="sub">' + (r.admin ? 'Для всех. Вы можете добавить или убрать.' : 'Для всех. Новое общее правило сначала одобряет руководитель.') + '</div>' +
    (r.common.length ? r.common.map(x => item(x, r.admin ? del : '', src(x) + ' · ' + when(x.at))).join('') : '<div class="sub">Пока нет.</div>') +
    '<div class="rl-add"><textarea id="rlCommon" rows="1" maxlength="300" placeholder="' + (r.admin ? 'Новое общее правило…' : 'Предложить общее правило…') + '"></textarea>' +
    '<button class="btn" data-add="common">' + (r.admin ? 'Добавить' : 'Предложить') + '</button></div></div>';
  if(!r.admin && r.my_proposals.length){
    h += '<div class="rl-sec"><h3>Мои предложения</h3>' + r.my_proposals.map(x => item(x,
      '<span class="rl-st">' + (x.status === 'rejected' ? 'отклонено' : 'на рассмотрении') + '</span>', when(x.at))).join('') + '</div>';
  }
  $('rulesBody').innerHTML = h;
  $('rulesBody').querySelectorAll('.rl-it .t i').forEach(i => i.style.whiteSpace = 'pre-line');
  $('rulesBody').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const id = +b.closest('.rl-it').dataset.id, act = b.dataset.act;
    if(act === 'del' && !confirm('Убрать это правило?')) return;
    b.disabled = true;
    const res = await api(act === 'del' ? { action:'rule_delete', id } : { action:'rule_decide', id, ok: act === 'ok' });
    if(res.error){ toast(res.error); b.disabled = false; return; }
    openRules();
  });
  $('rulesBody').querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
    const scope = b.dataset.add, ta = $(scope === 'personal' ? 'rlMine' : 'rlCommon'), text = ta.value.trim();
    if(text.length < 3) return toast('Напишите правило');
    b.disabled = true;
    const res = await api({ action:'rule_add', scope, text });
    b.disabled = false;
    if(res.error) return toast(res.error);
    if(res.status === 'proposed') toast('Отправлено руководителю на одобрение');
    openRules();
  });
}

/* @ или № в поле — список клиентов, сотрудников и папок. Ищет наш сервер, в ИИ ничего не уходит.
   В поле вставляется обычный текст (имя), а страница запоминает, кто это — сервер подставит метку без угадывания. */
const TYPE_COLOR = { 'сотрудник':'#14b8a6', 'ОРП':'#a855f7', 'дилер':'#3b82f6', 'ОПИП':'#eab308', 'Ламинати':'#22c55e',
  'клиент':'#94a3b8', 'сотрудник-клиент':'#06b6d4', 'свои':'#f97316', 'разовые':'#64748b', 'папка':'#f43f5e' };
let REF_AT = null, REF_ITEMS = [], REF_SEL = 0, REF_T = 0, REF_SEQ = 0;
function refTrigger(){
  const q = $('q'), pos = q.selectionStart, before = q.value.slice(0, pos);
  const m = before.match(/(^|[\s(«"])([@№])([^@№\n]{0,40})$/);
  if(!m) return null;
  return { start: pos - m[3].length - 1, end: pos, query: m[3].trim() };
}
function refInput(){
  const t = refTrigger();
  if(!t){ refClose(); return; }
  REF_AT = t;
  clearTimeout(REF_T);
  if(t.query.length < 2){ refShow([], 'Начните вводить имя, фамилию или код клиента'); return; }
  REF_T = setTimeout(async () => {
    const seq = ++REF_SEQ;
    const r = await api({ action:'search', q: t.query });
    if(seq !== REF_SEQ || !REF_AT) return;
    refShow(r.items || [], r.error || 'Ничего не найдено');
  }, 220);
}
function refShow(items, empty){
  REF_ITEMS = items; REF_SEL = 0;
  const box = $('ref');
  box.innerHTML = items.length ? items.map((x, k) =>
    '<div class="it' + (k === 0 ? ' on' : '') + '" data-k="' + k + '"><span class="nm"><b>' + esc(x.text) + '</b>' +
    (x.sub ? '<i>' + esc(x.sub) + '</i>' : '') + '</span><span class="tp" style="--c:' + (TYPE_COLOR[x.type] || '#94a3b8') + '">' + esc(x.type) + '</span></div>').join('')
    : '<div class="em">' + esc(empty) + '</div>';
  box.hidden = false;
  box.querySelectorAll('.it').forEach(el => {
    el.addEventListener('pointerdown', e => e.preventDefault());   // не забирать фокус у поля
    el.onclick = () => refPick(+el.dataset.k);
  });
}
function refClose(){ REF_AT = null; REF_ITEMS = []; clearTimeout(REF_T); REF_SEQ++; $('ref').hidden = true; }
function refPick(k){
  const x = REF_ITEMS[k], t = REF_AT;
  if(!x || !t) return;
  const q = $('q'), ins = x.text + ' ';
  q.value = q.value.slice(0, t.start) + ins + q.value.slice(t.end);
  const pos = t.start + ins.length;
  q.setSelectionRange(pos, pos);
  // тёзки (сотрудник и клиент с одним именем): действует последний выбор
  REFS = REFS.filter(r => r.text !== x.text);
  if(x.token) REFS.push({ text: x.text, token: x.token });
  draftSet(q.value); grow(); refClose(); q.focus();
}
function refKey(e){
  if($('ref').hidden || !REF_ITEMS.length) { if(e.key === 'Escape') refClose(); return; }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    REF_SEL = (REF_SEL + (e.key === 'ArrowDown' ? 1 : REF_ITEMS.length - 1)) % REF_ITEMS.length;
    $('ref').querySelectorAll('.it').forEach((el, k) => el.classList.toggle('on', k === REF_SEL));
  } else if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); e.stopImmediatePropagation(); refPick(REF_SEL); }
  else if(e.key === 'Escape'){ e.preventDefault(); refClose(); }
}

/* Ответ готовится на сервере. Страница раз в секунду спрашивает, что готово: шаги и уже написанный текст.
   Текст «допечатывается» плавно между опросами. Экран погас — опрос встаёт, при возвращении продолжается. */
function track(id, web, first){
  BUSY = true; $('send').disabled = true;
  jobSet({ chat: CHAT, id });
  const d = addMsg('assistant', '', [], web);
  d.innerHTML = (web ? '<span class="ai-tag">Интернет</span>' : '') + '<div class="ai-steps"></div><div class="body"></div>';
  const stepsEl = d.querySelector('.ai-steps'), body = d.querySelector('.body');
  let shown = 0, target = '', steps = [], stepAt = Date.now(), alive = true, timer = null, busy = false, raf = 0, fails = 0;
  const t0 = Date.now();
  const sec = () => Math.round((Date.now() - stepAt) / 1000);
  function drawSteps(){
    stepsEl.innerHTML = squash(steps).map((x, k, a) => '<div class="st' + (k === a.length - 1 && !target ? ' cur' : '') + '"><span>' + esc(x) + '</span>' +
      (k === a.length - 1 && !target ? '<span class="sec">' + sec() + ' с</span>' : '') + '</div>').join('');
  }
  function type(){
    raf = 0;
    if(!alive || shown >= target.length) return;
    const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 80;
    shown = Math.min(target.length, shown + Math.max(2, Math.ceil((target.length - shown) / 12)));
    // недописанная строка таблицы не показывается, пока не придёт целиком
    body.innerHTML = md(target.slice(0, shown).replace(/\n\s*\|[^\n]*$/, ''));
    if(atEnd) scrollTo({ top: document.documentElement.scrollHeight });
    raf = requestAnimationFrame(type);
  }
  function finish(m){
    alive = false; clearTimeout(timer); cancelAnimationFrame(raf);
    jobSet(null);
    if(TRACK && TRACK.id === id) TRACK = null;
    BUSY = false; $('send').disabled = false;
    if(m.status === 'error'){ d.innerHTML = md('⚠️ ' + (m.error || 'Ответ не получен')); downBtn(); return; }
    d.innerHTML = (web ? '<span class="ai-tag">Интернет</span>' : '') + md(m.text) +
      (m.sources && m.sources.length ? '<div class="src">Источники:<br>' + m.sources.map(s =>
        '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title || s.url) + '</a>').join('<br>') + '</div>' : '');
    addHow(d, m.steps, Math.round((Date.now() - t0) / 1000));
    if(!shown) scrollToMsg(d);
    setTimeout(downBtn, 300);
    loadChats();
  }
  function apply(m){
    if(!alive) return;
    if(m.status !== 'running') return finish(m);
    if((m.steps || []).length !== steps.length){ steps = m.steps || []; stepAt = Date.now(); }
    const t = m.text || '';
    if(t !== target){
      // текст начался заново (прежний оказался вступлением к запросу и стал шагом) — печатаем с нуля
      if(!t.startsWith(target.slice(0, shown))){ shown = 0; body.innerHTML = ''; }
      target = t;
      if(t && !raf) raf = requestAnimationFrame(type);
    }
    drawSteps();
  }
  async function poll(){
    if(!alive || busy) return;
    clearTimeout(timer);
    if(document.hidden){ timer = setTimeout(poll, 3000); return; }
    busy = true;
    const m = await api({ action:'poll', job_id:id });
    busy = false;
    if(!alive) return;
    if(m.error && !m.status){
      if(++fails >= 20) return finish({ status:'error', error: m.error });
      timer = setTimeout(poll, 2000); return;
    }
    fails = 0;
    apply(m);
    if(alive) timer = setTimeout(poll, 1000);
  }
  const tick = setInterval(() => { if(!alive) return clearInterval(tick); if(!target) drawSteps(); }, 1000);
  TRACK = { id, stop(){ alive = false; clearTimeout(timer); cancelAnimationFrame(raf); clearInterval(tick); }, kick(){ if(alive && !busy){ poll(); } } };
  if(first) apply(first);
  poll();
}

// одинаковые шаги подряд — одной строкой: «Считаю по базе: продажи ×3»
function squash(list){
  const out = [];
  for(const x of list || []){
    const l = out[out.length - 1];
    if(l && l.t === x) l.n++; else out.push({ t:x, n:1 });
  }
  return out.map(o => o.t + (o.n > 1 ? ' ×' + o.n : ''));
}

// под готовым ответом — свёрнутый список шагов: что смотрел и сколько думал
function addHow(d, steps, secs){
  if(!steps || !steps.length) return;
  const h = document.createElement('details');
  h.className = 'ai-how';
  h.innerHTML = '<summary>Как считал' + (secs ? ' · ' + secs + ' с' : '') + '</summary><div class="ai-steps">' +
    squash(steps).map(x => '<div class="st"><span>' + esc(x) + '</span></div>').join('') + '</div>';
  d.appendChild(h);
}

function showPicks(text, list){
  PENDING = { text, picks:{} };
  const d = document.createElement('div');
  d.className = 'ai-pick';
  d.innerHTML = '<div><b>Уточните, кого вы имеете в виду</b></div>' + list.map((p, i) =>
    '<div class="q">«' + esc(p.span) + '»' + (p.more ? ' — ещё ' + p.more + ', напишите фамилию точнее' : '') + '</div><div class="opts" data-i="' + i + '">' +
    p.options.map(o => '<button data-tok="' + esc(o.token) + '">' + esc(o.label) + '</button>').join('') + '</div>').join('');
  $('msgs').appendChild(d);
  d.querySelectorAll('.opts').forEach(box => box.querySelectorAll('button').forEach(b => b.onclick = () => {
    box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    PENDING.picks[list[+box.dataset.i].span] = b.dataset.tok;
    if(Object.keys(PENDING.picks).length === list.length){ d.remove(); send(PENDING.picks); }
  }));
  scrollToMsg(d);
}

/* простой и безопасный markdown: сначала экранирование, потом жирный, списки и таблицы */
function md(src){
  const lines = esc(src || '').split('\n');
  let out = '', i = 0;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const isNum = s => /^[-−+]?[\d\s  ,.]+%?$/.test(s.replace(/<[^>]+>/g, '').trim()) && /\d/.test(s);
  while(i < lines.length){
    const l = lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      const row = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = row(l), body = [];
      i += 2;
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ body.push(row(lines[i])); i++; }
      const num = head.map((_, k) => body.length > 0 && body.every(r => !r[k] || isNum(r[k])));
      out += '<div class="tw"><table><tr>' + head.map((c, k) => '<th' + (num[k] ? ' class="n"' : '') + '>' + c + '</th>').join('') + '</tr>' +
        body.map(r => '<tr>' + r.map((c, k) => '<td' + (num[k] ? ' class="n"' : '') + '>' + c + '</td>').join('') + '</tr>').join('') + '</table></div>';
      continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){
      let u = '<ul>';
      while(i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){ u += '<li>' + inline(lines[i].replace(/^\s*[-*•]\s+/, '')) + '</li>'; i++; }
      out += u + '</ul>'; continue;
    }
    if(/^#{1,4}\s+/.test(l)){ out += '<p><b>' + inline(l.replace(/^#{1,4}\s+/, '')) + '</b></p>'; i++; continue; }
    if(l.trim()) out += '<p>' + inline(l) + '</p>';
    i++;
  }
  return out;
}
