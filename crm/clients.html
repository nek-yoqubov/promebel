<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Клиенты</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1>Клиенты</h1></div>

  <div id="quota"></div>

  <div class="pad" style="padding-bottom:0">
    <div class="f-search"><span id="searchIcon"></span>
      <input id="q" type="search" placeholder="Имя клиента или код 1С" autocomplete="off"></div>
    <div class="hint" id="hint">Клиенты из 1С. Наберите минимум 3 буквы имени или код. Номер открывается кнопкой «Номер».</div>
  </div>

  <div class="rows" id="list"></div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
let SEQ = 0;

(async () => {
  if(!await requireAuth()) return;
  await renderShell({ title:'Клиенты', tab:'clients' });
  const { data: ok } = await sb.rpc('clients_access');
  if(!ok){ location.replace('index.html'); return; }
  $('searchIcon').outerHTML = icon('search');

  let timer = null;
  $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(search, 300); };

  const qid = new URLSearchParams(location.search).get('quota');
  if(qid && ME.role === 'admin') loadQuota(Number(qid));
  $('q').focus();
})();

async function search(){
  const q = $('q').value.trim();
  const my = ++SEQ;
  if(q.length < 3 && !/^\d+$/.test(q)){ $('list').innerHTML = ''; return; }
  $('list').innerHTML = '<div class="loading">Поиск…</div>';
  const { data, error } = await sb.rpc('client_search', { q });
  if(my !== SEQ) return;
  if(error){ $('list').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  if(!data || !data.length){ $('list').innerHTML = '<div class="empty">Никого не нашли</div>'; return; }
  $('list').innerHTML = data.map(c =>
    '<div class="row" style="cursor:default;align-items:center">' +
      '<div class="rb"><div class="l1"><span class="t">' + esc(c.name) + '</span></div>' +
        '<div class="l2">' + esc((c.folder || '') + ' · код ' + c.code) + '</div></div>' +
      dialBtnHTML(c.code) +
    '</div>').join('') +
    (data.length >= 20 ? '<div class="hint pad">Показаны первые 20. Уточните имя, чтобы найти нужного.</div>' : '');
  wireDial($('list'));
}

/* запрос на ещё номера — открывается из уведомления, решает только админ */
async function loadQuota(id){
  const { data, error } = await sb.rpc('phone_quota_get', { p_id: id });
  if(error || !data){ $('quota').innerHTML = '<div class="pad"><div class="warnbox">Запрос не найден</div></div>'; return; }
  const st = { pending:'ждёт решения', approved:'разрешено', refused:'отказано' }[data.status] || data.status;
  $('quota').innerHTML =
    '<div class="pad"><div class="warnbox">' +
      '<b>' + esc(data.employee) + '</b> просит ещё ' + data.extra + ' номеров клиентов на ' + esc(fmtDateOnly(data.day)) + '.<br>' +
      'Сегодня уже открыто: ' + data.used + '. Статус: ' + esc(st) + '.' +
      (data.status === 'pending' && !IS_PREVIEW
        ? '<div class="btn-row" style="margin-top:10px"><button class="btn sm" id="qOk">Разрешить</button>' +
          '<button class="btn sm" id="qNo">Отказать</button></div>' : '') +
    '</div></div>';
  if(data.status !== 'pending' || IS_PREVIEW) return;
  const decide = async okv => {
    $('qOk').disabled = $('qNo').disabled = true;
    const { error: e } = await sb.rpc('phone_quota_decide', { p_id: id, p_ok: okv });
    if(e){ toast(errText(e)); $('qOk').disabled = $('qNo').disabled = false; return; }
    toast(okv ? 'Разрешено' : 'Отказано');
    loadQuota(id);
  };
  $('qOk').onclick = () => decide(true);
  $('qNo').onclick = () => decide(false);
}
</script>
</body>
</html>
