<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Личное дело</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main">
  <div class="person" id="person"></div>

  <!-- Кадровые данные -->
  <div class="panel" id="hrPanel" hidden>
    <div class="sec" id="hrTitle">Кадровые данные</div>
    <div class="row2">
      <div class="field">
        <label class="field-label" for="hireDate">Дата приёма</label>
        <input id="hireDate" class="num" type="date">
      </div>
      <div class="field">
        <label class="field-label" for="birthDate">Дата рождения</label>
        <input id="birthDate" class="num" type="date">
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="address">Адрес</label>
      <input id="address" maxlength="300">
    </div>
    <div class="field">
      <label class="field-label" for="passport">Номер паспорта</label>
      <input id="passport" class="num" maxlength="60">
    </div>
    <div class="row2">
      <div class="field">
        <label class="field-label" for="salary">Оклад</label>
        <input id="salary" class="num" inputmode="decimal" placeholder="0">
        <div class="hint" id="salaryHint"></div>
      </div>
      <div class="field">
        <label class="field-label" for="currency">Валюта</label>
        <input id="currency" class="num" list="curList" maxlength="8" placeholder="TJS">
        <datalist id="curList">
          <option value="TJS"><option value="USD"><option value="UZS"><option value="RUB"><option value="EUR">
        </datalist>
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="bonus">Схема бонусов</label>
      <textarea id="bonus" rows="2" placeholder="От чего считается премия"></textarea>
    </div>
    <div class="field">
      <label class="field-label" for="nda">Положение о конфиденциальности подписано</label>
      <input id="nda" class="num" type="date">
    </div>
    <div class="field">
      <label class="field-label" for="hrNotes">Заметки</label>
      <textarea id="hrNotes" rows="3"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" id="hrSave">Сохранить кадровые данные</button>
    </div>
    <div class="msg err" id="hrMsg"></div>
  </div>

  <!-- Документы -->
  <div class="panel" id="docPanel" hidden>
    <div class="sec">Документы</div>
    <div id="docList"><div class="loading">Загрузка…</div></div>
    <div class="addrow">
      <div class="field">
        <label class="field-label" for="docType">Тип документа</label>
        <select id="docType"></select>
      </div>
      <div class="field">
        <label class="field-label" for="docTitle">Название</label>
        <input id="docTitle" maxlength="120" placeholder="Необязательно">
      </div>
      <div class="field">
        <label class="field-label" for="docFile">Файл</label>
        <input id="docFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
        <div class="hint">jpg, png, webp или pdf, не больше 10 МБ</div>
      </div>
      <div class="field">
        <label class="field-label">&nbsp;</label>
        <button class="btn" id="docUpload"></button>
      </div>
    </div>
    <div class="msg err" id="docMsg"></div>
  </div>

  <!-- Компетенции и оценка -->
  <div class="panel" id="skillPanel" hidden>
    <div class="sec">Компетенции</div>
    <p class="sub" style="margin:-6px 0 14px">Оценка знаний: одна точка — не знает, пять — эксперт.
      Сотрудник свою оценку не видит.</p>
    <div id="skillList"><div class="loading">Загрузка…</div></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn ghost" id="skillAdd"></button>
    </div>
  </div>

  <div class="panel" id="reviewPanel" hidden>
    <div class="sec">Оценка сотрудника</div>
    <div class="field">
      <label class="field-label" for="strengths">Сильные стороны</label>
      <textarea id="strengths" rows="3"></textarea>
    </div>
    <div class="field">
      <label class="field-label" for="weaknesses">Слабые стороны</label>
      <textarea id="weaknesses" rows="3"></textarea>
    </div>
    <div class="field">
      <label class="field-label" for="achievements">Достижения</label>
      <textarea id="achievements" rows="3"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" id="revSave">Сохранить оценку</button>
    </div>
    <div class="msg err" id="revMsg"></div>
  </div>
</div>

<datalist id="subjectList"></datalist>

<div class="modal" id="modal" hidden>
  <div class="modal-box" style="max-width:520px">
    <div class="modal-head">
      <h2 id="mTitle"></h2>
      <button class="ib" id="mClose" title="Закрыть"></button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();

const $ = id => document.getElementById(id);
const EMP_ID = new URLSearchParams(location.search).get('id');
let TARGET = null;      // сотрудник, чьё дело смотрим
let CAN_HR = false;     // кадровые данные и документы
let CAN_REVIEW = false; // компетенции и оценка

(async () => {
  if(!await requireAuth()) return;
  if(!EMP_ID){ location.replace('admin.html'); return; }

  await Promise.all([loadEmployees(), loadBranches()]);

  const { data, error } = await sb.from('employees')
    .select('id, full_name, role, position, branch_id, manager_id, phone, is_active')
    .eq('id', EMP_ID).maybeSingle();
  if(error){ fatal('Не удалось открыть личное дело', errText(error)); return; }
  if(!data){ fatal('Сотрудник не найден', 'Возможно, его удалили из платформы'); return; }
  TARGET = data;

  CAN_HR = isHrRole();
  CAN_REVIEW = CAN_HR || isManagerOf(TARGET.id);
  // ни кадровик, ни руководитель — смотреть нечего
  if(!CAN_REVIEW){ location.replace('index.html'); return; }

  renderShell({ title:'Личное дело', tab:'admin', back:'admin.html' });
  $('mClose').innerHTML = icon('x');
  $('mClose').onclick = closeModal;
  $('modal').onclick = e => { if(e.target === $('modal')) closeModal(); };
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('modal').hidden) closeModal(); });
  $('docUpload').innerHTML = icon('upload') + 'Загрузить';
  $('skillAdd').innerHTML = icon('plus') + 'Добавить компетенцию';
  $('docType').innerHTML = Object.keys(DOC_TYPE_RU)
    .map(k => '<option value="' + k + '">' + esc(DOC_TYPE_RU[k]) + '</option>').join('');

  paintPerson();

  if(CAN_HR){
    $('hrPanel').hidden = false;
    $('docPanel').hidden = false;
    $('hrSave').onclick = saveHr;
    $('docUpload').onclick = uploadDoc;
    $('salary').oninput = paintSalaryHint;
    await Promise.all([loadHr(), loadDocs()]);
  }
  if(CAN_REVIEW){
    $('skillPanel').hidden = false;
    $('reviewPanel').hidden = false;
    $('skillAdd').onclick = () => openSkillForm(null);
    $('revSave').onclick = saveReview;
    await Promise.all([loadSkills(), loadReview(), loadSubjects()]);
  }
})();

function paintPerson(){
  const br = TARGET.branch_id && BRANCH_BY_ID[TARGET.branch_id] ? BRANCH_BY_ID[TARGET.branch_id].name : null;
  const bits = [ROLE_RU[TARGET.role] || TARGET.role];
  if(TARGET.position) bits.unshift(TARGET.position);
  if(br) bits.push(br);
  if(TARGET.manager_id) bits.push('руководитель: ' + empName(TARGET.manager_id));
  $('person').innerHTML =
    '<div class="ava">' + esc(initials(TARGET.full_name)) + '</div>' +
    '<div><h1 class="pn">' + esc(TARGET.full_name) +
      (TARGET.is_active ? '' : ' <span class="tag-off">отключён</span>') + '</h1>' +
      '<p class="pp">' + esc(bits.join(' · ')) + '</p></div>';
}

/* ============================================================
   КАДРОВЫЕ ДАННЫЕ — одна строка на сотрудника, пишем через upsert
   ============================================================ */
async function loadHr(){
  const { data, error } = await sb.from('employee_hr').select('*').eq('employee_id', EMP_ID).maybeSingle();
  if(error){ $('hrMsg').textContent = errText(error); return; }
  if(!data){ $('currency').value = 'TJS'; paintSalaryHint(); return; }
  $('hireDate').value = data.hire_date || '';
  $('birthDate').value = data.birth_date || '';
  $('address').value = data.address || '';
  $('passport').value = data.passport_no || '';
  $('salary').value = data.salary === null || data.salary === undefined ? '' : String(data.salary);
  $('currency').value = data.currency || 'TJS';
  $('bonus').value = data.bonus_scheme || '';
  $('nda').value = data.nda_signed_at || '';
  $('hrNotes').value = data.hr_notes || '';
  paintSalaryHint();
  if(data.updated_at){
    $('hrTitle').innerHTML = 'Кадровые данные <span style="text-transform:none;letter-spacing:0">· ' +
      esc(empName(data.updated_by)) + ', ' + esc(fmtWhen(data.updated_at)) + '</span>';
  }
}
function parseMoney(v){
  const clean = String(v || '').replace(/\s/g, '').replace(',', '.');
  if(!clean) return null;
  const n = Number(clean);
  return isNaN(n) ? NaN : n;
}
function paintSalaryHint(){
  const n = parseMoney($('salary').value);
  $('salaryHint').textContent = (n === null) ? ''
    : isNaN(n) ? 'Оклад — это число' : fmtMoney(n, $('currency').value.trim() || 'TJS');
}
async function saveHr(){
  const msg = $('hrMsg'), btn = $('hrSave');
  msg.className = 'msg err'; msg.textContent = '';
  const salary = parseMoney($('salary').value);
  if(isNaN(salary)){ msg.textContent = 'Оклад должен быть числом'; return; }

  btn.disabled = true; btn.textContent = 'Сохраняем…';
  const { error } = await sb.from('employee_hr').upsert({
    employee_id: EMP_ID,
    hire_date: $('hireDate').value || null,
    birth_date: $('birthDate').value || null,
    address: $('address').value.trim() || null,
    passport_no: $('passport').value.trim() || null,
    salary,
    currency: $('currency').value.trim() || 'TJS',
    bonus_scheme: $('bonus').value.trim() || null,
    nda_signed_at: $('nda').value || null,
    hr_notes: $('hrNotes').value.trim() || null,
    updated_by: ME.id,
    updated_at: new Date().toISOString()
  }, { onConflict:'employee_id' });
  btn.disabled = false; btn.textContent = 'Сохранить кадровые данные';
  if(error){ msg.textContent = errText(error, 'update'); return; }
  msg.className = 'msg ok'; msg.textContent = 'Сохранено';
  await loadHr();
}

/* ============================================================
   ДОКУМЕНТЫ — приватное хранилище crm-docs
   Прямых ссылок нет: открываем по временной ссылке на минуту.
   ============================================================ */
const MAX_SIZE = 10 * 1024 * 1024;
const OK_TYPES = ['image/jpeg','image/png','image/webp','application/pdf'];

async function loadDocs(){
  const { data, error } = await sb.from('employee_docs')
    .select('id, doc_type, title, file_path, file_name, size_bytes, uploaded_by, created_at')
    .eq('employee_id', EMP_ID).order('created_at', { ascending:false });
  if(error){ $('docList').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  const rows = data || [];
  $('docList').innerHTML = rows.length
    ? rows.map(d =>
        '<div class="docrow">' +
          '<span class="di">' + icon('file') + '</span>' +
          '<div class="dm">' +
            '<div class="dt">' + esc(d.title || DOC_TYPE_RU[d.doc_type] || d.doc_type) + '</div>' +
            '<div class="ds">' + esc(DOC_TYPE_RU[d.doc_type] || d.doc_type) + ' · ' +
              esc(d.file_name) + ' · ' + esc(fmtSize(d.size_bytes)) + ' · ' +
              esc(fmtWhen(d.created_at)) + '</div>' +
          '</div>' +
          '<div class="da">' +
            '<button class="btn ghost sm" data-open="' + d.id + '">Открыть</button>' +
            '<button class="btn danger sm" data-del="' + d.id + '">' + icon('trash') + '</button>' +
          '</div>' +
        '</div>').join('')
    : '<div class="empty">Документов пока нет</div>';

  $('docList').querySelectorAll('[data-open]').forEach(b => {
    const d = rows.find(x => x.id === Number(b.dataset.open));
    b.onclick = () => openDoc(d);
  });
  $('docList').querySelectorAll('[data-del]').forEach(b => {
    const d = rows.find(x => x.id === Number(b.dataset.del));
    b.onclick = () => removeDoc(d);
  });
}

async function openDoc(d){
  // окно открываем сразу по клику, иначе браузер сочтёт его всплывающим и закроет
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from('crm-docs').createSignedUrl(d.file_path, 60);
  if(error || !data){
    if(w) w.close();
    $('docMsg').className = 'msg err';
    $('docMsg').textContent = errText(error || { message:'Файл недоступен' });
    return;
  }
  if(w) w.location.href = data.signedUrl;
  else location.href = data.signedUrl;
}

async function uploadDoc(){
  const msg = $('docMsg'), btn = $('docUpload'), input = $('docFile');
  msg.className = 'msg err'; msg.textContent = '';
  const file = input.files && input.files[0];
  if(!file){ msg.textContent = 'Выберите файл'; return; }
  if(file.size > MAX_SIZE){ msg.textContent = 'Файл больше 10 МБ — уменьшите или сожмите'; return; }
  if(OK_TYPES.indexOf(file.type) === -1){
    msg.textContent = 'Такой тип файла нельзя. Подойдут jpg, png, webp и pdf';
    return;
  }

  // в путь кладём безопасное имя латиницей, настоящее сохраняем отдельным полем
  const path = EMP_ID + '/' + Date.now() + '_' + safeFileName(file.name);

  btn.disabled = true; btn.textContent = 'Загружаем…';
  const up = await sb.storage.from('crm-docs').upload(path, file, { contentType:file.type });
  if(up.error){
    btn.disabled = false; btn.innerHTML = icon('upload') + 'Загрузить';
    msg.textContent = errText(up.error);
    return;
  }
  const { error } = await sb.from('employee_docs').insert({
    employee_id: EMP_ID,
    doc_type: $('docType').value,
    title: $('docTitle').value.trim() || null,
    file_path: path,
    file_name: file.name,
    size_bytes: file.size,
    uploaded_by: ME.id
  });
  btn.disabled = false; btn.innerHTML = icon('upload') + 'Загрузить';
  if(error){
    // строка не записалась — не оставляем висеть файл в хранилище
    await sb.storage.from('crm-docs').remove([path]);
    msg.textContent = errText(error, 'insert');
    return;
  }
  input.value = ''; $('docTitle').value = '';
  msg.className = 'msg ok'; msg.textContent = 'Документ загружен';
  await loadDocs();
}

function removeDoc(d){
  openModal('Удалить документ?',
    '<p class="text-block">' + esc(d.title || d.file_name) + ' будет удалён без возможности вернуть.</p>',
    'Удалить', async () => {
      mBusy(true, 'Удаляем…');
      // сначала файл из хранилища, потом строку в базе
      const rm = await sb.storage.from('crm-docs').remove([d.file_path]);
      if(rm.error){ mBusy(false, 'Удалить'); return mFail(errText(rm.error)); }
      const { error } = await sb.from('employee_docs').delete().eq('id', d.id);
      if(error){ mBusy(false, 'Удалить'); return mFail(errText(error)); }
      closeModal();
      await loadDocs();
    });
}

/* ============================================================
   КОМПЕТЕНЦИИ И ОЦЕНКА
   Видят HR, директор и руководитель сотрудника — так же решает и база.
   ============================================================ */
let SKILLS = [];

async function loadSkills(){
  const { data, error } = await sb.from('employee_skills')
    .select('id, subject, level, note, rated_by, rated_at')
    .eq('employee_id', EMP_ID).order('subject');
  if(error){ $('skillList').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  SKILLS = data || [];
  $('skillList').innerHTML = SKILLS.length
    ? SKILLS.map(s =>
        '<div class="skillrow">' +
          '<span class="sn">' + esc(s.subject) + '</span>' +
          dotsHTML(s.level) +
          '<button class="btn ghost sm" data-edit="' + s.id + '">' + icon('edit') + '</button>' +
          '<button class="btn danger sm" data-del="' + s.id + '">' + icon('trash') + '</button>' +
          (s.note ? '<span class="sd">' + esc(s.note) + '</span>' : '') +
        '</div>').join('')
    : '<div class="empty">Компетенции не заполнены</div>';

  $('skillList').querySelectorAll('[data-edit]').forEach(b =>
    b.onclick = () => openSkillForm(SKILLS.find(x => x.id === Number(b.dataset.edit))));
  $('skillList').querySelectorAll('[data-del]').forEach(b =>
    b.onclick = () => removeSkill(SKILLS.find(x => x.id === Number(b.dataset.del))));
}

function dotsHTML(level){
  let out = '<span class="dots" title="Уровень ' + (level || 0) + ' из 5">';
  for(let i = 1; i <= 5; i++) out += '<i class="' + (i <= (level || 0) ? 'on' : '') + '"></i>';
  return out + '</span>';
}

/* Предметы компетенций — свой справочник crm.skill_subjects.
   Читать может любой, добавлять — HR, директор и админ. */
let SUBJECTS = [];
async function loadSubjects(){
  const { data, error } = await sb.from('skill_subjects')
    .select('id, name').eq('is_active', true).order('sort').order('name');
  if(error){ console.warn('skill_subjects', error); return; }
  SUBJECTS = data || [];
  $('subjectList').innerHTML = SUBJECTS.map(s => '<option value="' + esc(s.name) + '">').join('');
}

/* «+» рядом с полем: заводит предмет в справочник и оставляет его в форме.
   Если прав нет, база откажет — показываем отказ, ввод остаётся обычным текстом. */
async function addSubject(){
  const name = $('skSubject').value.trim();
  if(!name) return mFail('Сначала впишите название предмета');
  const same = SUBJECTS.find(s => s.name.toLowerCase() === name.toLowerCase());
  if(same){ $('skSubject').value = same.name; return mFail('Такой предмет уже есть в справочнике'); }

  const btn = $('skAddSubject');
  btn.disabled = true;
  const { error } = await sb.from('skill_subjects').insert({ name, created_by: ME.id });
  btn.disabled = false;
  if(error) return mFail(errText(error, 'insert'));

  await loadSubjects();
  $('skSubject').value = name;
  const m = $('mMsg');
  m.className = 'msg ok';
  m.textContent = 'Предмет «' + name + '» добавлен в справочник';
}

function openSkillForm(s){
  const lvl = s ? (s.level || 0) : 0;
  openModal(s ? 'Компетенция — ' + s.subject : 'Новая компетенция',
    '<div class="field">' +
      '<label class="field-label" for="skSubject">Предмет <span class="req">*</span></label>' +
      (s
        ? '<input id="skSubject" maxlength="120" value="' + esc(s.subject) + '" readonly>'
        : '<div class="inline-add">' +
            '<input id="skSubject" list="subjectList" maxlength="120" placeholder="Материал, бренд или навык">' +
            '<button class="btn ghost" id="skAddSubject" type="button" title="Добавить в справочник">' +
              icon('plus') + '</button>' +
          '</div>') +
      '<div class="hint">' + (s ? 'Предмет не меняется — удалите строку и заведите новую'
                                : 'Выберите из справочника или впишите свой и нажмите «+»') + '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">Уровень</label>' +
      '<div class="dots pick" id="skDots"></div>' +
      '<div class="hint" id="skLvlHint"></div>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label" for="skNote">Заметка</label>' +
      '<textarea id="skNote" rows="2">' + (s && s.note ? esc(s.note) : '') + '</textarea>' +
    '</div>',
    'Сохранить', () => saveSkill(s));

  let cur = lvl;
  const paint = () => {
    let h = '';
    for(let i = 1; i <= 5; i++) h += '<i class="' + (i <= cur ? 'on' : '') + '" data-l="' + i + '"></i>';
    $('skDots').innerHTML = h;
    const names = ['не задан','не знает','знает основы','уверенно работает','сильный','эксперт'];
    $('skLvlHint').textContent = names[cur] || '';
    $('skDots').querySelectorAll('i').forEach(d =>
      d.onclick = () => { cur = Number(d.dataset.l); paint(); });
  };
  paint();
  window.__skillLevel = () => cur;
  if(!s){
    $('skAddSubject').onclick = addSubject;
    $('skSubject').focus();
  }
}

async function saveSkill(s){
  const subject = $('skSubject').value.trim();
  const level = window.__skillLevel();
  if(!subject) return mFail('Впишите предмет');
  if(!level) return mFail('Поставьте уровень от 1 до 5');

  mBusy(true, 'Сохраняем…');
  const { error } = await sb.from('employee_skills').upsert({
    employee_id: EMP_ID,
    subject,
    level,
    note: $('skNote').value.trim() || null,
    rated_by: ME.id,
    rated_at: new Date().toISOString()
  }, { onConflict:'employee_id,subject' });
  if(error){ mBusy(false, 'Сохранить'); return mFail(errText(error, 'update')); }
  closeModal();
  await loadSkills();
}

function removeSkill(s){
  openModal('Убрать компетенцию?',
    '<p class="text-block">Оценка по предмету «' + esc(s.subject) + '» будет удалена.</p>',
    'Убрать', async () => {
      mBusy(true, 'Убираем…');
      const { error } = await sb.from('employee_skills').delete().eq('id', s.id);
      if(error){ mBusy(false, 'Убрать'); return mFail(errText(error)); }
      closeModal();
      await loadSkills();
    });
}

async function loadReview(){
  const { data, error } = await sb.from('employee_review').select('*').eq('employee_id', EMP_ID).maybeSingle();
  if(error){ $('revMsg').textContent = errText(error); return; }
  if(!data) return;
  $('strengths').value = data.strengths || '';
  $('weaknesses').value = data.weaknesses || '';
  $('achievements').value = data.achievements || '';
}

async function saveReview(){
  const msg = $('revMsg'), btn = $('revSave');
  msg.className = 'msg err'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  const { error } = await sb.from('employee_review').upsert({
    employee_id: EMP_ID,
    strengths: $('strengths').value.trim() || null,
    weaknesses: $('weaknesses').value.trim() || null,
    achievements: $('achievements').value.trim() || null,
    updated_by: ME.id,
    updated_at: new Date().toISOString()
  }, { onConflict:'employee_id' });
  btn.disabled = false; btn.textContent = 'Сохранить оценку';
  if(error){ msg.textContent = errText(error, 'update'); return; }
  msg.className = 'msg ok'; msg.textContent = 'Сохранено';
}

/* ---------- модалка ---------- */
function openModal(title, bodyHTML, saveLabel, onSave){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = bodyHTML +
    '<div class="btn-row" style="margin-top:16px">' +
      (saveLabel ? '<button class="btn" id="mSave" style="flex:1">' + esc(saveLabel) + '</button>' : '') +
      '<button class="btn ghost" id="mCancel">Отмена</button>' +
    '</div><div class="msg err" id="mMsg"></div>';
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
  $('mCancel').onclick = closeModal;
  if(saveLabel) $('mSave').onclick = onSave;
}
function closeModal(){ $('modal').hidden = true; document.body.style.overflow = ''; }
function mFail(text){ const m = $('mMsg'); if(m){ m.className = 'msg err'; m.textContent = text; } }
function mBusy(on, label){ const b = $('mSave'); if(b){ b.disabled = on; b.textContent = label; if(on) mFail(''); } }
</script>
</body>
