<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Сегодня</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1>Сегодня</h1></div>
  <div class="pad" style="padding-bottom:0"><div id="hello" class="sub"></div></div>

  <div class="stats" id="stats">
    <button class="stat late"><span class="n" id="nLate">—</span><span class="c">Просрочено</span></button>
    <button class="stat today"><span class="n" id="nToday">—</span><span class="c">Срок сегодня</span></button>
    <button class="stat review"><span class="n" id="nReview">—</span><span class="c">На проверке у меня</span></button>
  </div>

  <div class="sec">Ближайшие задачи</div>
  <div class="rows" id="soon"><div class="loading">Загрузка…</div></div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);

(async () => {
  if(!await requireAuth()) return;
  renderShell({ title:'Сегодня', tab:'home' });
  await loadEmployees();

  const h = new Date().getHours();
  const hi = h < 6 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  $('hello').textContent = hi + ', ' + ME.full_name;

  const stats = $('stats').children;
  stats[0].onclick = () => location.href = 'tasks.html?tab=mine&f=overdue';
  stats[1].onclick = () => location.href = 'tasks.html?tab=mine&f=today';
  stats[2].onclick = () => location.href = 'tasks.html?tab=author&f=review';

  await load();
  maybeInviteNotifications();
})();

async function load(){
  const active = ['new','in_progress','review'];
  const [mine, review] = await Promise.all([
    sb.from('v_tasks').select(TASK_COLS).is('archived_at', null)
      .eq('assignee_id', ME.id).in('status', active).limit(200),
    sb.from('v_tasks').select('id').is('archived_at', null)
      .eq('author_id', ME.id).eq('status', 'review').limit(200)
  ]);

  if(mine.error){ $('soon').innerHTML = '<div class="empty">' + esc(errText(mine.error)) + '</div>'; return; }
  const rows = (mine.data || []).sort(cmpTasks);

  const endToday = endOfToday().getTime();
  $('nLate').textContent = rows.filter(t => t.is_overdue).length;
  $('nToday').textContent = rows.filter(t =>
    t.due_at && !t.is_overdue && new Date(t.due_at).getTime() <= endToday).length;
  $('nReview').textContent = (review.data || []).length;

  const soon = rows.slice(0, 12);
  $('soon').innerHTML = soon.length
    ? soon.map(t => taskRowHTML(t)).join('')
    : '<div class="empty">Активных задач нет</div>';
  $('soon').querySelectorAll('[data-task]').forEach(b =>
    b.onclick = () => location.href = 'tasks.html?task=' + b.dataset.task);
}
</script>
</body>
</html>
