<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL CRM — Меню</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
<style>
.hello{margin-bottom:22px}
.hello .who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:15px}
.ios-hint{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
.ios-hint b{color:var(--ink)}
.ios-hint svg{color:var(--brand);flex:none}
</style>
</head>
<body>
<div class="page">
  <div class="topbar" id="topbar"></div>

  <div class="hello">
    <h1 id="greet">…</h1>
    <div class="who" id="who"></div>
  </div>

  <div id="iosHint"></div>
  <div class="menu" id="menu"></div>
</div>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();

(async () => {
  if(!await requireAuth()) return;
  renderTopbar({
    actionsHTML:
      '<button class="navlink primary" id="installBtn" hidden>' + icon('download') + 'Установить приложение</button>' +
      '<a class="navlink primary" href="new-task.html">' + icon('plus') + 'Поставить задачу</a>'
  });
  document.getElementById('installBtn').onclick = doInstall;
  showInstallBtn();   // событие могло прийти до отрисовки шапки

  // в Safari на iPhone своего окна установки нет — объясняем словами
  if(isIOS() && !isStandalone()){
    document.getElementById('iosHint').innerHTML =
      '<div class="ios-hint">' + icon('share') +
      '<span>Чтобы добавить платформу на телефон: <b>Поделиться</b> → <b>На экран «Домой»</b></span></div>';
  }

  const h = new Date().getHours();
  const hi = h < 6 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  document.getElementById('greet').textContent = hi + ', ' + ME.full_name;
  document.getElementById('who').innerHTML =
    (ME.position ? '<span>' + esc(ME.position) + '</span><span>·</span>' : '') +
    '<span>' + esc(ROLE_RU[ME.role] || ME.role) + '</span>';

  const items = [
    { t:'Мои задачи', d:'Что поручено мне: сроки, статусы, отчёт',
      h:'tasks.html?tab=mine', i:'list' },
    { t:'Поставленные мной', d:'Контроль исполнения по моим поручениям',
      h:'tasks.html?tab=author', i:'target' },
    { t:'Все задачи', d:'Полный список в рамках моих прав',
      h:'tasks.html?tab=all', i:'layers' },
    { t:'Сводный календарь', d:'Дедлайны по всем задачам на одной сетке',
      i:'calendar', soon:true },
    { t:'Ссылки и планы', d:'KPI, планы продаж и рабочие документы',
      h:'links.html', i:'link' },
    { t:'Сотрудники', d:'Люди, филиалы, подчинение и личные дела',
      h:'admin.html', i:'users', roles:['admin','director','hr'] }
  ];

  document.getElementById('menu').innerHTML = items
    .filter(i => !i.roles || i.roles.includes(ME.role))
    .map(i => i.soon
      ? '<div class="mcard soon"><span class="soon-tag">скоро</span>' +
        '<div class="ic">' + icon(i.i) + '</div><h3>' + esc(i.t) + '</h3><p>' + esc(i.d) + '</p></div>'
      : '<a class="mcard" href="' + i.h + '"><div class="ic">' + icon(i.i) + '</div>' +
        '<h3>' + esc(i.t) + '</h3><p>' + esc(i.d) + '</p></a>')
    .join('');
})();
</script>
</body>
</html>
