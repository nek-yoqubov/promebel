<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Ссылки и планы</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main">
  <div class="pagehead"><h1>Ссылки и планы</h1></div>

  <div id="list"><div class="loading">Загрузка…</div></div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box" style="max-width:620px">
    <div class="modal-head">
      <h2 id="mTitle"></h2>
      <button class="ib" id="mClose" title="Закрыть"></button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();

const $ = id => document.getElementById(id);
let LINKS = [];
let CAN_EDIT = false;

(async () => {
  if(!await requireAuth()) return;
  CAN_EDIT = isBossRole();

  renderShell({
    title:'Ссылки и планы',
    tab:'links',
    actions: CAN_EDIT ? '<button class="ib" id="addLink" aria-label="Добавить ссылку">' + icon('plus') + '</button>' : ''
  });
  if(CAN_EDIT) $('addLink').onclick = () => openForm(null);

  $('mClose').innerHTML = icon('x');
  $('mClose').onclick = closeModal;
  $('modal').onclick = e => { if(e.target === $('modal')) closeModal(); };
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  if(CAN_EDIT) await loadEmployees();
  await load();
})();

/* Видимость фильтрует база: показываем ровно то, что она вернула */
async function load(){
  const { data, error } = await sb.from('links')
    .select('id, category, title, url, description, visible_roles, visible_to, sort, is_active')
    .order('category').order('sort').order('title');
  if(error){ $('list').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  LINKS = data || [];
  paint();
}

function host(url){
  try{ return new URL(url).host.replace(/^www\./, ''); }
  catch(e){ return url; }
}

function paint(){
  if(!LINKS.length){
    $('list').innerHTML = '<div class="empty">' +
      (CAN_EDIT ? 'Ссылок пока нет — добавьте первую' : 'Для вас пока не открыли ни одной ссылки') +
      '</div>';
    return;
  }
  let html = '';
  LINK_CAT_ORDER.forEach(cat => {
    const rows = LINKS.filter(l => l.category === cat);
    if(!rows.length) return;
    html += '<div class="lgroup"><div class="sec">' + esc(LINK_CAT_RU[cat]) + '</div>' +
      '<div class="lgrid">' + rows.map(cardHTML).join('') + '</div></div>';
  });
  // категория, которой нет в словаре
  const rest = LINKS.filter(l => LINK_CAT_ORDER.indexOf(l.category) === -1);
  if(rest.length){
    html += '<div class="lgroup"><div class="sec">Прочее</div>' +
      '<div class="lgrid">' + rest.map(cardHTML).join('') + '</div></div>';
  }
  $('list').innerHTML = html;

  $('list').querySelectorAll('[data-edit]').forEach(b =>
    b.onclick = () => openForm(LINKS.find(l => l.id === Number(b.dataset.edit))));
  $('list').querySelectorAll('[data-del]').forEach(b =>
    b.onclick = () => removeLink(LINKS.find(l => l.id === Number(b.dataset.del))));
}

function cardHTML(l){
  return '<div class="lcard' + (l.is_active ? '' : ' off') + '">' +
    '<a class="lt" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      esc(l.title) + icon('external') + '</a>' +
    (l.description ? '<div class="ld">' + esc(l.description) + '</div>' : '') +
    '<div class="lh">' + esc(host(l.url)) + '</div>' +
    (l.is_active ? '' : '<div><span class="tag-off">выключена</span></div>') +
    (CAN_EDIT
      ? '<div class="ladmin">' +
          '<button class="btn ghost sm" data-edit="' + l.id + '">' + icon('edit') + 'Изменить</button>' +
          '<button class="btn danger sm" data-del="' + l.id + '">' + icon('trash') + '</button>' +
        '</div>'
      : '') +
  '</div>';
}

/* ============================================================
   ФОРМА — только админ и директор
   ============================================================ */
function openForm(l){
  const isNew = !l;
  const roles = (l && l.visible_roles) || [];
  const people = (l && l.visible_to) || [];

  const cats = Object.keys(LINK_CAT_RU).map(k =>
    '<option value="' + k + '"' + (l && l.category === k ? ' selected' : '') + '>' +
    esc(LINK_CAT_RU[k]) + '</option>').join('');

  const roleBoxes = Object.keys(ROLE_RU).map(k =>
    '<label class="chk"><input type="checkbox" class="r-chk" value="' + k + '"' +
    (roles.indexOf(k) !== -1 ? ' checked' : '') + '>' + esc(ROLE_RU[k]) + '</label>').join('');

  const peopleBoxes = EMPS.map(e =>
    '<label class="chk p-row" data-name="' + esc((e.full_name || '').toLowerCase()) + '">' +
    '<input type="checkbox" class="p-chk" value="' + esc(e.id) + '"' +
    (people.indexOf(e.id) !== -1 ? ' checked' : '') + '>' + esc(e.full_name) + '</label>').join('');

  openModal(isNew ? 'Новая ссылка' : 'Ссылка — ' + l.title,
    '<div class="row2">' +
      '<div class="field">' +
        '<label class="field-label" for="fCat">Категория</label>' +
        '<select id="fCat">' + cats + '</select>' +
      '</div>' +
      '<div class="field">' +
        '<label class="field-label" for="fSort">Порядок</label>' +
        '<input id="fSort" class="num" type="number" min="1" max="999" value="' +
          (l ? l.sort : 100) + '">' +
        '<div class="hint">Меньше — выше в списке</div>' +
      '</div>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label" for="fTitle">Название <span class="req">*</span></label>' +
      '<input id="fTitle" maxlength="120" value="' + (l ? esc(l.title) : '') + '">' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label" for="fUrl">Адрес <span class="req">*</span></label>' +
      '<input id="fUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://..." value="' +
        (l ? esc(l.url) : '') + '">' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label" for="fDesc">Описание</label>' +
      '<textarea id="fDesc" rows="2">' + (l && l.description ? esc(l.description) : '') + '</textarea>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label">Кто увидит ссылку</label>' +
      '<div class="hint" style="margin:0 0 8px">Можно отметить роли целиком и добавить отдельных людей</div>' +
      '<div class="pickbox"><div class="rolegrid">' + roleBoxes + '</div></div>' +
    '</div>' +
    '<div class="field">' +
      '<label class="field-label" for="pSearch">Отдельные сотрудники</label>' +
      '<input id="pSearch" type="search" placeholder="Поиск по имени" autocomplete="off" style="margin-bottom:8px">' +
      '<div class="pickbox" id="pBox">' + (peopleBoxes || '<span class="sub">Сотрудников нет</span>') + '</div>' +
    '</div>' +
    '<label class="chk"><input type="checkbox" id="fActive"' +
      (isNew || l.is_active ? ' checked' : '') + '>Ссылка включена</label>',
    isNew ? 'Добавить' : 'Сохранить', () => save(l));

  $('pSearch').oninput = () => {
    const q = $('pSearch').value.trim().toLowerCase();
    $('pBox').querySelectorAll('.p-row').forEach(r => {
      r.style.display = (!q || r.dataset.name.indexOf(q) !== -1) ? '' : 'none';
    });
  };
  if(isNew) $('fTitle').focus();
}

async function save(l){
  const title = $('fTitle').value.trim();
  let url = $('fUrl').value.trim();
  if(!title) return mFail('Впишите название');
  if(!url) return mFail('Впишите адрес ссылки');
  if(/\s/.test(url)) return mFail('В адресе не должно быть пробелов');
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  let parsed;
  try{ parsed = new URL(url); }catch(e){ return mFail('Адрес выглядит неправильно'); }
  // URL() глотает почти всё, поэтому отдельно проверяем домен
  if(parsed.hostname !== 'localhost' && !/^[^\s.]+(\.[^\s.]+)+$/.test(parsed.hostname))
    return mFail('Адрес выглядит неправильно — проверьте домен');

  const row = {
    category: $('fCat').value,
    title,
    url,
    description: $('fDesc').value.trim() || null,
    visible_roles: [...document.querySelectorAll('.r-chk')].filter(c => c.checked).map(c => c.value),
    visible_to: [...document.querySelectorAll('.p-chk')].filter(c => c.checked).map(c => c.value),
    sort: Number($('fSort').value) || 100,
    is_active: $('fActive').checked
  };

  mBusy(true, 'Сохраняем…');
  let error;
  if(l){
    ({ error } = await sb.from('links').update(row).eq('id', l.id));
  }else{
    row.created_by = ME.id;
    ({ error } = await sb.from('links').insert(row));
  }
  if(error){ mBusy(false, l ? 'Сохранить' : 'Добавить'); return mFail(errText(error, l ? 'update' : 'insert')); }
  closeModal();
  await load();
}

function removeLink(l){
  openModal('Удалить ссылку?',
    '<p class="text-block">«' + esc(l.title) + '» пропадёт у всех, кому она была видна. ' +
    'Если нужно только спрятать — снимите галочку «Ссылка включена».</p>',
    'Удалить', async () => {
      mBusy(true, 'Удаляем…');
      const { error } = await sb.from('links').delete().eq('id', l.id);
      if(error){ mBusy(false, 'Удалить'); return mFail(errText(error)); }
      closeModal();
      await load();
    });
}

/* ---------- модалка ---------- */
function openModal(title, bodyHTML, saveLabel, onSave){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = bodyHTML +
    '<div class="btn-row" style="margin-top:16px">' +
      (saveLabel ? '<button class="btn" id="mSave" style="flex:1">' + esc(saveLabel) + '</button>' : '') +
      '<button class="btn ghost" id="mCancel">Отмена</button>' +
    '</div><div class="msg err" id="mMsg"></div>';
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
  $('mCancel').onclick = closeModal;
  if(saveLabel) $('mSave').onclick = onSave;
}
function closeModal(){ $('modal').hidden = true; document.body.style.overflow = ''; }
function mFail(text){ const m = $('mMsg'); if(m){ m.className = 'msg err'; m.textContent = text; } }
function mBusy(on, label){ const b = $('mSave'); if(b){ b.disabled = on; b.textContent = label; if(on) mFail(''); } }
</script>
</body>
</html>
