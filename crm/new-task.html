<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Новая задача</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
<style>
.wrap{max-width:620px;margin:0 auto}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.quick button{flex:1;min-width:92px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three button{height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink-2);font:700 14px 'Manrope';cursor:pointer;transition:all .15s}
.three button.on{border-color:transparent;background:var(--brand);color:var(--brand-ink)}
.three button.on.high{background:var(--warn)}
.three button.on.critical{background:var(--late);color:#fff}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 6px;
  border-top:1px solid var(--line);margin-top:8px}
.plist{max-height:230px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.pitem{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;
  background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);
  font:600 15px 'Manrope';text-align:left;cursor:pointer}
.pitem:last-child{border-bottom:none}
.pitem.on{background:var(--card-2)}
.pitem i{font-style:normal;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>
<body>
<main class="main" id="main">
  <div class="pad wrap">
    <div class="field">
      <label class="field-label" for="title">Название <span class="req">*</span></label>
      <input id="title" maxlength="200" placeholder="Что нужно сделать">
    </div>

    <div class="field">
      <label class="field-label" for="who">Исполнитель <span class="req">*</span></label>
      <input id="who" type="search" placeholder="Поиск по имени" autocomplete="off">
      <div class="plist" id="plist" style="margin-top:8px"></div>
      <div class="hint" id="whoHint"></div>
    </div>

    <div class="field">
      <label class="field-label">Срок</label>
      <div class="quick">
        <button class="btn ghost sm" data-q="today">Сегодня</button>
        <button class="btn ghost sm" data-q="tomorrow">Завтра</button>
        <button class="btn ghost sm" data-q="week">Через неделю</button>
      </div>
      <input id="due" class="num" type="datetime-local">
    </div>

    <div class="field">
      <label class="field-label">Приоритет</label>
      <div class="three" id="prio">
        <button data-p="normal" class="on">Обычный</button>
        <button data-p="high" class="high">Высокий</button>
        <button data-p="critical" class="critical">Критический</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="description">Описание</label>
      <textarea id="description" rows="3" placeholder="Подробности, вводные, ссылки"></textarea>
    </div>

    <div class="field">
      <label class="field-label" for="criteria">Критерий выполнения</label>
      <textarea id="criteria" rows="2" placeholder="По чему считаем задачу закрытой"></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label class="field-label" for="branch">Филиал</label>
        <select id="branch"></select>
      </div>
      <div class="field">
        <label class="field-label" for="parent">Родительская задача</label>
        <select id="parent"></select>
      </div>
    </div>

    <div class="sticky">
      <button class="btn block" id="save">Поставить задачу</button>
      <div class="msg err" id="msg"></div>
    </div>
  </div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let ASSIGNEE = null, PRIORITY = 'normal';

(async () => {
  if(!await requireAuth()) return;
  renderShell({ title:'Новая задача', tab:'add', back:'tasks.html' });

  await Promise.all([loadEmployees(), loadBranches()]);
  paintPeople('');
  fillBranches();
  await fillParents();

  $('who').oninput = () => paintPeople($('who').value.trim().toLowerCase());
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => quickDue(b.dataset.q));
  document.querySelectorAll('#prio button').forEach(b => b.onclick = () => {
    PRIORITY = b.dataset.p;
    document.querySelectorAll('#prio button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('save').onclick = save;
  $('title').focus();
})();

/* Сверху те, кому база точно разрешит: я и мои подчинённые */
function paintPeople(q){
  const ok = EMPS.filter(e => canAssignTo(e.id));
  const rest = EMPS.filter(e => !canAssignTo(e.id));
  const match = e => !q || (e.full_name || '').toLowerCase().includes(q) ||
                          (e.position || '').toLowerCase().includes(q);
  const rows = ok.filter(match).concat(rest.filter(match)).slice(0, 40);
  $('plist').innerHTML = rows.length
    ? rows.map(e =>
        '<button class="pitem' + (ASSIGNEE === e.id ? ' on' : '') + '" data-id="' + esc(e.id) + '">' +
        '<span class="ava" style="width:30px;height:30px;font-size:12px;border-radius:9px">' +
          esc(initials(e.full_name)) + '</span>' +
        '<span>' + esc(e.full_name) + (e.position ? ' <i>' + esc(e.position) + '</i>' : '') + '</span>' +
        '</button>').join('')
    : '<div class="empty" style="padding:18px">Никого не нашлось</div>';
  $('plist').querySelectorAll('.pitem').forEach(b => b.onclick = () => {
    ASSIGNEE = b.dataset.id;
    paintPeople(q);
    $('whoHint').textContent = canAssignTo(ASSIGNEE)
      ? '' : 'Это не ваш подчинённый — база, скорее всего, откажет в постановке.';
  });
}
function quickDue(kind){
  const d = new Date();
  if(kind === 'tomorrow') d.setDate(d.getDate() + 1);
  if(kind === 'week') d.setDate(d.getDate() + 7);
  d.setHours(18, 0, 0, 0);
  $('due').value = isoToLocalInput(d);
}
function fillBranches(){
  $('branch').innerHTML = '<option value="">Не указан</option>' +
    BRANCHES.map(b => '<option value="' + b.id + '"' +
      (b.id === ME.branch_id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('');
}
async function fillParents(){
  const { data } = await sb.from('v_tasks').select('id,title,status')
    .in('status', ['new','in_progress','review']).is('archived_at', null)
    .order('created_at', { ascending:false }).limit(200);
  const rows = data || [], pre = qs.get('parent');
  $('parent').innerHTML = '<option value="">Нет, самостоятельная</option>' +
    rows.map(t => '<option value="' + t.id + '"' + (String(t.id) === pre ? ' selected' : '') + '>№' +
      t.id + ' — ' + esc(t.title) + '</option>').join('');
  if(pre && !rows.some(t => String(t.id) === pre)){
    $('parent').insertAdjacentHTML('beforeend',
      '<option value="' + esc(pre) + '" selected>№' + esc(pre) + '</option>');
  }
}

async function save(){
  const msg = $('msg'), btn = $('save');
  msg.className = 'msg err'; msg.textContent = '';
  const title = $('title').value.trim();
  if(!title){ msg.textContent = 'Впишите название задачи'; $('title').focus(); return; }
  if(!ASSIGNEE){ msg.textContent = 'Выберите исполнителя'; $('who').focus(); return; }
  const due = localToISO($('due').value);
  if($('due').value && !due){ msg.textContent = 'Срок указан неверно'; return; }

  btn.disabled = true; btn.textContent = 'Сохраняем…';
  const { error } = await sb.from('tasks').insert({
    title,
    description: $('description').value.trim() || null,
    author_id: ME.id,                       // постановщик всегда я
    assignee_id: ASSIGNEE,
    parent_id: $('parent').value ? Number($('parent').value) : null,
    branch_id: $('branch').value ? Number($('branch').value) : null,
    priority: PRIORITY,
    status: 'new',
    due_at: due,
    done_criteria: $('criteria').value.trim() || null
  });
  if(error){
    msg.textContent = errText(error, 'task-add');
    btn.disabled = false; btn.textContent = 'Поставить задачу';
    return;
  }
  playDone();
  setTimeout(() => location.replace('tasks.html?tab=author'), 900);
}
</script>
</body>
</html>
