<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Оргструктура</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
<style>
.og-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 16px 8px}
.og-top input{flex:1;min-width:200px;height:42px;border-radius:12px;padding:0 12px}
.og-top .seg{min-width:230px}
.og-sum{padding:0 16px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.og-sum .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin:0 4px 1px 0;vertical-align:middle}

/* верх схемы: учредители и линии к директорам */
.og-chart{padding:0 16px 32px}
.og-root{display:flex;justify-content:center}
.og-rootcard{padding:10px 22px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:800;font-size:15px;position:relative}
.og-rootcard::after{content:'';position:absolute;left:50%;top:100%;height:22px;border-left:2px solid var(--line-2)}
.og-dirs{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px;margin-top:22px;align-items:start}
.og-col{position:relative;padding-top:22px}
.og-col::before{content:'';position:absolute;left:50%;top:0;height:22px;border-left:2px solid var(--line-2)}
.og-col::after{content:'';position:absolute;top:0;left:-10px;right:-10px;border-top:2px solid var(--line-2)}
.og-col:first-child::after{left:50%}
.og-col:last-child::after{right:50%}

/* карточка директора — начало цветной ветки */
.og-dir{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--panel);
  border:1px solid var(--line);border-top:3px solid var(--br)}
.og-dir .ava{width:46px;height:46px;border-radius:50%;color:var(--br);background:color-mix(in srgb,var(--br) 14%,var(--card))}
.og-dir .nm{font-weight:800;font-size:16px;line-height:1.25}
.og-dir .ps{font-size:13px;color:var(--ink-2)}
.og-dir .ct{font-size:13px;color:var(--muted);margin-top:2px}
.og-dir.edit{cursor:pointer}

/* дерево ветки */
.og-tree,.og-tree ul{list-style:none;margin:0;padding:0}
.og-tree{margin-left:22px}
.og-tree ul ul{margin-left:18px}
.og-tree li{position:relative;padding:8px 0 0 20px}
.og-tree li::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:2px solid color-mix(in srgb,var(--br) 55%,transparent)}
.og-tree li:last-child::before{bottom:auto;height:30px}
.og-tree li::after{content:'';position:absolute;left:0;top:30px;width:16px;border-top:2px solid color-mix(in srgb,var(--br) 55%,transparent)}

.og-blk{display:flex;align-items:baseline;gap:8px;height:44px;align-items:center;font-weight:800;font-size:14px;color:var(--br)}
.og-blk span{font-weight:600;font-size:12px;color:var(--muted)}

.og-node{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.og-node.dim{opacity:.35}
.og-node.hit{border-color:var(--br)}
.og-nh{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:44px;padding:7px 10px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:12px}
.og-nh:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.og-nh .t{flex:1;min-width:0}
.og-nh .un{display:block;font-weight:700;font-size:14px;line-height:1.25}
.og-nh .hd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:3px;min-width:0}
.og-nh .hd b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.og-nh .hd i{font-style:normal;color:var(--muted)}
.og-nh .n{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card-2);border-radius:20px;padding:2px 8px;flex:none}
.og-nh .ch{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
.og-nh[aria-expanded="true"] .ch{transform:rotate(90deg)}
.og-node .ib{margin-right:4px}
.og-mem{border-top:1px solid var(--line);padding:4px 6px 8px}
.og-m{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:9px;font-size:13.5px}
.og-m.edit{cursor:pointer}
.og-m.edit:hover{background:var(--card-2)}
.og-m.hit{background:color-mix(in srgb,var(--br) 14%,transparent)}
.og-m .tx{min-width:0;line-height:1.25}
.og-m .ps{display:block;font-size:12px;color:var(--muted)}
.og-m .rl{font-size:11px;color:var(--br);font-weight:700;margin-left:6px}
.og-add{margin:4px 6px 0}

/* кружок с инициалами; точка — есть вход в CRM */
.og-av{position:relative;width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font:800 11px 'Manrope';color:var(--ink-2);background:var(--card-2)}
.og-av.crm::after,.og-dir .ava.crm::after{content:'';position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--ok);border:2px solid var(--card)}
.og-dir .ava{position:relative}
.og-nh .og-av{width:20px;height:20px;font-size:8.5px}
.og-nh .og-av.crm::after{width:7px;height:7px;border-width:1.5px}

.og-diff{padding:0 16px 24px}
.og-diff table{width:100%;border-collapse:collapse;font-size:14px}
.og-diff th,.og-diff td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.og-diff th{font-size:12px;color:var(--muted);font-weight:600}
.og-diff tr.ok td{color:var(--muted)}
.og-diff .bad{color:var(--warn);font-weight:700}
.og-note{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--card-2);font-size:13px;color:var(--ink-2);max-width:820px}
.og-form .field{margin-bottom:12px}
.og-form input,.og-form select{width:100%}

@media (max-width:980px){
  .og-dirs{grid-template-columns:1fr;gap:26px}
  .og-col{padding-top:0}
  .og-col::before,.og-col::after,.og-rootcard::after{display:none}
  .og-root{justify-content:flex-start;margin-bottom:14px}
  .og-dirs{margin-top:0}
}
@media (max-width:640px){ .og-diff .hide-m{display:none} }
@media (prefers-reduced-motion:reduce){ .og-nh .ch{transition:none} }
</style>
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1>Оргструктура</h1></div>
  <div class="og-top">
    <input id="q" type="search" placeholder="Поиск по имени или должности">
    <div class="seg" id="seg">
      <button data-v="scheme" class="on">Схема</button>
      <button data-v="diff">Сверка с CRM</button>
    </div>
    <button class="btn ghost sm" id="openAll">Развернуть всё</button>
    <button class="btn sm" id="addUnit" hidden>Звено</button>
  </div>
  <div class="sub og-sum" id="sum"></div>
  <div id="view"><div class="loading">Загрузка…</div></div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
let UNITS = [], PEOPLE = [], DIFF = null, VIEW = 'scheme', CAN_EDIT = false;

(async () => {
  if(!await requireAuth()) return;
  await renderShell({ title:'Оргструктура', tab:'' });
  if(!ME || !['admin','director','hr'].includes(ME.role)){ location.replace('index.html'); return; }
  // правка — админ и директора (база проверяет то же самое); в режиме просмотра — никогда
  CAN_EDIT = (ME.role === 'admin' || ME.role === 'director') && !IS_PREVIEW;
  $('addUnit').hidden = !CAN_EDIT;
  $('addUnit').insertAdjacentHTML('afterbegin', icon('plus'));
  $('addUnit').onclick = () => unitForm(null);
  $('q').addEventListener('input', paint);
  $('openAll').onclick = () => { ALL_OPEN = !ALL_OPEN; OPEN.clear(); $('openAll').textContent = ALL_OPEN ? 'Свернуть всё' : 'Развернуть всё'; paint(); };
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => {
    VIEW = b.dataset.v;
    $('seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    if(VIEW === 'diff' && !DIFF) loadDiff(); else paint();
  });
  load();
})();

async function load(){
  const [u, p] = await Promise.all([
    sb.from('org_units').select('*').order('sort').order('id'),
    sb.from('org_people').select('*').eq('is_active', true).order('sort').order('id')
  ]);
  if(u.error || p.error){ $('view').innerHTML = '<div class="empty">' + esc(errText(u.error || p.error)) + '</div>'; return; }
  UNITS = (u.data || []).filter(x => x.is_active);
  PEOPLE = p.data || [];
  DIFF = null;
  if(VIEW === 'diff') loadDiff(); else paint();
}
async function loadDiff(){
  $('view').innerHTML = '<div class="loading">Загрузка…</div>';
  const { data, error } = await sb.rpc('org_crm_diff');
  if(error){ $('view').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  DIFF = data || [];
  paint();
}

const unitById = id => UNITS.find(u => u.id === id);
function peopleOf(u){
  return PEOPLE.filter(p => p.unit_id === u.id)
    .sort((a, b) => (b.id === u.head_id) - (a.id === u.head_id) || a.sort - b.sort || a.id - b.id);
}

const BRANCH = ['var(--info)', 'var(--plan)', 'var(--brand)', 'var(--ok)', 'var(--warn)'];
let OPEN = new Set(), ALL_OPEN = false;

const kids = id => UNITS.filter(u => u.parent_id === id).sort((a, b) => a.sort - b.sort || a.id - b.id);
const personOf = id => PEOPLE.find(p => p.id === id);
function subtreeUnits(u){ const out = [u]; for(const k of kids(u.id)) out.push(...subtreeUnits(k)); return out; }
const people = n => n + ' ' + plural(n, 'человек', 'человека', 'человек');
function av(p, extra){
  return '<span class="og-av' + (p && p.employee_id ? ' crm' : '') + (extra || '') + '"' +
    (p && p.employee_id ? ' title="Есть вход в CRM"' : '') + '>' + esc(initials(p ? p.full_name : '?')) + '</span>';
}

function paint(){
  const q = $('q').value.trim().toLowerCase();
  const inCrm = PEOPLE.filter(p => p.employee_id).length;
  $('sum').innerHTML = '<span>' + esc(people(PEOPLE.length)) + ' в ' + UNITS.length + ' звеньях</span>' +
    '<span><span class="dot"></span>есть вход в CRM — ' + inCrm + '</span>';
  $('openAll').hidden = VIEW !== 'scheme';
  if(VIEW === 'diff') return paintDiff(q);

  const pHit = p => !!q && ((p.full_name || '').toLowerCase().includes(q) || (p.position || '').toLowerCase().includes(q));
  const uHit = u => !!q && ((u.name || '').toLowerCase().includes(q) || PEOPLE.some(p => p.unit_id === u.id && pHit(p)));

  const memberHTML = (p, u) =>
    '<div class="og-m' + (CAN_EDIT ? ' edit' : '') + (pHit(p) ? ' hit' : '') + '" data-p="' + p.id + '"' + (CAN_EDIT ? ' tabindex="0"' : '') + '>' +
      av(p) + '<span class="tx">' + esc(p.full_name) + (p.id === u.head_id ? '<span class="rl">руководитель</span>' : '') +
      '<span class="ps">' + esc(p.position || '') + '</span></span></div>';

  const unitHTML = u => {
    const ps = PEOPLE.filter(p => p.unit_id === u.id)
      .sort((a, b) => (b.id === u.head_id) - (a.id === u.head_id) || a.sort - b.sort || a.id - b.id);
    const head = personOf(u.head_id);
    const open = ALL_OPEN || OPEN.has(u.id) || (!!q && uHit(u));
    const sub = kids(u.id);
    return '<li><div class="og-node' + (q ? (uHit(u) ? ' hit' : ' dim') : '') + '">' +
      '<div style="display:flex;align-items:center;min-width:0">' +
        '<button class="og-nh" data-open="' + u.id + '" aria-expanded="' + open + '">' +
          '<span class="t"><span class="un">' + esc(u.name) + '</span>' +
            '<span class="hd">' + (head ? av(head) + '<b>' + esc(head.full_name) + '</b>' : '<i>руководитель не назначен</i>') + '</span></span>' +
          '<span class="n" title="Человек в звене">' + ps.length + '</span>' +
          '<span class="ch">' + icon('chevron') + '</span></button>' +
        (CAN_EDIT ? '<button class="ib" data-u="' + u.id + '" aria-label="Изменить звено «' + esc(u.name) + '»">' + icon('edit') + '</button>' : '') +
      '</div>' +
      (open ? '<div class="og-mem">' + (ps.length ? ps.map(p => memberHTML(p, u)).join('') : '<div class="og-m"><span class="ps">В звене никого нет</span></div>') +
        (CAN_EDIT ? '<button class="btn ghost sm og-add" data-add="' + u.id + '">' + icon('plus') + 'Добавить человека</button>' : '') + '</div>' : '') +
      '</div>' + (sub.length ? branchHTML(sub) : '') + '</li>';
  };

  // ветка: звенья группируются по блоку; уровень «блок» рисуем, только если в нём больше одного звена
  const branchHTML = list => {
    const groups = [];
    for(const u of list){
      let g = groups.find(x => x.block === u.block);
      if(!g){ g = { block: u.block, units: [] }; groups.push(g); }
      g.units.push(u);
    }
    const flat = groups.length === 1;
    return '<ul>' + groups.map(g => {
      if(flat || g.units.length === 1 || !g.block) return g.units.map(unitHTML).join('');
      const n = g.units.reduce((s, u) => s + subtreeUnits(u).reduce((t, x) => t + PEOPLE.filter(p => p.unit_id === x.id).length, 0), 0);
      return '<li><div class="og-blk">' + esc(g.block) + '<span>' + esc(people(n)) + '</span></div>' +
        '<ul>' + g.units.map(unitHTML).join('') + '</ul></li>';
    }).join('') + '</ul>';
  };

  const roots = UNITS.filter(u => !u.parent_id || !unitById(u.parent_id)).sort((a, b) => a.sort - b.sort);
  let html = '';
  for(const root of roots){
    const dirs = kids(root.id);
    const rootPeople = PEOPLE.filter(p => p.unit_id === root.id);
    html += '<div class="og-chart"><div class="og-root"><div class="og-rootcard">' + esc(root.name) +
      (rootPeople.length ? ' · ' + rootPeople.map(p => esc(p.full_name)).join(', ') : '') + '</div></div>' +
      '<div class="og-dirs" style="--cols:' + Math.max(1, Math.min(dirs.length, 4)) + '">' +
      dirs.map((d, i) => {
        const head = personOf(d.head_id) || PEOPLE.find(p => p.unit_id === d.id);
        const total = subtreeUnits(d).reduce((t, x) => t + PEOPLE.filter(p => p.unit_id === x.id).length, 0) - (head ? 1 : 0);
        const sub = kids(d.id);
        const own = PEOPLE.filter(p => p.unit_id === d.id && (!head || p.id !== head.id));
        return '<div class="og-col" style="--br:' + BRANCH[i % BRANCH.length] + '">' +
          '<div class="og-dir' + (CAN_EDIT && head ? ' edit' : '') + '"' + (CAN_EDIT && head ? ' data-p="' + head.id + '" tabindex="0"' : '') + '>' +
            '<span class="ava' + (head && head.employee_id ? ' crm' : '') + '">' + esc(initials(head ? head.full_name : d.name)) + '</span>' +
            '<div style="min-width:0;flex:1"><div class="nm">' + esc(head ? head.full_name : 'Не назначен') + '</div>' +
              '<div class="ps">' + esc(d.name) + '</div>' +
              '<div class="ct">В подчинении ' + esc(people(total)) + '</div></div>' +
            (CAN_EDIT ? '<button class="ib" data-u="' + d.id + '" aria-label="Изменить «' + esc(d.name) + '»">' + icon('edit') + '</button>' : '') +
          '</div>' +
          (own.length ? '<div class="og-tree"><ul><li><div class="og-node"><div class="og-mem" style="border:0">' +
            own.map(p => '<div class="og-m' + (CAN_EDIT ? ' edit' : '') + '" data-p="' + p.id + '">' + av(p) +
              '<span class="tx">' + esc(p.full_name) + '<span class="ps">' + esc(p.position || '') + '</span></span></div>').join('') +
            '</div></div></li></ul></div>' : '') +
          (sub.length ? '<div class="og-tree">' + branchHTML(sub) + '</div>' : '') +
        '</div>';
      }).join('') + '</div></div>';
  }
  $('view').innerHTML = html;

  $('view').querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.open);
    if(ALL_OPEN){ ALL_OPEN = false; OPEN = new Set(UNITS.map(u => u.id)); }
    OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
    paint();
  });
  if(CAN_EDIT){
    const openP = el => personForm(personOf(Number(el.dataset.p)), null);
    $('view').querySelectorAll('[data-p]').forEach(el => {
      el.onclick = e => { if(e.target.closest('[data-u]')) return; openP(el); };
      el.onkeydown = e => { if(e.key === 'Enter') openP(el); };
    });
    $('view').querySelectorAll('[data-u]').forEach(el => el.onclick = e => { e.stopPropagation(); unitForm(unitById(Number(el.dataset.u))); });
    $('view').querySelectorAll('[data-add]').forEach(el => el.onclick = () => personForm(null, Number(el.dataset.add)));
  }
}
function headName(u){ const h = PEOPLE.find(p => p.id === u.head_id); return h ? h.full_name : ''; }

function paintDiff(q){
  const rows = (DIFF || []).filter(r => !q || (r.full_name || '').toLowerCase().includes(q));
  const bad = (DIFF || []).filter(r => !r.same).length;
  $('view').innerHTML =
    '<div class="og-note">Схема пока не влияет на права в CRM: кто кому ставит задачи и чьи планы видит, решает подчинение в «Сотрудниках». ' +
    'Здесь видно, где они расходятся' + (bad ? ' — расхождений: ' + bad : ' — расхождений нет') + '. ' +
    'Если руководителя звена нет в CRM, берётся ближайший руководитель выше, у которого есть вход.</div>' +
    '<div class="og-diff"><table><thead><tr><th>Сотрудник CRM</th><th class="hide-m">Звено</th><th>По схеме</th><th>В CRM сейчас</th></tr></thead><tbody>' +
    rows.map(r => '<tr class="' + (r.same ? 'ok' : '') + '"><td>' + esc(r.full_name) + '</td>' +
      '<td class="hide-m">' + (r.in_scheme ? esc(r.unit_name || '') : '<span class="bad">нет в схеме</span>') + '</td>' +
      '<td>' + (r.in_scheme ? esc(r.scheme_manager || '—') : '—') + '</td>' +
      '<td>' + esc(r.crm_manager || '—') + (r.same ? '' : ' <span class="bad">≠</span>') + '</td></tr>').join('') +
    '</tbody></table></div>';
}

/* ---------- правка человека ---------- */
function unitOptions(sel){
  return UNITS.map(u => '<option value="' + u.id + '"' + (u.id === sel ? ' selected' : '') + '>' + esc(u.name) + '</option>').join('');
}
function personForm(p, unitId){
  const isNew = !p;
  const u = unitById(isNew ? unitId : p.unit_id);
  const isHead = !isNew && u && u.head_id === p.id;
  const taken = new Set(PEOPLE.filter(x => x.employee_id && (!p || x.id !== p.id)).map(x => x.employee_id));
  const emps = EMPS.filter(e => !taken.has(e.id)).sort((a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'ru'));
  modalOpen({
    title: isNew ? 'Новый сотрудник в схеме' : p.full_name,
    sheet: true,
    saveLabel: 'Сохранить',
    bodyHTML: '<div class="og-form">' +
      '<div class="field"><label class="field-label" for="fName">ФИО</label><input id="fName" maxlength="120" value="' + esc(isNew ? '' : p.full_name) + '"></div>' +
      '<div class="field"><label class="field-label" for="fPos">Должность</label><input id="fPos" maxlength="160" value="' + esc(isNew ? '' : p.position) + '"></div>' +
      '<div class="field"><label class="field-label" for="fUnit">Звено</label><select id="fUnit">' + unitOptions(u ? u.id : null) + '</select></div>' +
      '<div class="field"><label class="switch"><input type="checkbox" id="fHead"' + (isHead ? ' checked' : '') + '>' +
        '<span class="sl">Руководитель звена<i>Прежний руководитель звена станет обычным сотрудником</i></span></label></div>' +
      '<div class="field"><label class="field-label" for="fEmp">Вход в CRM</label><select id="fEmp"><option value="">Нет входа</option>' +
        emps.map(e => '<option value="' + esc(e.id) + '"' + (!isNew && p.employee_id === e.id ? ' selected' : '') + '>' + esc(e.full_name) + '</option>').join('') +
        '</select><div class="hint">Только связь со схемой. Учётки создаются и отключаются в «Сотрудниках».</div></div>' +
      (isNew ? '' : '<button class="btn ghost sm" id="fDel" style="color:var(--late)">' + icon('trash') + 'Убрать из схемы</button>') +
      '</div>',
    onSave: () => savePerson(p)
  });
  if(!isNew) $('fDel').onclick = () => removePerson(p);
  $('fName').focus();
}
async function savePerson(p){
  const rec = {
    full_name: $('fName').value.trim(),
    position: $('fPos').value.trim(),
    unit_id: Number($('fUnit').value),
    employee_id: $('fEmp').value || null
  };
  if(!rec.full_name) return modalMsg('Впишите ФИО');
  modalBusy(true, 'Сохраняем…');
  let id = p && p.id, error;
  if(p){
    ({ error } = await sb.from('org_people').update(rec).eq('id', p.id));
  } else {
    rec.sort = PEOPLE.reduce((m, x) => Math.max(m, x.sort), 0) + 1;
    const r = await sb.from('org_people').insert(rec).select('id').single();
    error = r.error; id = r.data && r.data.id;
  }
  if(!error){
    const u = unitById(rec.unit_id), wantHead = $('fHead').checked;
    if(wantHead && u.head_id !== id) ({ error } = await sb.from('org_units').update({ head_id: id }).eq('id', u.id));
    else if(!wantHead && u.head_id === id) ({ error } = await sb.from('org_units').update({ head_id: null }).eq('id', u.id));
  }
  if(error){ modalBusy(false, 'Сохранить'); return modalMsg(errText(error)); }
  modalClose(); toast('Сохранено'); load();
}
function removePerson(p){
  confirmBox('Убрать из схемы?', p.full_name + ' пропадёт из оргструктуры. Вход в CRM, если он есть, не отключается.', 'Убрать', async () => {
    const { error } = await sb.from('org_people').delete().eq('id', p.id);
    if(error) return toast(errText(error));
    toast('Убран из схемы'); load();
  });
}

/* ---------- правка звена ---------- */
function below(id){
  const out = new Set([id]);
  let grow = true;
  while(grow){ grow = false; for(const u of UNITS) if(u.parent_id && out.has(u.parent_id) && !out.has(u.id)){ out.add(u.id); grow = true; } }
  return out;
}
function unitForm(u){
  const isNew = !u;
  const blocks = [...new Set(UNITS.map(x => x.block).filter(Boolean))];
  const deny = isNew ? new Set() : below(u.id);
  const ps = isNew ? [] : peopleOf(u);
  modalOpen({
    title: isNew ? 'Новое звено' : u.name,
    sheet: true,
    saveLabel: 'Сохранить',
    bodyHTML: '<div class="og-form">' +
      '<div class="field"><label class="field-label" for="uName">Название</label><input id="uName" maxlength="120" value="' + esc(isNew ? '' : u.name) + '"></div>' +
      '<div class="field"><label class="field-label" for="uBlock">Блок</label><input id="uBlock" list="uBlocks" maxlength="80" value="' + esc(isNew ? '' : u.block) + '">' +
        '<datalist id="uBlocks">' + blocks.map(b => '<option value="' + esc(b) + '">').join('') + '</datalist>' +
        '<div class="hint">Звенья одного блока стоят на схеме вместе, например Склады или Цех</div></div>' +
      '<div class="field"><label class="field-label" for="uPar">Подчиняется звену</label><select id="uPar"><option value="">Никому (верх схемы)</option>' +
        UNITS.filter(x => !deny.has(x.id)).map(x => '<option value="' + x.id + '"' + (!isNew && u.parent_id === x.id ? ' selected' : '') + '>' +
          esc(x.name) + (x.head_id ? ' — ' + esc(headName(x)) : '') + '</option>').join('') + '</select></div>' +
      (isNew ? '' : '<div class="field"><label class="field-label" for="uHead">Руководитель</label><select id="uHead"><option value="">Нет</option>' +
        ps.map(p => '<option value="' + p.id + '"' + (u.head_id === p.id ? ' selected' : '') + '>' + esc(p.full_name) + '</option>').join('') + '</select></div>') +
      (isNew ? '' : '<button class="btn ghost sm" id="uDel" style="color:var(--late)">' + icon('trash') + 'Удалить звено</button>') +
      '</div>',
    onSave: () => saveUnit(u)
  });
  if(!isNew) $('uDel').onclick = () => removeUnit(u);
  $('uName').focus();
}
async function saveUnit(u){
  const rec = {
    name: $('uName').value.trim(),
    block: $('uBlock').value.trim(),
    parent_id: $('uPar').value ? Number($('uPar').value) : null
  };
  if(!rec.name) return modalMsg('Впишите название');
  if(u) rec.head_id = $('uHead').value ? Number($('uHead').value) : null;
  else rec.sort = UNITS.reduce((m, x) => Math.max(m, x.sort), 0) + 1;
  modalBusy(true, 'Сохраняем…');
  const { error } = u ? await sb.from('org_units').update(rec).eq('id', u.id)
                      : await sb.from('org_units').insert(rec);
  if(error){ modalBusy(false, 'Сохранить'); return modalMsg(errText(error)); }
  modalClose(); toast('Сохранено'); load();
}
function removeUnit(u){
  if(PEOPLE.some(p => p.unit_id === u.id) || UNITS.some(x => x.parent_id === u.id)){
    return modalMsg('Сначала переведите людей и звенья, которые подчиняются этому звену');
  }
  confirmBox('Удалить звено?', '«' + u.name + '» пропадёт из схемы.', 'Удалить', async () => {
    const { error } = await sb.from('org_units').delete().eq('id', u.id);
    if(error) return toast(errText(error));
    toast('Звено удалено'); load();
  });
}
</script>
