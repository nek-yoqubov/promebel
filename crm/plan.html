<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Мой план</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1 id="pageTitle">Мой план</h1></div>

  <div class="toolbar" id="whoBar" hidden></div>

  <div class="planday">
    <button class="ib" id="prev" aria-label="Предыдущий день"></button>
    <button class="pd" id="dayTtl" title="Вернуться к сегодня"></button>
    <button class="ib" id="next" aria-label="Следующий день"></button>
  </div>

  <div class="pcols">
    <div class="pmain">
      <div class="addwrap" id="addWrap" hidden>
        <div class="addline">
          <input id="addTitle" placeholder="Добавить пункт…" autocomplete="off"
                 enterkeyhint="done" maxlength="300">
          <button class="ib" id="addGo" aria-label="Добавить"></button>
        </div>
        <div class="addchips" id="addChips"></div>
      </div>

      <div id="earlier"></div>
      <div id="body"><div class="loading">Загрузка…</div></div>
      <div id="doneBox"></div>
    </div>

    <aside class="pside" id="pside" hidden>
      <div id="teamBox"></div>
      <div id="acBox"></div>
      <div id="acAllBox"></div>
      <div id="kcBox"></div>
    </aside>
  </div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);

/* День плана — строка «ГГГГ-ММ-ДД» по Душанбе: plan_date в базе живёт
   в той же зоне, и считать его по часам устройства нельзя. */
let WHO = '';
let DAY = tzYmd();
let ITEMS = [], EARLIER = [];
let SUGGEST = null;        // {id, num} — чип «Счётчик» под только что добавленным пунктом
let NEW_CLIENT = null;     // клиент для следующего добавленного пункта (переход из карточки)
let S_CLIENT = null;       // клиент, выбранный в открытой шторке
let DONE_OPEN = false;     // «Выполнено» оставляем развёрнутым, если его открыли

const ACT_COLS = 'id,owner_id,client_id,title,note,due_at,done_at,plan_date,target,progress,' +
  'sort_order,client:clients(id,full_name,phone)';

const WD = ['вс','пн','вт','ср','чт','пт','сб'];

(async () => {
  if(!await requireAuth()) return;
  await renderShell({ title:'Мой план', tab:'plan' });
  WHO = ME.id;

  $('prev').innerHTML = icon('arrowLeft');
  $('next').innerHTML = icon('arrowLeft');
  $('next').style.transform = 'rotate(180deg)';
  $('addGo').innerHTML = icon('plus');
  $('prev').onclick = () => go(tzShift(DAY, -1));
  $('next').onclick = () => go(tzShift(DAY, 1));
  $('dayTtl').onclick = () => go(tzYmd());
  $('addGo').onclick = addFromInput;
  $('addTitle').onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); addFromInput(); }
  };

  paintWho();
  paintAdd();

  // ?id=N из уведомления или из ленты клиента — открыть день этого пункта
  const openId = qs.get('id') ? Number(qs.get('id')) : 0;
  if(openId){
    const { data } = await sb.from('activities')
      .select('plan_date,owner_id').eq('id', openId).maybeSingle();
    if(data){
      if(data.plan_date) DAY = String(data.plan_date).slice(0, 10);
      if(data.owner_id && data.owner_id !== WHO && whoList().some(e => e.id === data.owner_id)){
        WHO = data.owner_id;
        paintWho(); paintTitle(); paintAdd();
      }
    }
  }

  if(qs.get('new') === '1' && qs.get('client')) await presetClient(Number(qs.get('client')));

  await load();
  if(openId) openItem(openId);
  else if(qs.get('new') === '1') $('addTitle').focus();
})();

/* ============================================================
   ЧЕЙ ПЛАН
   Руководитель смотрит подчинённого; менять может то же, что и база.
   ============================================================ */
function myTeam(){ return EMPS.filter(e => e.manager_id === ME.id); }
/* Всех подряд смотрят только директор, админ, главный менеджер и ревизор.
   Региональному, как и остальным, открыты свой план и подчинённые. */
function seesEveryone(){
  return isBossRole() || ['head','auditor'].includes(ME.role);
}
function mayPickWho(){ return seesEveryone() || hasTeam(); }
function whoList(){
  if(seesEveryone()) return EMPS;
  return [EMP_BY_ID[ME.id]].filter(Boolean).concat(myTeam());
}
/* Ревизор всё видит и ничего не трогает. Остальным права держит RLS —
   в интерфейсе показываем ровно то, что она пропустит. */
function mayEdit(){
  if(!canEdit()) return false;
  return WHO === ME.id || isBossRole() || isManagerOf(WHO);
}
function paintWho(){
  if(!mayPickWho()){ $('whoBar').hidden = true; return; }
  $('whoBar').hidden = false;
  $('whoBar').innerHTML =
    '<select id="whoSel" class="grow">' + whoList().map(e =>
      '<option value="' + esc(e.id) + '"' + (WHO === e.id ? ' selected' : '') + '>' +
      esc(e.id === ME.id ? 'Мой план' : e.full_name) + '</option>').join('') + '</select>';
  $('whoSel').onchange = () => switchWho($('whoSel').value);
}
function switchWho(id){
  if(!id || id === WHO) return;
  WHO = id;
  NEW_CLIENT = null;
  SUGGEST = null;
  const sel = $('whoSel');
  if(sel && sel.value !== id) sel.value = id;
  paintTitle(); paintAdd();
  load();
}
function paintTitle(){
  $('pageTitle').textContent = WHO === ME.id ? 'Мой план' : 'План — ' + empName(WHO);
}

/* ============================================================
   ДЕНЬ
   ============================================================ */
function dayLabel(day){
  const t = tzYmd();
  if(day === t) return 'Сегодня';
  if(day === tzShift(t, 1)) return 'Завтра';
  if(day === tzShift(t, -1)) return 'Вчера';
  const d = new Date(day + 'T00:00:00Z');
  return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
}
function go(day){
  DAY = day;
  SUGGEST = null;
  load();
}

async function load(){
  $('dayTtl').textContent = dayLabel(DAY);
  $('body').innerHTML = '<div class="loading">Загрузка…</div>';
  const today = tzYmd(), day = DAY, who = WHO;

  const jobs = [
    sb.from('activities').select(ACT_COLS)
      .eq('owner_id', who).eq('plan_date', day)
      .order('sort_order').order('id').limit(300)
  ];
  // «Не сделано раньше» нужно только на экране «Сегодня»
  jobs.push(day === today
    ? sb.from('activities').select(ACT_COLS)
        .eq('owner_id', who).is('done_at', null).lt('plan_date', today)
        .order('plan_date', { ascending:false }).limit(100)
    : Promise.resolve({ data: [] }));

  const [res, past] = await Promise.all(jobs);
  if(day !== DAY || who !== WHO) return;      // пока грузили, переключили день или человека
  if(res.error){
    $('body').innerHTML = '<div class="empty">' + esc(errText(res.error)) + '</div>';
    return;
  }
  ITEMS = res.data || [];
  EARLIER = (past && past.data) || [];
  paint();
  loadTeam();
  loadKpi();
}

/* ============================================================
   СПИСОК
   Сверху невыполненные: сначала со временем, потом по своему порядку.
   ============================================================ */
function cmpItems(a, b){
  const at = a.due_at ? 0 : 1, bt = b.due_at ? 0 : 1;
  if(at !== bt) return at - bt;
  if(a.due_at && b.due_at) return new Date(a.due_at) - new Date(b.due_at);
  return (a.sort_order || 0) - (b.sort_order || 0) || a.id - b.id;
}

function paint(){
  paintEarlier();

  const open = ITEMS.filter(a => !a.done_at).sort(cmpItems);
  const done = ITEMS.filter(a => a.done_at).sort(cmpItems);

  $('body').innerHTML = open.length
    ? open.map(a => itemHTML(a)).join('')
    : '<div class="empty">' + (mayEdit()
        ? 'На этот день пунктов нет — добавьте первый'
        : 'На этот день пунктов нет') + '</div>';

  $('doneBox').innerHTML = done.length
    ? '<details class="donebox"' + (DONE_OPEN ? ' open' : '') + '>' +
        '<summary>Выполнено (' + done.length + ')<span class="dch">' + icon('down') + '</span></summary>' +
        done.map(a => itemHTML(a)).join('') +
      '</details>'
    : '';

  wire($('body'));
  wire($('doneBox'));
  const d = $('doneBox').querySelector('details');
  if(d) d.addEventListener('toggle', () => { DONE_OPEN = d.open; });
}

function paintEarlier(){
  const box = $('earlier');
  if(DAY !== tzYmd() || !EARLIER.length){ box.innerHTML = ''; return; }
  box.innerHTML =
    '<div class="sec earl">Не сделано раньше (' + EARLIER.length + ')' +
      (mayEdit() ? '<button class="btn ghost sm" id="allToday">Всё на сегодня</button>' : '') +
    '</div>' +
    EARLIER.map(a => itemHTML(a, true)).join('');
  wire(box);
  if($('allToday')) $('allToday').onclick = allToday;
}

function itemHTML(a, earlier){
  const done = !!a.done_at;
  const may = mayEdit();
  const time = a.due_at ? tzTime(a.due_at) : '';
  const late = !!a.due_at && !done && new Date(a.due_at) < new Date();

  const meta = [];
  if(earlier) meta.push('<span class="pw late">' + esc(dayLabel(String(a.plan_date).slice(0, 10))) + '</span>');
  if(time) meta.push('<span class="pw' + (late ? ' late' : '') + '">' + esc(time) + '</span>');
  if(a.client) meta.push('<span class="pc">' + esc(a.client.full_name) + '</span>');

  // счётчик: у просроченных пунктов справа место занимает «На сегодня»
  const counter = (a.target && !earlier)
    ? '<span class="cnt2">' +
        (may && !done ? '<button class="cb" data-dec="' + a.id + '" aria-label="Меньше">−</button>' : '') +
        '<b>' + (a.progress || 0) + '/' + a.target + '</b>' +
        (may && !done ? '<button class="cb" data-inc="' + a.id + '" aria-label="Больше">+</button>' : '') +
      '</span>'
    : '';

  const tick = may
    ? '<button class="pck' + (done ? ' on' : '') + '" data-tog="' + a.id + '" aria-label="' +
      (done ? 'Снять отметку' : 'Отметить сделанным') + '">' + (done ? icon('check') : '') + '</button>'
    : '<span class="pck' + (done ? ' on' : '') + '">' + (done ? icon('check') : '') + '</span>';

  const body = '<span class="pt">' + esc(a.title) + '</span>' +
    (meta.length ? '<span class="pm">' + meta.join('') + '</span>' : '');

  const sug = (SUGGEST && SUGGEST.id === a.id && !a.target && may && !done)
    ? '<div class="sugrow"><button class="chip sm" data-sug="' + a.id + '">' +
      'Счётчик 0/' + SUGGEST.num + '</button></div>'
    : '';

  return '<div class="pitem' + (done ? ' done' : '') + '">' + tick +
      (may
        ? '<button class="pb" data-open="' + a.id + '">' + body + '</button>'
        : '<span class="pb ro">' + body + '</span>') +
      (earlier && may
        ? '<button class="btn ghost sm" data-today="' + a.id + '">На сегодня</button>'
        : counter) +
    '</div>' + sug;
}

function wire(box){
  if(!box) return;
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openItem(Number(b.dataset.open)));
  box.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => toggleDone(Number(b.dataset.tog)));
  box.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => bump(Number(b.dataset.inc), 1));
  box.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => bump(Number(b.dataset.dec), -1));
  box.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => applySuggest(Number(b.dataset.sug)));
  box.querySelectorAll('[data-today]').forEach(b => b.onclick = () => moveOne(Number(b.dataset.today)));
}

function findItem(id){
  return ITEMS.find(a => a.id === id) || EARLIER.find(a => a.id === id) || null;
}
/* Строку после правки заменяем на то, что вернула база: там уже сработали
   триггеры (plan_date из due_at, done_at из счётчика). */
function putItem(row){
  if(!row) return;
  const day = String(row.plan_date || '').slice(0, 10);
  EARLIER = EARLIER.filter(a => a.id !== row.id);
  const i = ITEMS.findIndex(a => a.id === row.id);
  if(day === DAY){
    if(i >= 0) ITEMS[i] = row; else ITEMS.push(row);
  }else{
    if(i >= 0) ITEMS.splice(i, 1);
    if(!row.done_at && day && day < tzYmd() && DAY === tzYmd()) EARLIER.push(row);
  }
}

/* ============================================================
   ГАЛОЧКА И СЧЁТЧИК
   ============================================================ */
async function toggleDone(id){
  const a = findItem(id);
  if(!a || !mayEdit()) return;
  const on = !a.done_at;
  const rec = { done_at: on ? new Date().toISOString() : null };
  // у пункта со счётчиком галочка значит «сделал всё»: иначе триггер,
  // который ведёт done_at от progress, тут же вернёт отметку обратно
  if(a.target) rec.progress = on ? a.target : 0;

  const { data, error } = await sb.from('activities').update(rec)
    .eq('id', id).select(ACT_COLS).maybeSingle();
  if(error) return toast(errText(error, 'update'));
  putItem(data);
  if(on) playDone();
  paint();
  loadTeam();
}

async function bump(id, d){
  const a = findItem(id);
  if(!a || !a.target || !mayEdit()) return;
  const was = a.progress || 0;
  const n = Math.max(0, Math.min(was + d, a.target));
  if(n === was) return;

  const { data, error } = await sb.from('activities').update({ progress: n })
    .eq('id', id).select(ACT_COLS).maybeSingle();
  if(error) return toast(errText(error, 'update'));
  const wasDone = !!a.done_at;
  putItem(data);
  if(data && data.done_at && !wasDone) playDone();
  paint();
  loadTeam();
}

async function applySuggest(id){
  const a = findItem(id);
  if(!a || !SUGGEST || SUGGEST.id !== id) return;
  const { data, error } = await sb.from('activities').update({ target: SUGGEST.num })
    .eq('id', id).select(ACT_COLS).maybeSingle();
  if(error) return toast(errText(error, 'update'));
  SUGGEST = null;
  putItem(data);
  paint();
}

/* ============================================================
   ДОБАВЛЕНИЕ
   Строка ввода — главный способ завести пункт. Список, вставленный
   целиком («1. … 2. …» или с переносами), разбираем на пункты.
   ============================================================ */
function splitItems(text){
  let parts = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if(parts.length === 1 && /(^|\s)\d{1,2}[.)]\s/.test(parts[0])){
    parts = parts[0].split(/(?:^|\s)\d{1,2}[.)]\s+/);
  }
  return parts
    .map(s => s.replace(/^\s*(?:\d{1,2}[.)]|[-–—•*])\s*/, '').trim())
    .filter(Boolean)
    .slice(0, 50);
}
/* «обзвонить 50 мастеров» → 50. Само по себе ничего не включает,
   только предлагает счётчик. Время вида 14:00 за число не считаем. */
function guessTarget(title){
  const m = String(title || '').match(/(?:^|[^\d:])(\d{1,4})(?![\d:])/);
  const n = m ? Number(m[1]) : 0;
  return n >= 2 && n <= 9999 ? n : 0;
}

async function addFromInput(){
  if(!mayEdit()) return;
  const parts = splitItems($('addTitle').value);
  if(!parts.length){ $('addTitle').focus(); return; }

  $('addTitle').value = '';
  $('addTitle').focus();
  $('addGo').disabled = true;

  const base = { owner_id: WHO, plan_date: DAY };
  if(NEW_CLIENT) base.client_id = NEW_CLIENT.id;
  const top = ITEMS.reduce((m, a) => Math.max(m, a.sort_order || 0), 0);
  const recs = parts.map((t, i) =>
    Object.assign({}, base, { title: t, sort_order: top + i + 1 }));

  const { data, error } = await sb.from('activities').insert(recs).select(ACT_COLS);
  $('addGo').disabled = false;
  if(error) return toast(errText(error, 'insert'));

  NEW_CLIENT = null;
  paintAdd();
  const rows = data || [];
  ITEMS = ITEMS.concat(rows);
  // счётчик предлагаем, только когда добавили ровно один пункт
  SUGGEST = null;
  if(rows.length === 1){
    const n = guessTarget(rows[0].title);
    if(n) SUGGEST = { id: rows[0].id, num: n };
  }
  paint();
  $('addTitle').focus();
  loadTeam();
}

function paintAdd(){
  $('addWrap').hidden = !mayEdit();
  $('addChips').innerHTML = NEW_CLIENT
    ? '<span class="tagbox">' + esc(NEW_CLIENT.full_name) +
      '<button class="tx" id="clrClient" aria-label="Убрать клиента">' + icon('x') + '</button></span>'
    : '';
  if($('clrClient')) $('clrClient').onclick = () => { NEW_CLIENT = null; paintAdd(); };
}
async function presetClient(id){
  if(!id) return;
  const { data } = await sb.from('clients').select('id,full_name,phone').eq('id', id).maybeSingle();
  if(data){ NEW_CLIENT = data; paintAdd(); }
}

/* ============================================================
   ПЕРЕНОС НА ДРУГОЙ ДЕНЬ
   У пункта со временем двигаем и время: plan_date база выводит
   из due_at, иначе пункт вернётся на прежний день.
   ============================================================ */
function moveRec(a, day){
  const rec = { plan_date: day };
  if(a.due_at){
    const t = tzHM(a.due_at);
    rec.due_at = tzAt(day, t.h, t.m);
  }
  return rec;
}
async function moveOne(id){
  const a = findItem(id);
  if(!a || !mayEdit()) return;
  const { data, error } = await sb.from('activities').update(moveRec(a, tzYmd()))
    .eq('id', id).select(ACT_COLS).maybeSingle();
  if(error) return toast(errText(error, 'update'));
  putItem(data);
  paint();
  loadTeam();
}
async function allToday(){
  if(!EARLIER.length || !mayEdit()) return;
  const today = tzYmd();
  const btn = $('allToday');
  if(btn){ btn.disabled = true; btn.textContent = 'Переносим…'; }

  const plain = EARLIER.filter(a => !a.due_at).map(a => a.id);
  const jobs = EARLIER.filter(a => a.due_at)
    .map(a => sb.from('activities').update(moveRec(a, today)).eq('id', a.id));
  if(plain.length) jobs.push(sb.from('activities').update({ plan_date: today }).in('id', plain));

  const res = await Promise.all(jobs);
  const bad = res.find(r => r.error);
  if(bad) toast(errText(bad.error, 'update'));
  await load();
}

/* ============================================================
   КАРТОЧКА ПУНКТА
   Телефон — шторка снизу, ПК — обычная модалка.
   ============================================================ */
function sheetDraft(){
  if(!document.getElementById('sTitle')) return null;
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  return { title:g('sTitle'), time:g('sTime'), target:g('sTarget'), note:g('sNote') };
}

function openItem(id, draft){
  const a = findItem(id);
  if(!a || !mayEdit()) return;
  if(!draft) S_CLIENT = a.client || null;

  const v = draft || {};
  const t = a.due_at ? tzHM(a.due_at) : null;
  const time = draft ? draft.time : (t ? p2(t.h) + ':' + p2(t.m) : '');
  const target = draft ? draft.target : (a.target || '');

  modalOpen({
    sheet: true,
    title: 'Пункт плана',
    bodyHTML:
      '<div class="field"><label class="field-label" for="sTitle">Что сделать <span class="req">*</span></label>' +
        '<input id="sTitle" maxlength="300" value="' + esc(draft ? v.title : a.title) + '"></div>' +
      '<div class="row2">' +
        '<div class="field"><label class="field-label" for="sTime">Время</label>' +
          '<input id="sTime" type="time" value="' + esc(time) + '">' +
          '<div class="hint">Пусто — пункт без времени</div></div>' +
        '<div class="field"><label class="field-label" for="sTarget">Счётчик, цель</label>' +
          '<input id="sTarget" type="number" min="0" max="9999" inputmode="numeric" ' +
            'placeholder="нет" value="' + esc(target) + '"></div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Клиент</label>' +
        '<div class="inline-add"><input id="sClient" readonly placeholder="не выбран" value="' +
          esc(S_CLIENT ? S_CLIENT.full_name : '') + '">' +
          '<button class="btn ghost" id="sPick" type="button">Выбрать</button>' +
          (S_CLIENT ? '<button class="btn ghost" id="sClear" type="button">' + icon('x') + '</button>' : '') +
        '</div></div>' +
      '<div class="field"><label class="field-label" for="sNote">Заметка</label>' +
        '<textarea id="sNote" rows="2">' + esc(draft ? v.note : (a.note || '')) + '</textarea></div>' +
      '<div class="btn-row">' +
        '<button class="btn ghost" id="sTom">На завтра</button>' +
        // удалить пункт может только его хозяин, руководитель в чужом плане — нет
        (WHO === ME.id ? '<button class="btn danger" id="sDel">Удалить</button>' : '') +
      '</div>',
    saveLabel: 'Сохранить',
    onSave: () => saveItem(a)
  });

  document.getElementById('sPick').onclick = () => {
    const keep = sheetDraft();
    pickClient(c => { S_CLIENT = c; openItem(id, keep); });
  };
  if(document.getElementById('sClear')){
    document.getElementById('sClear').onclick = () => {
      const keep = sheetDraft();
      S_CLIENT = null;
      openItem(id, keep);
    };
  }
  document.getElementById('sTom').onclick = () => moveSheet(a);
  if(document.getElementById('sDel')){
    document.getElementById('sDel').onclick = () => askDelete(a);
  }
}

async function saveItem(a){
  const title = document.getElementById('sTitle').value.trim();
  if(!title) return modalMsg('Впишите, что нужно сделать');

  const day = String(a.plan_date || DAY).slice(0, 10);
  const time = document.getElementById('sTime').value;
  const raw = document.getElementById('sTarget').value.trim();
  const num = raw === '' ? 0 : Math.max(0, Math.min(9999, Math.round(Number(raw) || 0)));

  const rec = {
    title,
    note: document.getElementById('sNote').value.trim() || null,
    client_id: S_CLIENT ? S_CLIENT.id : null,
    target: num > 0 ? num : null,
    due_at: time ? tzAt(day, Number(time.slice(0, 2)), Number(time.slice(3, 5))) : null
  };
  // сняли счётчик — обнуляем и набранное, иначе оно всплывёт, когда цель вернут
  if(!rec.target) rec.progress = 0;

  modalBusy(true, 'Сохраняем…');
  const { data, error } = await sb.from('activities').update(rec)
    .eq('id', a.id).select(ACT_COLS).maybeSingle();
  if(error){ modalBusy(false, 'Сохранить'); return modalMsg(errText(error, 'update')); }
  modalClose();
  putItem(data);
  paint();
  loadTeam();
}

async function moveSheet(a){
  const day = tzShift(String(a.plan_date || DAY).slice(0, 10), 1);
  modalBusy(true, 'Переносим…');
  const { data, error } = await sb.from('activities').update(moveRec(a, day))
    .eq('id', a.id).select(ACT_COLS).maybeSingle();
  if(error){ modalBusy(false, 'Сохранить'); return modalMsg(errText(error, 'update')); }
  modalClose();
  putItem(data);
  paint();
  toast('Перенесено на завтра');
  loadTeam();
}

function askDelete(a){
  confirmBox('Удалить пункт?', a.title, 'Удалить', async () => {
    const { error } = await sb.from('activities').delete().eq('id', a.id);
    if(error) return toast(errText(error, 'update'));
    ITEMS = ITEMS.filter(x => x.id !== a.id);
    EARLIER = EARLIER.filter(x => x.id !== a.id);
    paint();
    toast('Удалено');
    loadTeam();
  });
}

/* ============================================================
   ПЛАН КОМАНДЫ
   Один запрос на всех, кого человеку видно, за выбранный день.
   ============================================================ */
async function loadTeam(){
  const box = $('teamBox');
  if(!box) return;
  if(!mayPickWho()){ box.innerHTML = ''; return syncSide(); }

  const people = whoList().filter(Boolean);
  if(people.length < 2){ box.innerHTML = ''; return syncSide(); }

  const day = DAY;
  const { data, error } = await sb.from('activities')
    .select('owner_id,done_at').eq('plan_date', day)
    .in('owner_id', people.map(e => e.id)).limit(3000);
  if(day !== DAY) return;
  if(error){ box.innerHTML = ''; return syncSide(); }

  const agg = {};
  (data || []).forEach(r => {
    const x = agg[r.owner_id] || (agg[r.owner_id] = { all:0, done:0 });
    x.all++;
    if(r.done_at) x.done++;
  });

  box.innerHTML =
    '<div class="sec" style="margin-left:0">План команды · ' + esc(dayLabel(day).toLowerCase()) + '</div>' +
    people.map(e => {
      const x = agg[e.id];
      const pct = x && x.all ? Math.round(x.done / x.all * 100) : 0;
      return '<button class="tmrow' + (e.id === WHO ? ' me' : '') + '" data-who="' + esc(e.id) + '">' +
        '<span class="t1"><span class="tn">' + esc(e.id === ME.id ? 'Я' : e.full_name) + '</span>' +
          (x ? '<span class="tv">' + x.done + ' из ' + x.all + '</span>'
             : '<span class="tv off">плана нет</span>') + '</span>' +
        (x ? '<span class="tprog' + (pct >= 100 ? ' hit' : '') + '">' +
             '<i style="width:' + pct + '%"></i></span>' : '') +
      '</button>';
    }).join('');
  box.querySelectorAll('[data-who]').forEach(b => b.onclick = () => switchWho(b.dataset.who));
  syncSide();
}

/* Правая колонка пустая — прячем её вместе с разделителем */
function syncSide(){
  const side = $('pside');
  if(!side) return;
  side.hidden = !['teamBox','acBox','acAllBox','kcBox']
    .some(id => $(id) && $(id).innerHTML.trim());
}

/* ============================================================
   KPI МЕСЯЦА
   crm.kpi_view() — один запрос на страницу. null — KPI не положен:
   тогда блоков нет вообще. При смене сотрудника в базу не ходим,
   перерисовываем из уже полученного ответа.
   Ошибка запроса — те же пустые блоки, остальная страница живёт.
   ============================================================ */
let KPI = null, KPI_REQ = null;

function loadKpi(){
  if(!KPI_REQ){
    KPI_REQ = sb.schema('crm').rpc('kpi_view').then(
      r => { KPI = r.error ? null : (r.data || null); },
      () => { KPI = null; });
  }
  return KPI_REQ.then(paintKpi);
}

const MONTH_NOM = ['январь','февраль','март','апрель','май','июнь',
  'июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* число с пробелом-разделителем тысяч */
function kNum(v){
  return Math.round(Number(v) || 0).toLocaleString('ru-RU').replace(/[  ]/g, ' ');
}
function usd(v){ return kNum(v) + ' $'; }
/* '2026-10-03' → '3 окт' */
function dayShort(ymdStr){
  const p = String(ymdStr).split('-');
  return p.length === 3 ? Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] : '—';
}

function paintKpi(){
  const box = $('acBox'), all = $('acAllBox'), kc = $('kcBox');
  if(!box || !all || !kc) return;
  const k = KPI;
  if(!k){ box.innerHTML = ''; all.innerHTML = ''; kc.innerHTML = ''; return syncSide(); }

  const mine = ownRecord(k);
  const parts = [kpiPersonalHTML(k) + kpiOwnHTML(k), kpiAllHTML(k) + kpiOwnListHTML(k), kpiCommonHTML(k)];
  const at = (k.meta && k.meta.synced_at) || (mine && mine.synced_at) ||
    ((k.own || []).find(r => r && r.synced_at) || {}).synced_at;
  const synced = at ? ' · обновлено ' + tzTime(at) : '';
  const cap = '<div class="hint">Данные вносятся вручную, обновляются раз в час' + esc(synced) + '</div>';

  // подпись — под последним непустым блоком
  let last = -1;
  parts.forEach((h, i) => { if(h) last = i; });
  if(last >= 0) parts[last] += cap;

  box.innerHTML = parts[0];
  all.innerHTML = parts[1];
  kc.innerHTML = parts[2];
  syncSide();
}

/* ---------- личный план: строка WHO ---------- */
function kpiPersonalHTML(k){
  const mine = (k.personal || []).find(r => r.employee_id === WHO);
  if(!mine) return '';
  const meta = k.meta || {};
  const plan = Number(mine.plan) || 0, sold = Number(mine.sold) || 0;
  const days = mine.days || {};

  const keys = Object.keys(days).sort();
  const lastKey = keys.length ? keys[keys.length - 1] : '';
  const wStart = tzWeekStart(tzYmd());
  const week = keys.filter(d => d >= wStart).reduce((s, d) => s + (Number(days[d]) || 0), 0);

  const card = (label, val, note) =>
    '<div class="acc"><div class="acl">' + esc(label) + '</div>' +
      '<div class="acv">' + esc(val) + '</div>' +
      '<div class="acn">' + esc(note || '') + '</div></div>';
  const cards =
    card('Последний день', lastKey ? usd(days[lastKey]) : '—', lastKey ? dayShort(lastKey) : '') +
    card('Неделя', usd(week), 'с ' + dayShort(wStart)) +
    card('Месяц', usd(sold),
      meta.work_days ? (meta.days_passed || 0) + ' из ' + meta.work_days + ' раб. дн.' : '');

  const left = (Number(meta.work_days) || 0) - (Number(meta.days_passed) || 0);
  const remain = plan - sold;
  const need = (remain > 0 && left > 0)
    ? '<div class="hint" style="margin:0 0 10px">Осталось ' + esc(usd(remain)) +
      ' · нужно в день ' + esc(usd(Math.ceil(remain / left))) + '</div>'
    : '';

  const bonus = (plan > 0 && sold >= plan)
    ? '<div class="kpibonus">Бонус ' + esc(kNum(meta.bonus_personal)) + ' смн</div>'
    : '';

  const m = String(k.period || '').split('-');
  const month = MONTH_NOM[Number(m[1]) - 1] || '';

  return '<div class="sec" style="margin-left:0">Личный план' + (month ? ', ' + esc(month) : '') + '</div>' +
    '<div class="ac">' +
      '<div class="acs">' + cards + '</div>' +
      avgBar('Продано', sold, plan, usd) +
      need + bonus +
    '</div>';
}

/* Полоса «факт из плана». План взят — зелёная, иначе фирменная оранжевая. */
function avgBar(label, fact, target, fmt){
  if(!target) return '';                 // плана нет — и полосы нет
  const pct = Math.round(fact / target * 100);
  const hit = fact >= target;
  return '<div class="acp' + (hit ? ' hit' : '') + '">' +
    '<div class="acpt"><span>' + esc(label) + '</span>' +
      '<b>' + esc(fmt(fact)) + '</b>' +
      '<span class="sub">из ' + esc(fmt(target)) + '</span>' +
      '<span class="acpp">' + pct + '%</span></div>' +
    '<div class="bar"><i style="width:' + Math.max(0, Math.min(pct, 100)) + '%"></i></div></div>';
}

/* ---------- личный KPI из отдельной таблицы сотрудника ----------
   Все поля *_text — готовые строки из таблицы: показываем как есть.
   Числа plan/done нужны только для ширины полос. */
function ownRecord(k){
  return (k.own || []).find(r => r && r.employee_id === WHO) || null;
}
function ownNum(v){ return Number(v) || 0; }
function ownPct(done, plan){
  return ownNum(plan) > 0 ? Math.max(0, ownNum(done) / ownNum(plan) * 100) : 0;
}
/* '4 800' / '1 200,50' → число; пусто и мусор → 0 */
function ownMoney(t){
  const n = Number(String(t == null ? '' : t).replace(/[\s  ]/g, '').replace(',', '.'));
  return isFinite(n) ? n : 0;
}

function ownItemHTML(it, isTotal){
  if(!it) return '';
  const u = it.unit ? ' ' + it.unit : '';
  const pct = Math.min(100, ownPct(it.done, it.plan));
  const hit = ownNum(it.plan) > 0 && ownNum(it.done) >= ownNum(it.plan);
  const rest = [];
  if(it.left_text) rest.push('Осталось ' + it.left_text);
  if(it.per_day_text) rest.push('нужно в день ' + it.per_day_text);
  const last = it.last && (it.last.day || it.last.text)
    ? 'последний день ' + (it.last.day || '') + ': ' + (it.last.text || '') : '';
  return '<div class="acp own' + (hit ? ' hit' : '') + (isTotal ? ' own-tot' : '') + '">' +
    '<div class="acpt"><span>' + esc(it.name) + '</span>' +
      '<b>' + esc((it.done_text || '0') + u) + '</b>' +
      '<span class="sub">из ' + esc((it.plan_text || '') + u) + '</span>' +
      '<span class="acpp">' + esc(it.pct_text || '') + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    (rest.length ? '<div class="ownnote">' + esc(rest.join(' · ')) + '</div>' : '') +
    (last ? '<div class="ownnote">' + esc(last) + '</div>' : '') +
  '</div>';
}

function kpiOwnHTML(k){
  const rec = ownRecord(k);
  if(!rec) return '';
  if(rec.data && rec.data.version === 2) return kpiOwnV2HTML(rec);
  const d = rec.data || {};
  const items = d.items || [], kpis = d.kpis || [], scale = d.scale || [], sets = d.settings || [];

  let html = '<div class="sec" style="margin-left:0">' + esc(rec.title || 'Личный KPI') + '</div><div class="ac">';

  html += items.map(it => ownItemHTML(it, false)).join('');
  if(d.total) html += ownItemHTML(d.total, true);

  if(kpis.length){
    html += '<div class="ownsub">KPI и бонусы</div>' + kpis.map(x =>
      '<div class="okpi"><div class="okn">' + esc(x.name) + '</div>' +
        '<div class="okv"><span>' + esc((x.done_text || '0') + ' из ' + (x.plan_text || '')) + '</span>' +
          '<span>' + esc(x.pct_text || '') + '</span>' +
          '<span class="okb">бонус ' + esc(x.bonus_text || '0') + ' смн</span></div></div>').join('');
  }

  const total = d.bonus_total == null ? '' : String(d.bonus_total);
  html += ownMoney(total) > 0
    ? '<div class="kpibonus" style="margin-top:10px">Бонус ' + esc(total) + ' смн</div>'
    : '<div class="ownzero">Бонус пока 0 смн</div>';

  if(scale.length){
    // ступень — наибольший from, не превышающий процент KPI №1
    const first = kpis[0];
    const pct = first && ownNum(first.plan) > 0 ? ownNum(first.done) / ownNum(first.plan) * 100 : null;
    let cur = -1;
    if(pct !== null) scale.forEach((st, i) => {
      if(ownNum(st.from) <= pct && (cur < 0 || ownNum(st.from) >= ownNum(scale[cur].from))) cur = i;
    });
    html += '<div class="ownsub">' + esc(d.scale_title || 'Шкала бонуса') + '</div>' +
      scale.map((st, i) =>
        '<div class="osc' + (i === cur ? ' on' : '') + '">от ' + esc(st.from_text || '') +
          ' — ' + esc(st.bonus_text || '0') + ' смн</div>').join('');
  }

  if(sets.length){
    html += '<div class="hint" style="margin-top:12px">' +
      esc(sets.map(s => s.label + ' ' + s.value).join(' · ')) + '</div>';
  }
  return html + '</div>';
}

/* ---------- личный KPI, формат version 2 (квартальные таблицы) ----------
   cells / values / *_text — готовые строки из таблицы: показываем как есть.
   plan и done нужны только для ширины полос. */
function v2Cols(cols){
  const find = n => (cols || []).findIndex(c => String(c).trim().toLowerCase() === n);
  return { plan: find('план'), done: find('сделано'), pct: find('%'), bonus: find('бонус, смн') };
}
function v2Cell(row, i){
  const v = i >= 0 && row && row.cells ? row.cells[i] : '';
  return v == null ? '' : String(v);
}
/* '5,2%' → 5.2, '4 800' → 4800; пусто и мусор → NaN */
function v2Num(t){
  const x = String(t == null ? '' : t).replace(/[^\d,.\-]/g, '').replace(',', '.');
  return x === '' ? NaN : Number(x);
}
function v2Total(t){
  if(!t) return '';
  const vals = (t.values || []).map(v => v == null ? '' : String(v));
  let txt;
  if(vals.length > 1) txt = vals.slice(0, -1).join(' · ') + ' · бонус ' + vals[vals.length - 1] + ' смн';
  else txt = vals.join(' · ');
  return '<div class="ownt">' + esc(((t.label || '') + ' ' + txt).trim()) + '</div>';
}

/* строка секции: полоса, если есть «План» и «Сделано», иначе список */
function v2RowHTML(row, cols){
  const c = v2Cols(cols);
  const used = new Set([c.plan, c.done, c.pct, c.bonus]);
  const extra = (cols || []).map((name, i) => used.has(i) ? '' : (v2Cell(row, i) ? name + ': ' + v2Cell(row, i) : ''))
    .filter(Boolean).join(' · ');
  const bonus = c.bonus >= 0 && v2Cell(row, c.bonus) !== ''
    ? '<span class="okb">бонус ' + esc(v2Cell(row, c.bonus)) + ' смн</span>' : '';
  const note = extra ? '<div class="ownnote">' + esc(extra) + '</div>' : '';

  if(c.plan >= 0 && c.done >= 0){
    const plan = ownNum(row.plan), done = ownNum(row.done);
    const w = plan > 0 ? Math.min(100, Math.max(0, done / plan * 100)) : 0;
    return '<div class="acp own' + (plan > 0 && done >= plan ? ' hit' : '') + '">' +
      '<div class="acpt"><span>' + esc(row.name) + '</span>' +
        '<b>' + esc(v2Cell(row, c.done)) + '</b>' +
        '<span class="sub">из ' + esc(v2Cell(row, c.plan)) + '</span>' +
        (c.pct >= 0 ? '<span class="acpp">' + esc(v2Cell(row, c.pct)) + '</span>' : '') +
        bonus + '</div>' +
      '<div class="bar"><i style="width:' + w + '%"></i></div>' + note + '</div>';
  }
  const cells = (cols || []).map((name, i) => v2Cell(row, i) ? name + ': ' + v2Cell(row, i) : '')
    .filter(Boolean).join(' · ');
  return '<div class="acp own"><div class="acpt"><span>' + esc(row.name) + '</span></div>' +
    (cells ? '<div class="ownnote">' + esc(cells) + '</div>' : '') + '</div>';
}

/* месячный блок: ставки, а не план — список без полос */
function v2MonthlyHTML(m){
  const cols = m.cols || [];
  const grid = 'grid-template-columns:minmax(0,1.5fr) repeat(' + Math.max(cols.length, 1) + ',minmax(0,1fr))';
  return '<div class="ownsub">' + esc(m.title || '') + '</div>' +
    '<div class="mgrid mhead" style="' + grid + '"><span></span>' +
      cols.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' +
    (m.rows || []).map(r =>
      '<div class="mgrid" style="' + grid + '"><span class="mn">' + esc(r.name) + '</span>' +
        cols.map((x, i) => '<span>' + esc(v2Cell(r, i)) + '</span>').join('') + '</div>').join('') +
    v2Total(m.total);
}

/* ступень шкалы: наибольший from, не превышающий процент */
function v2ScaleHTML(sc, secs){
  const title = String(sc.title || '');
  const has1 = /№\s*1(?!\d)/.test(title), has2 = /№\s*2(?!\d)/.test(title);
  const sec = n => secs.find(x => new RegExp('№\\s*' + n + '(?!\\d)').test(x.title || ''));
  let pct = NaN;
  if(has1){
    const s1 = sec(1), r = s1 && (s1.rows || [])[0];
    if(r && ownNum(r.plan) > 0) pct = ownNum(r.done) / ownNum(r.plan) * 100;
  }else if(has2){
    const s2 = sec(2);
    if(s2 && s2.total && (s2.total.values || []).length) pct = v2Num(s2.total.values[0]);
  }
  const steps = sc.steps || [];
  let cur = -1;
  steps.forEach((st, i) => {
    const f = st.from != null ? Number(st.from) : v2Num(st.from_text);
    if(isFinite(pct) && f <= pct) {
      const best = cur < 0 ? -Infinity : (steps[cur].from != null ? Number(steps[cur].from) : v2Num(steps[cur].from_text));
      if(f >= best) cur = i;
    }
  });
  return '<div class="ownsub">' + esc(title) + '</div>' +
    steps.map((st, i) => '<div class="osc' + (i === cur ? ' on' : '') + '">от ' + esc(st.from_text || '') +
      ' — ' + esc(st.bonus_text || '0') + ' смн</div>').join('');
}

function kpiOwnV2HTML(rec){
  const d = rec.data || {};
  const head = d.header || {};
  const secs = d.sections || [], monthly = d.monthly || [], scales = d.scales || [];
  const pending = d.pending || [], sets = d.settings || [];

  let html = '<div class="sec" style="margin-left:0">' + esc(rec.title || head.title || 'Личный KPI') + '</div>' +
    (head.period ? '<div class="hint" style="margin:-4px 0 8px">' + esc(head.period) + '</div>' : '') +
    '<div class="ac">';

  secs.forEach(sec => {
    html += '<div class="ownsub">' + esc(sec.title || '') + '</div>' +
      (sec.rows || []).map(r => v2RowHTML(r, sec.cols)).join('') + v2Total(sec.total);
  });
  monthly.forEach(m => { html += v2MonthlyHTML(m); });

  pending.forEach(p => {
    html += '<div class="pendcard">' + icon('clock') + '<div><b>' + esc(p.title || '') + '</b>' +
      '<div>В процессе — данные появятся после настройки выгрузки из 1С</div></div></div>';
  });

  scales.forEach(sc => { html += v2ScaleHTML(sc, secs); });

  if(sets.length){
    html += '<div class="hint" style="margin-top:12px">' +
      esc(sets.map(x => x.label + ' ' + x.value).join(' · ')) + '</div>';
  }

  return html + '</div>';
}

/* ---------- руководителю: личные KPI всех, у кого есть таблица ---------- */
function kpiOwnListHTML(k){
  const list = (k.own || []).filter(Boolean);
  if(!list.length || (list.length === 1 && list[0].employee_id === WHO)) return '';
  return '<div class="sec" style="margin-left:0">Личные KPI</div>' +
    list.map(r => {
      const sum = ownListSummary(r);
      return '<div class="acrow' + (r.employee_id === WHO ? ' me' : '') + '">' +
        '<span class="acnm">' + esc(r.full_name) + '</span>' +
        '<span class="acov">' + esc(sum ? sum.text : '—') + '</span>' +
        '<span class="acpl">' + esc(sum ? sum.pct : '') + '</span>' +
      '</div>';
    }).join('');
}
/* строка списка «Личные KPI»: старый вид — итог, v2 — первая строка первой секции */
function ownListSummary(r){
  const d = r.data || {};
  if(d.version === 2){
    const sec = (d.sections || [])[0], row = sec && (sec.rows || [])[0];
    if(!row) return null;
    const c = v2Cols(sec.cols);
    return { text: v2Cell(row, c.done) + ' из ' + v2Cell(row, c.plan), pct: v2Cell(row, c.pct) };
  }
  const t = d.total || null;
  return t ? { text: (t.done_text || '0') + ' из ' + (t.plan_text || ''), pct: t.pct_text || '' } : null;
}

/* ---------- руководителю: все продавцы по убыванию продаж ---------- */
function kpiAllHTML(k){
  const list = (k.personal || []).slice();
  if(k.boss !== true || list.length < 2) return '';
  list.sort((a, b) => (Number(b.sold) || 0) - (Number(a.sold) || 0));

  return '<div class="sec" style="margin-left:0">Все продавцы</div>' +
    list.map(r => {
      const plan = Number(r.plan) || 0, sold = Number(r.sold) || 0;
      const pct = plan ? Math.round(sold / plan * 100) : null;
      return '<div class="acrow' + (r.employee_id === WHO ? ' me' : '') + '">' +
        '<span class="acnm">' + esc(r.full_name) + '</span>' +
        '<span class="acav">' + esc(usd(sold)) + '</span>' +
        '<span class="acpl' + (pct !== null && pct >= 100 ? ' hit' : '') + '">' +
          (pct === null ? '—' : pct + '%') + '</span>' +
      '</div>';
    }).join('') +
    '<div class="hint">Порядок — по продажам. Процент — от личного плана.</div>';
}

/* ---------- общий план шоурума ---------- */
function kpiCommonHTML(k){
  const rows = (k.common || []).slice().sort((a, b) => (Number(a.pos) || 0) - (Number(b.pos) || 0));
  if(!rows.length) return '';

  // проценты не обрезаем на 100: перевыполнение одной позиции перекрывает недобор другой
  const pcts = rows.filter(r => Number(r.plan) > 0).map(r => (Number(r.done) || 0) / Number(r.plan) * 100);
  const avg = pcts.length ? pcts.reduce((s, v) => s + v, 0) / pcts.length : 0;
  const hit = pcts.length > 0 && avg >= 100;

  const total = pcts.length
    ? '<div class="acp' + (hit ? ' hit' : '') + '">' +
        '<div class="acpt"><span>Среднее по позициям</span>' +
          '<span class="acpp">' + Math.floor(avg) + '%</span></div>' +
        '<div class="bar"><i style="width:' + Math.max(0, Math.min(Math.floor(avg), 100)) + '%"></i></div></div>'
    : '';
  const bonus = hit
    ? '<div class="kpibonus">Бонус ' + esc(kNum(k.meta && k.meta.bonus_common)) + ' смн</div>'
    : '';

  return '<div class="sec" style="margin-left:0">Общий план шоурума</div>' +
    '<div class="ac">' +
      rows.map(r => avgBar(r.name, Number(r.done) || 0, Number(r.plan) || 0,
        v => kNum(v) + ' ' + (r.unit || ''))).join('') +
      total + bonus +
    '</div>';
}
</script>
