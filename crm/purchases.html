<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Закупки</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main" id="main">
  <div class="pagehead"><h1>Закупки</h1>
    <button class="btn sm" id="newBtnPc" hidden>Новая заявка</button></div>

  <div class="seg rf-seg" id="seg" hidden></div>

  <section id="paneMine" hidden>
    <div class="chips" id="mineChips"></div>
    <div id="mineBody"><div class="loading">Загрузка…</div></div>
  </section>

  <section id="paneAll" hidden>
    <div class="chips" id="allChips"></div>
    <div class="pc-filters">
      <div class="f-search pc-q"><span id="searchIcon"></span>
        <input id="q" type="search" placeholder="Найти товар или артикул" autocomplete="off"></div>
      <select id="fAuthor" aria-label="Менеджер"></select>
      <select id="fBrand" aria-label="Бренд / папка"></select>
      <select id="fPeriod" aria-label="Период">
        <option value="7">За 7 дней</option>
        <option value="30" selected>За 30 дней</option>
        <option value="90">За 3 месяца</option>
        <option value="">За всё время</option>
      </select>
      <select id="fSort" aria-label="Сортировка">
        <option value="date">Сначала старые заявки</option>
        <option value="urgent">Сначала срочные</option>
        <option value="folder">По папкам</option>
      </select>
    </div>
    <div id="allBody"><div class="loading">Загрузка…</div></div>
  </section>

  <section id="paneStats" hidden>
    <div class="toolbar"><input id="fMonth" type="month" aria-label="Месяц"></div>
    <div class="tiles" id="statTiles"></div>
    <div id="statsBody"><div class="loading">Загрузка…</div></div>
  </section>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);

/* Заявки на закупку. Одна заявка (crm.purchase_orders) — несколько товаров (crm.purchase_requests).
   Права держит база: менеджеры по списку оставляют заявки и видят свои, закупщик и руководство видят все,
   статус строки меняет только закупщик. «Пришло» закупщик ставит вручную. */
const ST = {
  new:     { ru:'Новая',    cls:'late'  },
  in_work: { ru:'В работе', cls:'info'  },
  ordered: { ru:'Заказано', cls:'info'  },
  arrived: { ru:'Пришло',   cls:'ok'    },
  refused: { ru:'Отказ',    cls:'muted' }
};
const ACTIVE = ['new', 'in_work', 'ordered'];
const ALL_FILTERS = [
  { key:'act',     label:'В работе у закупщика' },
  { key:'new',     label:'Новые' },
  { key:'in_work', label:'В работе' },
  { key:'ordered', label:'Заказано' },
  { key:'arrived', label:'Пришло' },
  { key:'refused', label:'Отказ' },
  { key:'all',     label:'Все' }
];
const MINE_FILTERS = [{ key:'act', label:'Активные' }, { key:'all', label:'Все' }];

let ACC = {};
let ROWS = null, ORDERS = null;
let TAB = '', MINE_F = 'act', ALL_F = 'act', OPEN = new Set();

(async () => {
  if(!await requireAuth()) return;
  try{ sessionStorage.removeItem('crm_purch'); }catch(e){}   // на самой странице права всегда свежие
  await loadPurchaseAccess();
  ACC = PURCH || {};
  if(!ACC.create && !ACC.view){ location.replace('index.html'); return; }

  await renderShell({
    title:'Закупки', tab:'purchases',
    actions: canCreate() ? '<button class="ib" id="newBtn" aria-label="Новая заявка">' + icon('plus') + '</button>' : ''
  });
  if(canCreate()){
    $('newBtn').onclick = openNew;
    $('newBtnPc').hidden = false;
    $('newBtnPc').onclick = openNew;
  }
  $('searchIcon').outerHTML = icon('search');
  let timer = null;
  $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(paintAll, 200); };
  ['fAuthor', 'fBrand', 'fPeriod', 'fSort'].forEach(id => $(id).onchange = paintAll);
  $('fMonth').value = tzYmd().slice(0, 7);
  $('fMonth').onchange = loadStats;

  const p = new URLSearchParams(location.search);
  if(p.get('status') && ALL_FILTERS.some(f => f.key === p.get('status'))) ALL_F = p.get('status');
  paintSeg();
  const want = p.get('tab');
  showTab(tabs().some(t => t.key === want) ? want : tabs()[0].key);
  if(p.get('order')) openOrder(Number(p.get('order')));
})();

/* ---------- права (повторяют базу, только чтобы прятать кнопки) ---------- */
function canCreate(){ return !!ACC.create && !IS_PREVIEW; }
function canManage(){ return !!ACC.manage && !IS_PREVIEW; }

function tabs(){
  const t = [];
  if(ACC.view) t.push({ key:'all', label:'Все заявки' });
  if(ACC.create) t.push({ key:'mine', label:'Мои заявки' });
  if(ACC.view) t.push({ key:'stats', label:'Статистика' });
  return t;
}
function paintSeg(){
  const t = tabs();
  $('seg').hidden = t.length < 2;
  $('seg').innerHTML = t.map(x => '<button data-t="' + x.key + '">' + esc(x.label) + '</button>').join('');
  $('seg').querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.t));
}
function showTab(t){
  TAB = t;
  history.replaceState(null, '', 'purchases.html?tab=' + t);
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('paneMine').hidden = t !== 'mine';
  $('paneAll').hidden = t !== 'all';
  $('paneStats').hidden = t !== 'stats';
  if(t === 'stats') loadStats();
  else loadRows();
}

/* ---------- форматы ---------- */
function qtyText(v){ const n = Number(v) || 0; return String(Math.round(n * 1000) / 1000).replace('.', ','); }
function qtyUnit(v, unit){ return qtyText(v) + (unit ? ' ' + unit : ''); }
function stHTML(s){ const x = ST[s] || { ru:s, cls:'muted' }; return '<b class="rf-res ' + x.cls + '">' + esc(x.ru) + '</b>'; }
function lastGroup(path){ return Array.isArray(path) && path.length ? path[path.length - 1] : ''; }
function brandOf(path){ return Array.isArray(path) && path.length > 1 ? path[1] : ''; }
function folderOf(path){ return Array.isArray(path) ? path.slice(1, 3).join(' › ') : ''; }
function needHTML(d){
  if(!d) return '<span class="dim">—</span>';
  const late = d < tzYmd();
  return '<span' + (late ? ' class="rf-res late"' : '') + '>' + esc(fmtDateOnly(d)) + '</span>';
}
function stCounts(lines){
  const c = {};
  lines.forEach(r => c[r.status] = (c[r.status] || 0) + 1);
  return Object.keys(ST).filter(k => c[k]).map(k => stHTML(k) + (lines.length > 1 ? ' <span class="dim rf-small">' + c[k] + '</span>' : '')).join('<br>');
}

/* ---------- данные ---------- */
async function loadRows(force){
  const body = TAB === 'mine' ? $('mineBody') : $('allBody');
  if(!ROWS || force){
    body.innerHTML = '<div class="loading">Загрузка…</div>';
    const [r, o] = await Promise.all([
      sb.from('purchase_requests')
        .select('id,order_id,author_id,item_code,item_name,item_article,item_unit,item_path,qty,note,need_by,client_name,comment,status,refuse_reason,created_at,status_at,seen_at')
        .order('created_at', { ascending:false }).limit(5000),
      sb.from('purchase_orders').select('id,author_id,need_by,client_name,comment,created_at')
        .order('created_at', { ascending:false }).limit(2000)
    ]);
    const error = r.error || o.error;
    if(error){ body.innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
    ROWS = r.data || [];
    ORDERS = o.data || [];
  }
  if(TAB === 'mine') paintMine(); else paintAll();
}
function linesOf(orderId){ return ROWS.filter(r => r.order_id === orderId).sort((a, b) => a.id - b.id); }

/* ---------- мои заявки: по заявкам ---------- */
function paintMine(){
  $('mineChips').innerHTML = MINE_FILTERS.map(f => '<button class="chip' + (f.key === MINE_F ? ' on' : '') +
    '" data-f="' + f.key + '">' + esc(f.label) + '</button>').join('');
  $('mineChips').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { MINE_F = b.dataset.f; paintMine(); });
  const list = ORDERS.filter(o => o.author_id === ME.id).map(o => ({ o, lines: linesOf(o.id) }))
    .filter(x => MINE_F === 'all' || x.lines.some(r => ACTIVE.includes(r.status)));
  if(!list.length){
    $('mineBody').innerHTML = '<div class="empty">' + (MINE_F === 'act' ? 'Активных заявок нет' : 'Заявок пока нет') +
      (canCreate() ? '<div style="margin-top:14px"><button class="btn sm" id="newEmpty">Новая заявка</button></div>' : '') + '</div>';
    if($('newEmpty')) $('newEmpty').onclick = openNew;
    return;
  }
  $('mineBody').innerHTML = '<div class="panel rf-panel"><table class="tbl rf-tbl"><thead><tr>' +
    '<th>№</th><th>Товары</th><th>Нужно к</th><th>Статус</th><th>Создана</th>' +
    '</tr></thead><tbody>' + list.map(({ o, lines }) =>
      '<tr><td data-label="№" class="dim">' + o.id + '</td>' +
      '<td data-label="Товары" class="nm"><span><button class="rf-lnk" data-order="' + o.id + '">' +
        esc(lines.slice(0, 2).map(r => r.item_name).join(', ')) + '</button>' +
        '<span class="dim rf-small rf-blk">' + lines.length + ' ' + plural(lines.length, 'позиция', 'позиции', 'позиций') +
          (o.client_name ? ' · ' + esc(o.client_name) : '') + '</span></span></td>' +
      '<td data-label="Нужно к">' + needHTML(o.need_by) + '</td>' +
      '<td data-label="Статус"><span>' + stCounts(lines) + '</span></td>' +
      '<td data-label="Создана" class="dim">' + esc(fmtDateTime(o.created_at)) + '</td></tr>').join('') +
    '</tbody></table></div>';
  $('mineBody').querySelectorAll('[data-order]').forEach(b => b.onclick = () => openOrder(Number(b.dataset.order)));
}

/* ---------- все заявки: строки по товарам, одинаковые склеены ---------- */
function allFiltered(){
  const q = $('q').value.trim().toLowerCase();
  const a = $('fAuthor').value, br = $('fBrand').value, per = $('fPeriod').value;
  const since = per ? new Date(Date.now() - Number(per) * 864e5).toISOString() : '';
  return ROWS.filter(r =>
    (ALL_F === 'all' || (ALL_F === 'act' ? ACTIVE.includes(r.status) : r.status === ALL_F)) &&
    (!a || r.author_id === a) &&
    (!br || brandOf(r.item_path) === br) &&
    (!since || r.created_at >= since) &&
    (!q || (r.item_name || '').toLowerCase().includes(q) || (r.item_article || '').toLowerCase().includes(q) || r.item_code === q));
}
function fillSelect(id, values, allLabel){
  const cur = $(id).value;
  $(id).innerHTML = '<option value="">' + esc(allLabel) + '</option>' + values
    .map(x => '<option value="' + esc(x[0]) + '"' + (x[0] === cur ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('');
}
function paintAll(){
  const cnt = k => ROWS.filter(r => k === 'all' || (k === 'act' ? ACTIVE.includes(r.status) : r.status === k)).length;
  $('allChips').innerHTML = ALL_FILTERS.map(f => '<button class="chip' + (f.key === ALL_F ? ' on' : '') +
    '" data-f="' + f.key + '">' + esc(f.label) + ' · ' + cnt(f.key) + '</button>').join('');
  $('allChips').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ALL_F = b.dataset.f; paintAll(); });

  fillSelect('fAuthor', Array.from(new Set(ROWS.map(r => r.author_id))).map(id => [id, empName(id)])
    .sort((x, y) => x[1].localeCompare(y[1])), 'Все менеджеры');
  fillSelect('fBrand', Array.from(new Set(ROWS.map(r => brandOf(r.item_path)).filter(Boolean))).sort()
    .map(b => [b, b]), 'Все бренды и папки');

  const rows = allFiltered();
  if(!rows.length){ $('allBody').innerHTML = '<div class="empty">Заявок нет</div>'; return; }

  const groups = new Map();
  rows.forEach(r => {
    if(!groups.has(r.item_code)) groups.set(r.item_code, []);
    groups.get(r.item_code).push(r);
  });
  const minNeed = g => g.map(r => r.need_by).filter(Boolean).sort()[0] || '9999-12-31';
  const sort = $('fSort').value;
  const list = Array.from(groups.values()).map(g => g.sort((x, y) => String(x.created_at).localeCompare(String(y.created_at))));
  list.sort((x, y) => {
    if(sort === 'urgent') return minNeed(x).localeCompare(minNeed(y)) || String(x[0].created_at).localeCompare(String(y[0].created_at));
    if(sort === 'folder') return folderOf(x[0].item_path).localeCompare(folderOf(y[0].item_path)) || x[0].item_name.localeCompare(y[0].item_name);
    return String(x[0].created_at).localeCompare(String(y[0].created_at));
  });

  let html = '', lastFolder = null;
  list.forEach(g => {
    if(sort === 'folder'){
      const f = folderOf(g[0].item_path) || 'Без папки';
      if(f !== lastFolder){ html += '<tr class="pc-fold"><td colspan="6">' + esc(f) + '</td></tr>'; lastFolder = f; }
    }
    html += groupHTML(g);
  });
  $('allBody').innerHTML = '<div class="panel rf-panel"><table class="tbl rf-tbl"><thead><tr>' +
    '<th>Товар</th><th class="num">Всего</th><th>Кто просит</th><th>Нужно к</th><th>Статус</th><th></th>' +
    '</tr></thead><tbody>' + html + '</tbody></table></div>';

  $('allBody').querySelectorAll('[data-order]').forEach(b => b.onclick = () => openOrder(Number(b.dataset.order), Number(b.dataset.line)));
  $('allBody').querySelectorAll('[data-exp]').forEach(b => b.onclick = () => {
    const k = b.dataset.exp;
    OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k);
    paintAll();
  });
  $('allBody').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const g = groups.get(b.dataset.st) || [];
    const same = new Set(g.map(r => r.status)).size === 1 ? g[0].status : '';
    openStatus(g.map(r => r.id), g[0].item_name, g.length > 1 ? g.length + ' ' + plural(g.length, 'строка', 'строки', 'строк') : '', same);
  });
}
function groupHTML(g){
  const r0 = g[0];
  const code = esc(r0.item_code);
  const total = g.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const people = Array.from(new Set(g.map(r => r.author_id)));
  const needs = g.map(r => r.need_by).filter(Boolean).sort();
  const unseen = g.some(r => r.status === 'new' && !r.seen_at);
  const multi = g.length > 1;
  const open = OPEN.has(r0.item_code);
  let html = '<tr' + (unseen ? ' class="alarm"' : '') + '>' +
    '<td data-label="Товар" class="nm"><span>' +
      (multi ? '<button class="rf-lnk" data-exp="' + code + '">' + esc(r0.item_name) + '</button>'
             : '<button class="rf-lnk" data-order="' + r0.order_id + '" data-line="' + r0.id + '">' + esc(r0.item_name) + '</button>') +
      '<span class="dim rf-small rf-blk">' + esc([r0.item_article, lastGroup(r0.item_path)].filter(Boolean).join(' · ')) +
        (!multi && r0.note ? ' · <i>' + esc(r0.note) + '</i>' : '') + '</span></span></td>' +
    '<td data-label="Всего" class="num"><b>' + esc(qtyUnit(total, r0.item_unit)) + '</b></td>' +
    '<td data-label="Кто просит"><span>' + esc(people.map(empName).join(', ')) +
      '<span class="dim rf-small rf-blk">' + (multi
        ? g.length + ' ' + plural(g.length, 'заявка', 'заявки', 'заявок') +
          ' · <button class="rf-lnk rf-small" data-exp="' + code + '">' + (open ? 'свернуть' : 'показать') + '</button>'
        : 'заявка №' + r0.order_id) + '</span></span></td>' +
    '<td data-label="Нужно к">' + needHTML(needs[0]) + '</td>' +
    '<td data-label="Статус"><span>' + stCounts(g) + '</span></td>' +
    '<td class="acts-cell"><div class="acts">' +
      (canManage() ? '<button class="btn sm" data-st="' + code + '">Статус' + (multi ? ' всем' : '') + '</button>' : '') +
    '</div></td></tr>';
  if(multi && open){
    html += g.map(r => '<tr class="pc-sub">' +
      '<td data-label="Заявка" class="nm"><span><button class="rf-lnk" data-order="' + r.order_id + '" data-line="' + r.id + '">№' +
        r.order_id + ' · ' + esc(empName(r.author_id)) + '</button>' +
        (r.note || r.client_name ? '<span class="dim rf-small rf-blk">' + esc([r.note, r.client_name].filter(Boolean).join(' · ')) + '</span>' : '') +
      '</span></td>' +
      '<td data-label="Количество" class="num">' + esc(qtyUnit(r.qty, r.item_unit)) + '</td>' +
      '<td data-label="Создана" class="dim">' + esc(fmtDateTime(r.created_at)) + '</td>' +
      '<td data-label="Нужно к">' + needHTML(r.need_by) + '</td>' +
      '<td data-label="Статус">' + stHTML(r.status) + '</td><td></td></tr>').join('');
  }
  return html;
}

/* ---------- карточка заявки: все товары, свой статус у каждого ---------- */
async function openOrder(id, focusLine){
  if(!id) return;
  modalOpen({ title:'Заявка №' + id, wide:true, bodyHTML:'<div class="loading">Загрузка…</div>' });
  const { data, error } = await sb.rpc('purchase_order_open', { p_order: id });
  if(!document.getElementById('crmModal')) return;
  if(error){ modalBody().innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  if(!data){ modalBody().innerHTML = '<div class="empty">Заявка не найдена или недоступна</div>'; return; }
  const o = data, lines = o.lines || [], ev = o.events || [];
  if(ROWS) lines.forEach(l => { const x = ROWS.find(r => r.id === l.id); if(x && !x.seen_at && l.seen_at) x.seen_at = l.seen_at; });
  const mng = canManage();
  const nameOf = rid => { const l = lines.find(x => x.id === rid); return l ? l.item_name : ''; };
  let html =
    '<dl class="kv" style="padding:0 0 14px">' +
      '<dt>От кого</dt><dd>' + esc(empName(o.author_id)) + ' <span class="dim">· ' + esc(fmtDateTime(o.created_at)) + '</span></dd>' +
      '<dt>Нужно к</dt><dd>' + needHTML(o.need_by) + '</dd>' +
      (o.client_name ? '<dt>Клиент</dt><dd>' + esc(o.client_name) + '</dd>' : '') +
      (o.comment ? '<dt>Комментарий</dt><dd>' + esc(o.comment) + '</dd>' : '') +
    '</dl>' +
    '<div class="sec" style="margin:4px 0 8px">Товары · ' + lines.length + '</div>' +
    '<div class="panel rf-panel"><table class="tbl rf-tbl"><thead><tr>' + (mng ? '<th></th>' : '') +
      '<th>Товар</th><th class="num">Количество</th><th>Статус</th></tr></thead><tbody>' +
    lines.map(l => '<tr' + (l.id === focusLine ? ' class="pc-focus"' : '') + '>' +
      (mng ? '<td data-label="Выбрать" class="rf-ck"><input type="checkbox" data-ln="' + l.id + '"' +
        (l.id === focusLine ? ' checked' : '') + ' aria-label="Выбрать"></td>' : '') +
      '<td data-label="Товар" class="nm"><span>' + esc(l.item_name) +
        '<span class="dim rf-small rf-blk">' + esc([l.item_article, (l.item_path || []).slice(1).join(' › ')].filter(Boolean).join(' · ')) + '</span>' +
        (l.note ? '<span class="rf-small rf-blk"><i>' + esc(l.note) + '</i></span>' : '') + '</span></td>' +
      '<td data-label="Количество" class="num"><b>' + esc(qtyUnit(l.qty, l.item_unit)) + '</b></td>' +
      '<td data-label="Статус"><span>' + stHTML(l.status) +
        (l.status === 'refused' && l.refuse_reason ? '<span class="dim rf-small rf-blk">' + esc(l.refuse_reason) + '</span>' : '') +
      '</span></td></tr>').join('') +
    '</tbody></table></div>';
  if(mng){
    html += '<div class="btn-row" style="margin:10px 0 6px;gap:8px;flex-wrap:wrap">' +
      '<button class="btn sm ghost" id="ckAll">Выбрать все</button>' +
      '<button class="btn sm" id="stSel" style="flex:1">Статус выбранным</button></div>';
  }
  html += '<div class="sec" style="margin:18px 0 8px">История</div><div class="rf-calls">' + ev.map(e =>
    '<div class="rf-call"><div class="l1">' + stHTML(e.status) + '<span class="dim">' + esc(fmtDateTime(e.at)) + '</span></div>' +
    '<div class="rf-small">' + esc(nameOf(e.request_id)) + '</div>' +
    '<div class="rf-small dim">' + esc(e.actor_id ? empName(e.actor_id) : '') + '</div>' +
    (e.note ? '<div class="rf-cmt">' + esc(e.note) + '</div>' : '') + '</div>').join('') + '</div>';
  modalBody().innerHTML = html;
  if(mng){
    const cks = Array.from(modalBody().querySelectorAll('[data-ln]'));
    const paintCk = () => { $('ckAll').textContent = cks.every(c => c.checked) ? 'Снять все' : 'Выбрать все'; };
    cks.forEach(c => c.onchange = paintCk);
    paintCk();
    $('ckAll').onclick = () => {
      const all = cks.every(c => c.checked);
      cks.forEach(c => c.checked = !all);
      paintCk();
    };
    $('stSel').onclick = () => {
      const ids = Array.from(modalBody().querySelectorAll('[data-ln]:checked')).map(c => Number(c.dataset.ln));
      if(!ids.length) return toast('Отметьте товары');
      const sel = lines.filter(l => ids.includes(l.id));
      const same = new Set(sel.map(l => l.status)).size === 1 ? sel[0].status : '';
      openStatus(ids, 'заявка №' + o.id, sel.length > 1 ? sel.length + ' ' + plural(sel.length, 'товар', 'товара', 'товаров') : sel[0].item_name, same, o.id);
    };
  }
}

/* ---------- смена статуса ---------- */
function openStatus(ids, name, sub, current, backOrder){
  let st = '';
  const opts = ['in_work', 'ordered', 'arrived', 'refused'].filter(k => k !== current);
  modalOpen({
    title:'Статус: ' + name,
    sheet:true,
    bodyHTML:
      (sub ? '<div class="hint" style="margin:0 0 12px">Поменяется: ' + esc(sub) + '</div>' : '') +
      '<div class="field"><label class="field-label">Новый статус <span class="req">*</span></label>' +
        '<div class="chips-plain" id="sRes">' + opts.map(k =>
          '<button type="button" class="chip" data-s="' + k + '">' + esc(ST[k].ru) + '</button>').join('') + '</div></div>' +
      '<div class="field" id="sWhyBox" hidden><label class="field-label" for="sWhy">Причина отказа <span class="req">*</span></label>' +
        '<textarea id="sWhy" rows="3" maxlength="500" placeholder="Почему не будет закупки"></textarea></div>' +
      '<div class="hint">Менеджеру придёт сообщение при «Заказано», «Пришло» и «Отказ».</div>',
    saveLabel:'Сохранить',
    onSave: async () => {
      if(!st) return modalMsg('Выберите статус');
      const reason = $('sWhy').value.trim();
      if(st === 'refused' && !reason) return modalMsg('Напишите причину отказа');
      modalBusy(true, 'Сохраняем…');
      const { data, error } = await sb.rpc('purchase_set_status', { p_ids: ids, p_status: st, p_reason: reason || null });
      modalBusy(false, 'Сохранить');
      if(error) return modalMsg(errText(error));
      modalClose();
      toast(data ? 'Статус: ' + ST[st].ru + (data > 1 ? ' · ' + data + ' ' + plural(data, 'товар', 'товара', 'товаров') : '') : 'Статус уже такой');
      await loadRows(true);
      if(backOrder) openOrder(backOrder);
    }
  });
  $('sRes').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    st = b.dataset.s;
    $('sRes').querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
    $('sWhyBox').hidden = st !== 'refused';
  });
}

/* ---------- новая заявка: шаг 1 — подбор галочками, шаг 2 — количество и общие поля ---------- */
let PICKED = new Map(), CRUMBS = [], LIST_ITEMS = [], FORM = { need:'', client:'', cmt:'' };
function openNew(){
  PICKED = new Map(); CRUMBS = []; FORM = { need:'', client:'', cmt:'' };
  showPick(null);
}
function showPick(code){
  modalOpen({ title:'Новая заявка · подбор', wide:true, bodyHTML:
    '<div class="f-search" style="margin-bottom:10px">' + icon('search') +
      '<input id="nQ" type="search" placeholder="Название или артикул" autocomplete="off"></div>' +
    '<div class="pc-crumbs" id="nCrumbs"></div>' +
    '<div id="nList"><div class="loading">Загрузка…</div></div>' +
    '<div class="pc-bar"><span id="nCount"></span>' +
      '<button class="btn" id="nNext">Далее</button></div>' });
  let timer = null;
  $('nQ').oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(() => $('nQ').value.trim().length >= 2 ? runSearch2() : loadTree(CRUMBS.length ? CRUMBS[CRUMBS.length - 1].code : null, true), 250);
  };
  $('nNext').onclick = () => PICKED.size ? showForm() : toast('Отметьте хотя бы один товар');
  paintCount();
  loadTree(code, !!code);
}
function paintCount(){
  if(!$('nCount')) return;
  $('nCount').innerHTML = PICKED.size ? 'Выбрано: <b>' + PICKED.size + '</b>' : '<span class="dim">Отметьте товары</span>';
}
async function loadTree(code, keepCrumbs){
  $('nList').innerHTML = '<div class="loading">Загрузка…</div>';
  const { data, error } = await sb.rpc('purchase_tree', { p_parent: code });
  if(!$('nList')) return;
  if(error){ $('nList').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  if(!keepCrumbs) CRUMBS = data.parent ? [{ code: data.parent.code, name: data.parent.name }] : [];
  paintCrumbs();
  const g = data.groups || [], it = (data.items || []).map(x => Object.assign({ path: CRUMBS.map(c => c.name) }, x));
  LIST_ITEMS = it;
  if(!g.length && !it.length){ $('nList').innerHTML = '<div class="empty">В этой папке пусто</div>'; return; }
  $('nList').innerHTML = '<div class="pc-list">' +
    g.map(x => '<button type="button" class="pc-row grp" data-g="' + esc(x.code) + '" data-n="' + esc(x.name) + '">' +
      '<span class="pc-ic">📁</span><span class="pc-nm">' + esc(x.name) + '</span><span class="dim rf-small">' + x.count + '</span></button>').join('') +
    it.map(itemRowHTML).join('') + '</div>';
  wireList();
}
async function runSearch2(){
  const q = $('nQ').value.trim();
  $('nList').innerHTML = '<div class="loading">Ищем…</div>';
  const { data, error } = await sb.rpc('purchase_search', { p_q: q });
  if(!$('nList') || $('nQ').value.trim() !== q) return;
  if(error){ $('nList').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  $('nCrumbs').innerHTML = '<span class="dim rf-small">Поиск по всей номенклатуре' + (data.length >= 60 ? ' · показаны первые 60' : '') + '</span>';
  LIST_ITEMS = data;
  if(!data.length){ $('nList').innerHTML = '<div class="empty">Ничего не нашлось</div>'; return; }
  $('nList').innerHTML = '<div class="pc-list">' + data.map(itemRowHTML).join('') + '</div>';
  wireList();
}
function itemRowHTML(x){
  const on = PICKED.has(x.code);
  return '<label class="pc-row pc-pickrow' + (on ? ' on' : '') + '" data-i="' + esc(x.code) + '">' +
    '<input type="checkbox"' + (on ? ' checked' : '') + ' aria-label="Выбрать">' +
    '<span class="pc-nm">' + esc(x.name) +
      '<span class="dim rf-small rf-blk">' + esc([x.article, x.unit, (x.path || []).slice(1).join(' / ')].filter(Boolean).join(' · ')) + '</span></span></label>';
}
function paintCrumbs(){
  $('nCrumbs').innerHTML = CRUMBS.map((c, i) => i === CRUMBS.length - 1
    ? '<b>' + esc(c.name) + '</b>'
    : '<button type="button" class="rf-lnk" data-c="' + i + '">' + esc(c.name) + '</button>').join(' / ');
  $('nCrumbs').querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    CRUMBS = CRUMBS.slice(0, Number(b.dataset.c) + 1);
    $('nQ').value = '';
    loadTree(CRUMBS[CRUMBS.length - 1].code, true);
  });
}
function wireList(){
  $('nList').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    CRUMBS.push({ code: b.dataset.g, name: b.dataset.n });
    loadTree(b.dataset.g, true);
  });
  $('nList').querySelectorAll('[data-i]').forEach(row => {
    const ck = row.querySelector('input');
    ck.onchange = () => {
      const x = LIST_ITEMS.find(i => i.code === row.dataset.i);
      if(!x) return;
      if(ck.checked) PICKED.set(x.code, Object.assign({ qty:'', note:'' }, PICKED.get(x.code) || {}, x));
      else PICKED.delete(x.code);
      row.classList.toggle('on', ck.checked);
      paintCount();
    };
  });
}
function saveFormState(){
  if(!$('fNeed')) return;
  FORM = { need: $('fNeed').value, client: $('fClient').value, cmt: $('fCmt').value };
  modalBody().querySelectorAll('[data-q]').forEach(inp => { const p = PICKED.get(inp.dataset.q); if(p) p.qty = inp.value; });
  modalBody().querySelectorAll('[data-nt]').forEach(inp => { const p = PICKED.get(inp.dataset.nt); if(p) p.note = inp.value; });
}
function showForm(){
  modalOpen({ title:'Новая заявка · ' + PICKED.size + ' ' + plural(PICKED.size, 'товар', 'товара', 'товаров'), wide:true, bodyHTML:
    '<div class="pc-lines">' + Array.from(PICKED.values()).map(p =>
      '<div class="pc-line" data-row="' + esc(p.code) + '">' +
        '<div class="pc-line-top"><div class="pc-nm"><b>' + esc(p.name) + '</b>' +
          '<span class="dim rf-small rf-blk">' + esc([p.article, (p.path || []).slice(1).join(' / ')].filter(Boolean).join(' · ')) + '</span></div>' +
          '<button type="button" class="ib" data-rm="' + esc(p.code) + '" aria-label="Убрать">' + icon('x') + '</button></div>' +
        '<div class="pc-line-in"><input type="number" inputmode="decimal" min="0" step="any" data-q="' + esc(p.code) + '" value="' + esc(p.qty) + '" placeholder="Количество">' +
          '<span class="dim">' + esc(p.unit || '') + '</span>' +
          (p.note ? '' : '<button type="button" class="rf-lnk rf-small" data-addnote="' + esc(p.code) + '">+ пометка</button>') + '</div>' +
        '<input type="text" maxlength="200" class="pc-note" data-nt="' + esc(p.code) + '" value="' + esc(p.note) + '" placeholder="Пометка к товару: цвет, левый/правый…"' + (p.note ? '' : ' hidden') + '>' +
      '</div>').join('') + '</div>' +
    '<button type="button" class="btn sm ghost" id="fMore" style="margin:6px 0 16px">+ Добавить ещё товары</button>' +
    '<div class="field"><label class="field-label" for="fNeed">Когда нужно</label>' +
      '<input id="fNeed" type="date" min="' + esc(tzYmd()) + '" value="' + esc(FORM.need) + '">' +
      '<div class="chips-plain" style="margin:8px 0 0">' + [[1, 'Завтра'], [3, 'Через 3 дня'], [7, 'Через неделю']].map(d =>
        '<button type="button" class="chip" data-d="' + d[0] + '">' + d[1] + '</button>').join('') + '</div></div>' +
    '<div class="field"><label class="field-label" for="fClient">Для какого клиента</label>' +
      '<input id="fClient" type="text" maxlength="200" placeholder="Необязательно" value="' + esc(FORM.client) + '"></div>' +
    '<div class="field"><label class="field-label" for="fCmt">Комментарий ко всей заявке</label>' +
      '<textarea id="fCmt" rows="3" maxlength="1000" placeholder="Необязательно">' + esc(FORM.cmt) + '</textarea></div>' +
    '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn" id="crmSave" style="flex:1">Отправить закупщику</button>' +
      '<button class="btn ghost" id="crmCancel">Отмена</button></div><div class="msg err" id="crmMsg"></div>' });
  const body = modalBody();
  $('crmCancel').onclick = modalClose;
  $('fMore').onclick = () => { saveFormState(); showPick(CRUMBS.length ? CRUMBS[CRUMBS.length - 1].code : null); };
  body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    saveFormState();
    PICKED.delete(b.dataset.rm);
    if(!PICKED.size){ showPick(CRUMBS.length ? CRUMBS[CRUMBS.length - 1].code : null); return; }
    showForm();
  });
  body.querySelectorAll('[data-addnote]').forEach(b => b.onclick = () => {
    const inp = body.querySelector('[data-nt="' + b.dataset.addnote + '"]');
    inp.hidden = false; inp.focus(); b.remove();
  });
  body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    $('fNeed').value = tzYmd(new Date(Date.now() + Number(b.dataset.d) * 864e5));
  });
  const first = body.querySelector('[data-q]');
  if(first && !first.value) first.focus();
  $('crmSave').onclick = async () => {
    saveFormState();
    const items = [];
    for(const p of PICKED.values()){
      const qty = Number(String(p.qty).replace(',', '.'));
      if(!(qty > 0)){
        const inp = body.querySelector('[data-q="' + p.code + '"]');
        if(inp) inp.focus();
        return modalMsg('Укажите количество: ' + p.name);
      }
      items.push({ code: p.code, qty: qty, note: (p.note || '').trim() || null });
    }
    modalBusy(true, 'Отправляем…');
    const { data, error } = await sb.rpc('purchase_create', {
      p_items: items, p_need_by: FORM.need || null, p_client: FORM.client.trim() || null, p_comment: FORM.cmt.trim() || null
    });
    modalBusy(false, 'Отправить закупщику');
    if(error) return modalMsg(errText(error));
    modalClose();
    toast('Заявка №' + data + ' отправлена закупщику');
    PICKED = new Map();
    if(TAB === 'stats') showTab(ACC.view ? 'all' : 'mine');
    else loadRows(true);
  };
}

/* ---------- статистика (по строкам-товарам) ---------- */
async function loadStats(){
  const m = $('fMonth').value || tzYmd().slice(0, 7);
  const from = m + '-01';
  const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0);
  const to = m + '-' + String(d.getDate()).padStart(2, '0');
  $('statTiles').innerHTML = '';
  $('statsBody').innerHTML = '<div class="loading">Загрузка…</div>';
  const { data, error } = await sb.rpc('purchase_stats', { p_from: from, p_to: to });
  if(error){ $('statsBody').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  const s = data || {}, b = s.by_status || {};
  const tile = (n, c) => '<div class="tile"><div class="n">' + esc(String(n)) + '</div><div class="c">' + esc(c) + '</div></div>';
  $('statTiles').innerHTML =
    tile(s.total || 0, 'товаров в заявках') +
    tile(b.arrived || 0, 'пришло') +
    tile(b.refused || 0, 'отказ') +
    tile(s.avg_days_arrived === null || s.avg_days_arrived === undefined ? '—' : String(s.avg_days_arrived).replace('.', ','), 'дней в среднем до «Пришло»');
  if(!s.total){ $('statsBody').innerHTML = '<div class="empty">За этот месяц заявок нет</div>'; return; }
  const top = s.top_items || [], by = s.by_author || [];
  $('statsBody').innerHTML =
    '<div class="sec">Что просят чаще всего</div>' +
    '<div class="panel rf-panel"><table class="tbl rf-tbl"><thead><tr><th>Товар</th><th class="num">Раз просили</th>' +
      '<th class="num">Всего</th><th class="num">Менеджеров</th><th class="num">Отказ</th></tr></thead><tbody>' +
      top.map(x => '<tr><td data-label="Товар" class="nm">' + esc(x.name) + '</td>' +
        '<td data-label="Раз просили" class="num">' + x.requests + '</td>' +
        '<td data-label="Всего" class="num">' + esc(qtyUnit(x.qty, x.unit)) + '</td>' +
        '<td data-label="Менеджеров" class="num">' + x.authors + '</td>' +
        '<td data-label="Отказ" class="num">' + (x.refused || 0) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="sec">По менеджерам</div>' +
    '<div class="panel rf-panel"><table class="tbl rf-tbl"><thead><tr><th>Менеджер</th><th class="num">Товаров</th>' +
      '<th class="num">Пришло</th><th class="num">Отказ</th></tr></thead><tbody>' +
      by.map(x => '<tr><td data-label="Менеджер" class="nm">' + esc(empName(x.author_id)) + '</td>' +
        '<td data-label="Товаров" class="num">' + x.requests + '</td>' +
        '<td data-label="Пришло" class="num">' + x.arrived + '</td>' +
        '<td data-label="Отказ" class="num">' + x.refused + '</td></tr>').join('') +
    '</tbody></table></div>';
}
