<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRO MEBEL CRM — Задачи</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="crm.css">
</head>
<body>
<main class="main" id="main">
  <div class="split">
    <div class="col-list">
      <div class="pagehead"><h1 id="pageTitle">Задачи</h1>
        <button class="ib" id="searchBtnPc" aria-label="Поиск"></button></div>

      <div class="pad" id="searchWrap" hidden style="padding-bottom:0">
        <div class="f-search"><span id="searchIcon"></span>
          <input id="fSearch" type="search" placeholder="Поиск по названию" autocomplete="off"></div>
      </div>

      <div class="seg" id="seg">
        <button data-tab="mine">Мои</button>
        <button data-tab="author">Поставленные</button>
        <button data-tab="all">Все</button>
      </div>

      <div class="chips" id="chips"></div>
      <div class="rows" id="list"><div class="loading">Загрузка…</div></div>
    </div>

    <div class="col-detail" id="colDetail">
      <div class="empty" id="dPlaceholder">Выберите задачу из списка</div>

      <div class="layer" id="detail" hidden>
        <div class="lhead">
          <button class="ib" id="dBack" aria-label="Назад"></button>
          <span class="tt" id="dHeadTitle"></span>
          <button class="ib" id="dMore" aria-label="Ещё"></button>
        </div>
        <div class="lbody" id="dBody"></div>
        <div class="lfoot">
          <div class="act-bar" id="dActs"></div>
          <div class="composer">
            <button class="clipbtn" id="clip" aria-label="Прикрепить"></button>
            <textarea id="cmBody" rows="1" placeholder="Комментарий"></textarea>
            <button class="send" id="cmSend" aria-label="Отправить"></button>
          </div>
          <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
          <input id="filePick" type="file" hidden
            accept="image/jpeg,image/png,image/webp,image/heic,application/pdf,.xlsx,.docx,.xls,.doc,.txt">
          <div class="msg err" id="dMsg" style="padding:0 12px 8px;margin:0"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="supabase.min.js"></script>
<script src="core.js"></script>
<script>
initTheme();
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);

let TAB = ['mine','author','all'].includes(qs.get('tab')) ? qs.get('tab') : 'mine';
let FILTER = qs.get('f') || 'active';
let ROWS = [], CUR = null, SEARCH = '';
let ASSIGNEE = qs.get('assignee') || '';   // приходит из панели руководителя

const CHIPS = [
  { key:'active',   label:'Активные' },
  { key:'overdue',  label:'Просроченные' },
  { key:'today',    label:'Сегодня' },
  { key:'review',   label:'На проверке' },
  { key:'high',     label:'Высокий приоритет' },
  { key:'done',     label:'Выполненные' },
  { key:'archive',  label:'Архив' },
  { key:'tpl',      label:'Повторяющиеся', onlyAuthor:true }
];
let FILES = [];      // вложения открытой задачи
const isDesktop = () => matchMedia('(min-width:1024px)').matches;

(async () => {
  if(!await requireAuth()) return;
  await renderShell({
    title:'Задачи',
    tab: TAB === 'author' ? 'author' : 'tasks',
    actions:'<button class="ib" id="searchBtn" aria-label="Поиск">' + icon('search') + '</button>'
  });
  await loadEmployees();

  $('searchIcon').innerHTML = icon('search');
  $('searchBtnPc').innerHTML = icon('search');
  $('dBack').innerHTML = icon('arrowLeft');
  $('dMore').innerHTML = icon('dots');
  $('cmSend').innerHTML = icon('send');
  $('searchBtn').onclick = toggleSearch;
  $('searchBtnPc').onclick = toggleSearch;

  document.querySelectorAll('#seg button').forEach(b => {
    b.onclick = () => {
      TAB = b.dataset.tab;
      // «Повторяющиеся» есть только на «Поставленные мной» — уходим с них при смене вкладки
      if(FILTER === 'tpl' && TAB !== 'author') FILTER = 'active';
      paintSeg(); paintChips(); syncUrl(); load();
    };
  });
  paintSeg();
  paintChips();

  let t = null;
  $('fSearch').oninput = () => { clearTimeout(t); t = setTimeout(() => { SEARCH = $('fSearch').value.trim(); load(); }, 250); };

  $('dBack').onclick = () => history.length > 1 ? history.back() : closeDetail();
  $('dMore').onclick = openMenu;
  $('cmSend').onclick = addComment;
  $('clip').innerHTML = icon('clip');
  $('clip').onclick = pickFile;
  $('fileCam').onchange = () => sendFile($('fileCam'));
  $('filePick').onchange = () => sendFile($('filePick'));
  autoGrow($('cmBody'));
  $('cmBody').addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addComment(); }
  });

  addEventListener('popstate', e => {
    const id = e.state && e.state.task;
    if(id) openTask(id, false); else closeDetail();
  });

  await load();
  const open = qs.get('task');
  if(open) openTask(Number(open), false);
})();

function paintSeg(){
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
}
function paintChips(){
  const who = ASSIGNEE
    ? '<button class="chip on" id="chipWho">' + esc(empName(ASSIGNEE)) + ' ' + icon('x') + '</button>'
    : '';
  $('chips').innerHTML = who + CHIPS.filter(c => !c.onlyAuthor || TAB === 'author').map(c =>
    '<button class="chip' + (c.key === FILTER ? ' on' : '') + '" data-f="' + c.key + '">' +
    esc(c.label) + '</button>').join('');
  $('chips').querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => { FILTER = b.dataset.f; paintChips(); syncUrl(); load(); };
  });
  if(ASSIGNEE) $('chipWho').onclick = () => { ASSIGNEE = ''; paintChips(); syncUrl(); load(); };
}
function toggleSearch(){
  const w = $('searchWrap');
  w.hidden = !w.hidden;
  if(!w.hidden) $('fSearch').focus();
  else if(SEARCH){ SEARCH = ''; $('fSearch').value = ''; load(); }
}
function syncUrl(){
  const u = new URL(location.href);
  u.searchParams.set('tab', TAB);
  u.searchParams.set('f', FILTER);
  if(ASSIGNEE) u.searchParams.set('assignee', ASSIGNEE); else u.searchParams.delete('assignee');
  u.searchParams.delete('task');
  history.replaceState(null, '', u);
}

/* ============================================================
   СПИСОК
   ============================================================ */
async function load(){
  $('list').innerHTML = '<div class="loading">Загрузка…</div>';
  if(FILTER === 'tpl' && TAB === 'author') return loadTemplates();

  let q = sb.from('v_tasks').select(TASK_COLS);
  // архив — отдельный чип, во всех остальных выборках архивных не показываем
  q = FILTER === 'archive' ? q.not('archived_at', 'is', null) : q.is('archived_at', null);
  if(TAB === 'mine') q = q.eq('assignee_id', ME.id);
  if(TAB === 'author') q = q.eq('author_id', ME.id);
  if(ASSIGNEE) q = q.eq('assignee_id', ASSIGNEE);

  if(FILTER === 'archive'){ /* только архивные, сортировка ниже */ }
  else if(FILTER === 'active') q = q.in('status', ['new','in_progress','review']);
  else if(FILTER === 'overdue') q = q.eq('is_overdue', true);
  else if(FILTER === 'review') q = q.eq('status', 'review');
  else if(FILTER === 'done') q = q.eq('status', 'done');
  else if(FILTER === 'high'){
    q = q.in('priority', ['high','critical']).in('status', ['new','in_progress','review']);
  }else if(FILTER === 'today'){
    q = q.in('status', ['new','in_progress','review'])
         .gte('due_at', startOfToday().toISOString()).lte('due_at', endOfToday().toISOString());
  }
  if(SEARCH) q = q.ilike('title', '%' + SEARCH.replace(/[\\%_]/g, m => '\\' + m) + '%');

  const { data, error } = await q.limit(500);
  if(error){ $('list').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  ROWS = data || [];
  ROWS.sort(FILTER === 'archive'
    ? (a, b) => new Date(b.completed_at || b.archived_at || 0) - new Date(a.completed_at || a.archived_at || 0)
    : cmpTasks);
  paintList();
}

/* ---------- Повторяющиеся задачи ---------- */
async function loadTemplates(){
  const { data, error } = await sb.from('task_templates')
    .select('*').eq('author_id', ME.id).order('created_at', { ascending:false });
  if(error){ $('list').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  const rows = data || [];
  if(!rows.length){
    $('list').innerHTML = '<div class="empty">Повторяющихся задач нет. ' +
      'Включите «Повторять» при постановке задачи.</div>';
    return;
  }
  $('list').innerHTML = rows.map(t =>
    '<div class="tplrow' + (t.is_active ? '' : ' off') + '">' +
      '<span class="tb2">' +
        '<span class="tn">' + esc(t.title) + '</span>' +
        '<span class="tr">' + esc(empName(t.assignee_id)) + ' · ' + esc(templateRule(t)) + '</span>' +
        '<span class="tr">следующая — ' + esc(t.next_run_at ? fmtDate(t.next_run_at) : '—') + '</span>' +
      '</span>' +
      '<span class="acts">' +
        '<button class="btn ghost sm" data-tgl="' + t.id + '">' + (t.is_active ? 'Выключить' : 'Включить') + '</button>' +
        '<a class="btn ghost sm" href="new-task.html?tpl=' + t.id + '">Изменить</a>' +
        '<button class="btn danger sm" data-del="' + t.id + '">' + icon('trash') + '</button>' +
      '</span>' +
    '</div>').join('');

  $('list').querySelectorAll('[data-tgl]').forEach(b => b.onclick = async () => {
    const t = rows.find(x => x.id === Number(b.dataset.tgl));
    const { error } = await sb.from('task_templates').update({ is_active: !t.is_active }).eq('id', t.id);
    if(error) return toast(errText(error, 'update'));
    loadTemplates();
  });
  $('list').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('task_templates').delete().eq('id', Number(b.dataset.del));
    if(error) return toast(errText(error));
    toast('Повтор удалён');
    loadTemplates();
  });
}

function paintList(){
  if(!ROWS.length){
    $('list').innerHTML = '<div class="empty">' +
      (TAB === 'mine' ? 'Задач нет' : TAB === 'author' ? 'Вы пока не ставили задач' : 'Ничего не нашлось') +
      '</div>';
    return;
  }
  $('list').innerHTML = ROWS.map(t =>
    taskRowHTML(t, { showAuthor: TAB === 'author', active: CUR && CUR.id === t.id })).join('');
  $('list').querySelectorAll('[data-task]').forEach(b =>
    b.onclick = () => openTask(Number(b.dataset.task)));
}

/* ============================================================
   ЭКРАН ЗАДАЧИ
   Телефон — слой поверх, «Назад» Android его закрывает.
   ПК — правая колонка.
   ============================================================ */
async function openTask(id, push){
  if(!id) return;
  $('dPlaceholder').hidden = true;
  $('detail').hidden = false;
  $('dHeadTitle').textContent = 'Задача';
  $('dBody').innerHTML = '<div class="loading">Загрузка…</div>';
  $('dActs').innerHTML = '';
  $('dMsg').textContent = '';

  if(push !== false && (!history.state || history.state.task !== id)){
    history.pushState({ task:id }, '', 'tasks.html?tab=' + TAB + '&task=' + id);
  }

  const { data:t, error } = await sb.from('v_tasks').select('*').eq('id', id).maybeSingle();
  if(error){ $('dBody').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  if(!t){ $('dBody').innerHTML = '<div class="empty">Задача не найдена или закрыта для вас</div>'; return; }
  CUR = t;
  paintList();

  const [subs, comments, events, files] = await Promise.all([
    sb.from('v_tasks').select(TASK_COLS).eq('parent_id', id).order('created_at'),
    sb.from('task_comments').select('id,body,author_id,created_at').eq('task_id', id).order('created_at'),
    sb.from('task_events').select('id,event_type,from_status,to_status,actor_id,created_at')
      .eq('task_id', id).order('created_at'),
    sb.from('task_files').select('id,file_path,file_name,size_bytes,author_id,created_at')
      .eq('task_id', id).order('created_at')
  ]);
  FILES = files.data || [];
  paintTask(t, subs.data || [], comments.data || [], events.data || [], FILES);
}

function closeDetail(){
  $('detail').hidden = true;
  $('dPlaceholder').hidden = false;
  CUR = null;
  paintList();
}

function paintTask(t, subs, comments, events, files){
  const d = dueInfo(t);
  const late = t.is_overdue && t.status !== 'done' && t.status !== 'canceled';
  $('dHeadTitle').textContent = t.title;

  const kv = [
    ['Исполнитель', esc(t.assignee_name || empName(t.assignee_id))],
    ['Постановщик', esc(t.author_name || empName(t.author_id))],
    ['Срок', t.due_at
      ? '<span class="num">' + esc(fmtDateTime(t.due_at)) + '</span>' +
        (late ? ' <span class="late">· ' + esc(d.text) + '</span>' : '')
      : '<span class="sub">без срока</span>'],
    ['Приоритет', esc(PRIORITY_RU[t.priority] || t.priority)],
    ['Филиал', t.branch_name ? esc(t.branch_name) : '<span class="sub">не указан</span>']
  ];
  if(t.parent_id){
    kv.push(['Родительская', '<a href="#" class="opent" data-open="' + t.parent_id + '" ' +
      'style="color:var(--brand);font-weight:700">Задача №' + t.parent_id + '</a>']);
  }

  let html =
    '<div class="dhead">' +
      '<h2>' + (CUR.template_id ? icon('repeat') + ' ' : '') + esc(t.title) + '</h2>' +
      '<div class="stat-line">' + statusDot(t) + '<span>' + esc(STATUS_RU[t.status] || t.status) +
        (late ? ' · <span class="late">' + esc(d.text) + '</span>' : '') + '</span></div>' +
      (CUR.report_required
        ? '<div class="needreport" style="margin-top:8px">' + icon('camera') +
          'Нужен отчёт: фото или файл</div>' : '') +
      (t.archived_at ? '<div class="sub" style="margin-top:6px">В архиве · только чтение</div>' : '') +
    '</div>' +
    '<dl class="kv">' + kv.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>' +
    '<div class="meta-small">Задача <span class="mono">№' + t.id + '</span> · создана ' +
      esc(fmtWhen(t.created_at)) + '</div>';

  if(t.description){
    html += '<div class="sec">Описание</div><div class="pad" style="padding-top:0">' +
      '<div style="white-space:pre-wrap;word-break:break-word">' + esc(t.description) + '</div></div>';
  }
  if(t.done_criteria){
    html += '<div class="sec">Критерий выполнения</div><div class="pad" style="padding-top:0">' +
      '<div style="white-space:pre-wrap;word-break:break-word">' + esc(t.done_criteria) + '</div></div>';
  }

  html += '<div class="sec">Подзадачи' +
    (Number(t.subtasks_total) ? ' <span class="sub num">' + t.subtasks_done + '/' + t.subtasks_total + '</span>' : '') +
    '</div>';
  html += subs.length
    ? '<div class="rows">' + subs.map(s => taskRowHTML(s)).join('') + '</div>'
    : '<div class="pad" style="padding-top:0"><span class="sub">Подзадач нет</span></div>';
  html += '<div class="pad"><a class="btn ghost sm" href="new-task.html?parent=' + t.id + '">' +
    icon('plus') + 'Подзадача</a></div>';

  // комментарии и события одной лентой, как в чате
  const feed = comments.map(c => ({ kind:'c', at:c.created_at, data:c }))
    .concat(events.map(e => ({ kind:'e', at:e.created_at, data:e })))
    .concat((files || []).map(f => ({ kind:'f', at:f.created_at, data:f })))
    .sort((a, b) => new Date(a.at) - new Date(b.at));

  html += '<div class="sec">Обсуждение</div><div class="feed">' +
    (feed.length
      ? feed.map(f => f.kind === 'c' ? bubbleHTML(f.data)
                    : f.kind === 'f' ? fileHTML(f.data) : sysHTML(f.data)).join('')
      : '<div class="sys">Пока ничего не происходило</div>') +
    '</div>';

  $('dBody').innerHTML = html;
  $('dBody').querySelectorAll('[data-task]').forEach(b =>
    b.onclick = () => openTask(Number(b.dataset.task)));
  $('dBody').querySelectorAll('[data-open]').forEach(a =>
    a.onclick = e => { e.preventDefault(); openTask(Number(a.dataset.open)); });
  wireFiles();

  paintActions(t);
  const readonly = !!t.archived_at;
  $('dActs').hidden = readonly;
  document.querySelector('.composer').hidden = readonly;
  $('dBody').scrollTop = 0;
}

function bubbleHTML(c){
  const mine = c.author_id === ME.id;
  return '<div class="bub' + (mine ? ' me' : '') + '">' +
    '<div class="a">' + esc(empName(c.author_id)) + '</div>' +
    '<div class="b">' + esc(c.body) + '</div>' +
    '<div class="d">' + esc(fmtWhen(c.created_at)) + '</div></div>';
}
function fileHTML(f){
  const mine = f.author_id === ME.id;
  const cap = esc(empName(f.author_id)) + ' · ' + esc(fmtWhen(f.created_at)) +
    (canDeleteFile(f) ? '<button class="ib" data-delfile="' + f.id + '" aria-label="Удалить">' +
      icon('trash') + '</button>' : '');
  if(isImageFile(f.file_name)){
    return '<div class="thumb' + (mine ? ' me' : '') + '" data-img="' + f.id + '">' +
      '<img data-src="' + esc(f.file_path) + '" alt="' + esc(f.file_name) + '">' +
      '<div class="cap"><span class="who">' + cap + '</span></div></div>';
  }
  return '<div class="filerow' + (mine ? ' me' : '') + '">' +
    '<span class="fi">' + icon('file') + '</span>' +
    '<span class="fm"><span class="fn">' + esc(f.file_name) + '</span>' +
    '<span class="fs">' + esc(fmtSize(f.size_bytes)) + ' · ' + cap + '</span></span>' +
    '<button class="btn ghost sm" data-openfile="' + f.id + '">Открыть</button></div>';
}
function sysHTML(e){
  return '<div class="sys">' + esc(eventText(e)) + ' · ' + esc(fmtWhen(e.created_at)) + '</div>';
}
function eventText(e){
  if(e.event_type === 'status_changed'){
    const from = STATUS_RU[e.from_status] || e.from_status;
    const to = STATUS_RU[e.to_status] || e.to_status;
    return from ? 'Статус: ' + from + ' → ' + to : 'Статус: ' + to;
  }
  return EVENT_RU[e.event_type] || e.event_type;
}

/* Кнопки зависят от того, кто смотрит. Решает всё равно база:
   триггер crm.tasks_guard() не даст исполнителю закрыть задачу самому. */
function statusActions(t){
  const out = [];
  const push = (to, label, cls, ic) => { if(!out.some(a => a.to === to)) out.push({ to, label, cls, icon:ic }); };
  const s = t.status;
  if(isAssignee(t)){
    if(s === 'new') push('in_progress', 'Взять в работу', 'info', 'play');
    if(s === 'new' || s === 'in_progress') push('review', 'Отправить на проверку', 'warn', 'send');
  }
  if(canBoss(t)){
    if(s === 'review' || s === 'new' || s === 'in_progress') push('done', 'Принять', 'ok', 'check');
    if(s === 'review' || s === 'done' || s === 'canceled') push('in_progress', 'Вернуть в работу', 'info', 'back');
    if(s !== 'canceled' && s !== 'done') push('canceled', 'Отменить', 'danger', 'ban');
  }
  return out;
}
let MENU_ACTS = [];
function paintActions(t){
  const acts = statusActions(t);
  MENU_ACTS = acts.slice(1);
  $('dActs').innerHTML = acts.length
    ? '<button class="btn ' + acts[0].cls + '" id="actMain">' + icon(acts[0].icon) + esc(acts[0].label) + '</button>'
    : '';
  if(acts.length) $('actMain').onclick = () => changeStatus(t.id, acts[0].to);
  $('dMore').hidden = !MENU_ACTS.length;
}
function openMenu(){
  if(!MENU_ACTS.length || !CUR) return;
  const back = document.createElement('div');
  back.className = 'backdrop clear';
  const menu = document.createElement('div');
  menu.className = 'menu';
  menu.innerHTML = MENU_ACTS.map((a, i) =>
    '<button data-i="' + i + '" class="' + (a.cls === 'danger' ? 'danger' : '') + '">' +
    icon(a.icon) + esc(a.label) + '</button>').join('');
  document.body.append(back, menu);
  const r = $('dMore').getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  const close = () => { back.remove(); menu.remove(); };
  back.onclick = close;
  menu.querySelectorAll('button').forEach(b =>
    b.onclick = () => { close(); changeStatus(CUR.id, MENU_ACTS[Number(b.dataset.i)].to); });
}

async function changeStatus(id, status){
  $('dMsg').textContent = '';
  document.querySelectorAll('#dActs .btn').forEach(b => b.disabled = true);
  const { error } = await sb.from('tasks').update({ status }).eq('id', id);
  if(error){
    // сообщения триггеров написаны по-русски — показываем как есть
    $('dMsg').textContent = errText(error, 'task-edit');
    document.querySelectorAll('#dActs .btn').forEach(b => b.disabled = false);
    // не хватает фотоотчёта — сразу предлагаем прикрепить
    if(/отчёт|отчет|файл|фото/i.test(error.message || '')) pickFile();
    return;
  }
  if(status === 'done' || status === 'review') playDone();
  toast(status === 'done' ? 'Задача принята' : status === 'review' ? 'Отправлено на проверку' : 'Статус изменён');
  await openTask(id, false);
  await load();
}

async function addComment(){
  const box = $('cmBody'), body = box.value.trim();
  if(!body || !CUR) return;
  $('cmSend').disabled = true;
  const { error } = await sb.from('task_comments').insert({ task_id:CUR.id, author_id:ME.id, body });
  $('cmSend').disabled = false;
  if(error){ $('dMsg').textContent = errText(error); return; }
  box.value = ''; box.style.height = 'auto';
  await openTask(CUR.id, false);
  const feed = $('dBody').querySelector('.feed');
  if(feed) feed.scrollIntoView({ block:'end' });
}

/* ============================================================
   ВЛОЖЕНИЯ
   ============================================================ */
async function wireFiles(){
  // миниатюры грузим по временной ссылке, в разметку пути не подставляем заранее
  const imgs = [...$('dBody').querySelectorAll('img[data-src]')];
  for(const img of imgs){
    const url = await fileUrl(img.dataset.src);
    if(url) img.src = url;
  }
  $('dBody').querySelectorAll('.thumb img').forEach(img =>
    img.onclick = () => { if(img.src) openImage(img.src); });

  $('dBody').querySelectorAll('[data-openfile]').forEach(b => b.onclick = async () => {
    const f = FILES.find(x => x.id === Number(b.dataset.openfile));
    const w = window.open('', '_blank');           // окно открываем сразу по нажатию
    const url = await fileUrl(f.file_path);
    if(!url){ if(w) w.close(); return toast('Файл недоступен'); }
    if(w) w.location.href = url; else location.href = url;
  });

  $('dBody').querySelectorAll('[data-delfile]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const f = FILES.find(x => x.id === Number(b.dataset.delfile));
    const r = await removeTaskFile(f);
    if(r.error) return toast(r.error);
    toast('Файл удалён');
    await openTask(CUR.id, false);
  });
}

function pickFile(){
  if(!CUR) return;
  // на телефоне спрашиваем: камера или файл
  if(matchMedia('(max-width:1023px)').matches){
    const back = document.createElement('div');
    back.className = 'backdrop clear';
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.innerHTML =
      '<button id="mCam">' + icon('camera') + 'Камера</button>' +
      '<button id="mFile">' + icon('file') + 'Файл</button>';
    document.body.append(back, menu);
    const r = $('clip').getBoundingClientRect();
    menu.style.left = '10px';
    menu.style.top = Math.max(10, r.top - 110) + 'px';
    const close = () => { back.remove(); menu.remove(); };
    back.onclick = close;
    document.getElementById('mCam').onclick = () => { close(); $('fileCam').click(); };
    document.getElementById('mFile').onclick = () => { close(); $('filePick').click(); };
    return;
  }
  $('filePick').click();
}

async function sendFile(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !CUR) return;
  $('clip').disabled = true;
  toast('Загружаем…');
  const r = await uploadTaskFile(CUR.id, file);
  $('clip').disabled = false;
  if(r.error){ $('dMsg').textContent = r.error; return; }
  await openTask(CUR.id, false);
  toast('Файл отправлен');
}

function autoGrow(el){
  el.addEventListener('input', () => {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 104) + 'px';
  });
}
