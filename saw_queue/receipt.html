*{box-sizing:border-box;margin:0;padding:0}
body{background:#5a5a5a;font-family:'Manrope',Arial,sans-serif;color:#111;padding:24px}
.bar{max-width:780px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;background:#F97316;color:#fff;border:none;border-radius:8px;

.btn.ghost{background:#fff;color:#333}
.sheet{max-width:780px;margin:0 auto;background:#fff;padding:48px 54px;min-height:1000px;box-shadow:0 4px 30px #0006}

.dt{font:500 14px 'Manrope';color:#333;margin-top:3px}
.meta{margin-top:12px;font:500 15px 'Manrope';line-height:1.7}
.meta b{font-weight:700}
.rule{height:3px;background:#F97316;margin:22px 0 26px;border-radius:2px}
.para{font:400 13.5px 'Manrope';line-height:1.7;color:#222;margin-bottom:18px;text-align:justify}
.sign{margin-top:60px;display:flex;align-items:flex-end;gap:16px}
.sign .line{width:260px;border-bottom:1px solid #333;height:1px}
.sign .lbl{font:500 14px 'Manrope';color:#333;padding-bottom:2px}
@media print{
  body{background:#fff;padding:0}
  .bar{display:none}
  .sheet{box-shadow:none;margin:0;max-width:100%;min-height:auto;padding:40px 46px}
  @page{margin:0;size:A4}
}
</style>

IkSZKkvAxuaGDiCuZx87QgR2CCfZjgD0yYnSFJkiRJkiRJkiRJGkn/H15jzz1Ad8l8AAAAAElFTkSuQmCC";
const PARA_RU="Выбранные мною декор и кромка соответствуют указанным параметрам и цвету. Размеры деталей, стороны к которым должна быть приклеена кромка проверены и подтверждены. Я, или мой полномочный представитель, после готовности обязуемся проверить заказ на отсутствие браков и наличие деталей, а также забрать всё по Акту приёма-передачи в течении 3 дней с даты готовности.";
const PARA_TJ="Декор ва кромкаи интихобкардаам ба параметрҳо ва ранги муқарраршуда мувофиқат мекунанд. Андозаи қисмҳо тафтиш ва тасдиқ карда шуданд. Ман ё намояндаи ваколатдори ман ӯҳдадор мешавам, ки фармоишро тафтиш кунам ва дар давоми 3 рӯз аз рӯзи омодагӣ бигирам.";

async function build(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){document.getElementById('sheet').innerHTML='<div style="padding:60px;text-align:center">Заказ не указан</div>';return;}
  if(typeof supabase==='undefined' || typeof sb==='undefined'){
    document.getElementById('sheet').innerHTML='<div style="padding:60px;text-align:center;color:#c33">Не загрузилась библиотека Supabase.<br>Открой квитанцию на сайте (https), а не как локальный файл.</div>';
    return;
  }
  let o;
  try{
    const res=await sb.from('queue_orders').select('*').eq('id',id).maybeSingle();
    if(res.error) throw res.error;
    o=res.data;
  }catch(err){
    document.getElementById('sheet').innerHTML='<div style="padding:60px;text-align:center;color:#c33">Ошибка загрузки:<br>'+(err.message||err)+'</div>';
    return;
  }
  if(!o){document.getElementById('sheet').innerHTML='<div style="padding:60px;text-align:center">Заказ не найден</div>';return;}

  // номер квитанции: реализация если есть, иначе короткий ID заказа
  const num=o.realization||o.id.slice(0,8);
  const dt=new Date(o.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  // QR не критичен — если библиотека не загрузилась, строим квитанцию без него
  let qrImg='';
  try{
    if(typeof QRCode!=='undefined'){
      const qrData=await QRCode.toDataURL('PROMEBEL:'+num,{margin:1,width:260});
      qrImg=`<img class="qr" src="${qrData}">`;
    }
  }catch(e){ qrImg=''; }

  document.getElementById('sheet').innerHTML=`
    <div class="top">
      <img class="logo" src="${LOGO}" alt="PRO MEBEL">
      <div class="qr-wrap">${qrImg}<div class="qr-id">ID ${num}</div></div>
    </div>
    <div class="title">Реализация товаров № ${num}</div>
    <div class="dt">от ${dt}</div>
    <div class="meta">
      Склад: <b>PROMEBEL</b><br>
      Покупатель: <b>${o.customer}</b><br>
      ${o.phone?'Тел: '+o.phone:''}
    </div>
    <div class="rule"></div>
    <div class="para">${PARA_RU}</div>
    <div class="para">${PARA_TJ}</div>
    <div class="sign"><div class="line"></div><div class="lbl">Подпись / Имзо</div></div>
  `;
  document.title='Квитанция '+num;
}
build().catch(err=>{
  document.getElementById('sheet').innerHTML='<div style="padding:60px;text-align:center;color:#c33">Ошибка: '+(err.message||err)+'</div>';
});
</script>
</body>
</html>
