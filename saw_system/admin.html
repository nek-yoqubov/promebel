<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Пользователи</title>
<link rel="stylesheet" href="saw.css?v=2">
<style>
  .add-row { display: grid; grid-template-columns: 1fr 1fr 150px auto; gap: 10px; }
  @media (max-width: 700px) { .add-row { grid-template-columns: 1fr; } }
  .user-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 4px; border-bottom: 1px solid var(--line);
  }
  .user-row:last-child { border-bottom: none; }
  .user-row .login { font-weight: 700; }
  .user-row .role { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .user-row .spacer { flex: 1; }
</style>
</head>
<body>
<div class="wrap" style="max-width:760px;">
  <div class="topbar">
    <img src="logo.png" alt="PRO MEBEL" class="logo">
    <div class="spacer"></div>
    <a href="index.html">← Меню</a>
  </div>

  <h1 style="margin-bottom:18px;">Пользователи</h1>

  <div class="card" style="margin-bottom:16px;">
    <div class="field-label" style="margin-bottom:10px;">Добавить пользователя</div>
    <div class="add-row">
      <input id="newLogin" placeholder="логин" autocomplete="off">
      <input id="newPass" type="password" placeholder="пароль" autocomplete="new-password">
      <select id="newRole">
        <option value="user">Рабочий</option>
        <option value="manager">Менеджер</option>
        <option value="director">Директор</option>
        <option value="admin">Админ</option>
      </select>
      <button class="btn btn-brand" onclick="addUser()">Добавить</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="field-label" style="margin-bottom:6px;">Список пользователей</div>
    <div id="list"><div class="hint">Загружаем…</div></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
if (!token) window.location.href = "login.html";
if (role !== "admin") window.location.href = "index.html";

function flash(text, ok) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function loadUsers() {
  try {
    const res = await fetch(API, { method: "POST", body: JSON.stringify({ action: "list_users", token }) });
    const data = await res.json();
    if (!data.success) { flash("Не удалось загрузить список"); return; }
    const list = document.getElementById("list");
    list.innerHTML = data.users.map(u => `
      <div class="user-row">
        <span class="login">${u.login}</span>
        <span class="role">[${u.role}]</span>
        <span class="spacer"></span>
        ${u.login === 'admin' ? '' : `<button class="btn btn-danger" onclick="delUser('${u.login}')">Удалить</button>`}
      </div>`).join('');
  } catch (e) {
    flash("Нет связи с сервером");
  }
}

async function addUser() {
  const login = document.getElementById("newLogin").value.trim();
  const password = document.getElementById("newPass").value.trim();
  const newRole = document.getElementById("newRole").value;
  if (!login || !password) { flash("Заполни логин и пароль"); return; }

  try {
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify({ action: "add_user", token, login, password, role: newRole })
    });
    const data = await res.json();
    if (data.success) {
      flash("Пользователь добавлен", true);
      document.getElementById("newLogin").value = "";
      document.getElementById("newPass").value = "";
      loadUsers();
    } else if (data.error === "LOGIN_EXISTS") {
      flash("Такой логин уже есть");
    } else {
      flash("Не получилось добавить: " + (data.error || ''));
    }
  } catch (e) {
    flash("Нет связи с сервером");
  }
}

async function delUser(login) {
  if (!confirm("Удалить пользователя " + login + "?")) return;
  try {
    const res = await fetch(API, { method: "POST", body: JSON.stringify({ action: "delete_user", token, login }) });
    const data = await res.json();
    if (data.success) { loadUsers(); }
    else { flash("Не получилось удалить: " + (data.error || '')); }
  } catch (e) {
    flash("Нет связи с сервером");
  }
}

loadUsers();
</script>
</body>
</html>
