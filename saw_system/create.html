<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Новый заказ</title>
<link rel="stylesheet" href="saw.css">
<style>
  .chip-box {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--paper); cursor: text; transition: border-color .15s;
  }
  .chip-box:focus-within { border-color: var(--brand); background: #fff; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px;
    background: var(--brand-soft); color: #B45309;
    font: 600 14px 'IBM Plex Mono', monospace;
  }
  .chip button {
    background: none; border: none; cursor: pointer; padding: 0;
    color: #B45309; font-size: 15px; line-height: 1;
  }
  .chip-box input {
    flex: 1; min-width: 120px; border: none; background: none;
    padding: 6px 2px; font: 600 15px 'IBM Plex Mono', monospace;
  }
  .chip-box input:focus { border: none; background: none; }
  .id-preview { font: 600 13px 'IBM Plex Mono', monospace; color: var(--muted); margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap-narrow" style="max-width:560px;">
  <div class="topbar">
    <img src="logo.png" alt="PRO MEBEL" class="logo">
    <div class="spacer"></div>
    <a href="orders.html">← Заказы</a>
  </div>

  <h1>Новый заказ</h1>
  <p class="hint" style="margin:0 0 18px;">Клиент, телефон и номера реализаций из 1С — больше ничего не нужно.</p>

  <div class="card">
    <div class="field">
      <label class="field-label">Клиент</label>
      <input id="customer" placeholder="Имя и фамилия" autocomplete="off">
    </div>

    <div class="field">
      <label class="field-label">Телефон</label>
      <input id="phone" inputmode="numeric" placeholder="901234567" maxlength="9">
      <div class="hint">9 цифр — код 992 добавится автоматически</div>
    </div>

    <div class="field">
      <label class="field-label">ID реализаций</label>
      <div class="chip-box" id="chipBox" onclick="document.getElementById('idInput').focus()">
        <input id="idInput" inputmode="numeric" placeholder="номер + Enter">
      </div>
      <div class="hint">Можно несколько: вводи номер и жми Enter. В таблицу запишутся через дефис.</div>
      <div class="id-preview" id="idPreview"></div>
    </div>

    <button class="btn btn-brand btn-block" id="btn" onclick="createOrder()">Создать заказ</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>

// Проигрывает SMIL-анимацию с нуля; onDone — после завершения
function playAnim(svgId, durationMs, onDone) {
  const overlay = document.getElementById('animOverlay');
  const svg = document.getElementById(svgId);
  if (!overlay || !svg || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (onDone) onDone();
    return;
  }
  overlay.classList.add('show');
  svg.setCurrentTime(0);       // сброс таймера SMIL — каждый показ с чистого листа
  svg.unpauseAnimations();
  setTimeout(() => {
    svg.pauseAnimations();
    overlay.classList.remove('show');
    if (onDone) onDone();
  }, durationMs);
}

const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";
const token = localStorage.getItem("token");
const role = localStorage.getItem("role") || "user";
if (!token) window.location.href = "login.html";
if (role === "user") window.location.href = "orders.html";

window.addEventListener('load', () => { const s = document.getElementById('animPlane'); if (s) s.pauseAnimations(); });

const ids = [];
const idInput = document.getElementById('idInput');
const chipBox = document.getElementById('chipBox');
const preview = document.getElementById('idPreview');

idInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === '-' || e.key === ',') {
    e.preventDefault();
    addChip();
  } else if (e.key === 'Backspace' && !idInput.value && ids.length) {
    removeChip(ids.length - 1);
  }
});
idInput.addEventListener('blur', addChip);

function addChip() {
  const v = idInput.value.replace(/[^0-9]/g, '');
  idInput.value = '';
  if (!v) return;
  if (ids.includes(v)) { flash('Такой номер уже добавлен'); return; }
  ids.push(v);
  render();
}

function removeChip(i) {
  ids.splice(i, 1);
  render();
}

function render() {
  chipBox.querySelectorAll('.chip').forEach(c => c.remove());
  ids.forEach((id, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${id}<button type="button" onclick="removeChip(${i})">×</button>`;
    chipBox.insertBefore(chip, idInput);
  });
  preview.textContent = ids.length ? 'В таблицу: ' + ids.join('-') : '';
}

function flash(text, ok) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + (ok ? 'ok' : 'err');
}

document.getElementById('phone').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 9);
});

async function createOrder() {
  addChip(); // подобрать недописанный номер из поля

  const customer = document.getElementById('customer').value.trim();
  const phoneRaw = document.getElementById('phone').value.trim();
  const btn = document.getElementById('btn');

  if (!customer) { flash('Укажи имя клиента'); return; }
  if (phoneRaw.length !== 9) { flash('Телефон — ровно 9 цифр'); return; }
  if (!ids.length) { flash('Добавь хотя бы один ID'); return; }

  const id = ids.join('-');
  const phone = '992' + phoneRaw;

  btn.disabled = true; btn.textContent = 'Проверяем…';

  try {
    const chk = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'check_id', id, token }) });
    const chkData = await chk.json();
    if (chkData.exists) {
      flash('Заказ с таким набором ID уже есть');
      btn.disabled = false; btn.textContent = 'Создать заказ';
      return;
    }

    btn.textContent = 'Создаём…';
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'create_order', token, id, customer, phone })
    });
    const data = await res.json();

    if (data.success) {
      ids.length = 0; render();
      document.getElementById('customer').value = '';
      document.getElementById('phone').value = '';
      playAnim('animPlane', 2300, () => { window.location.href = 'orders.html'; });
    } else if (data.error === 'ID_EXISTS') {
      flash('Заказ с таким набором ID уже есть');
    } else if (data.error === 'UNAUTHORIZED') {
      flash('Сессия истекла — войди заново');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } else {
      flash('Не получилось создать заказ, попробуй ещё раз');
    }
  } catch (e) {
    flash('Нет связи с сервером');
  }
  btn.disabled = false; btn.textContent = 'Создать заказ';
}
</script>
