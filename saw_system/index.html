<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Панель управления</title>
<link rel="stylesheet" href="saw.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <img src="logo.png" alt="PRO MEBEL" class="logo">
    <div class="spacer"></div>
    <button class="linklike" onclick="logout()">Выйти</button>
  </div>

  <h1 style="margin-bottom:20px;">Панель управления</h1>
  <div class="menu" id="menu"></div>
</div>

<script>
const role = localStorage.getItem("role") || "user";
const token = localStorage.getItem("token");
if (!token) window.location.href = "login.html";

const items = [
  { title: "Заказы", desc: "Очередь цеха и статусы", href: "orders.html", roles: ["all"] },
  { title: "Новый заказ", desc: "Клиент и номера реализаций", href: "create.html", roles: ["manager","admin","director"] },
  { title: "Экран цеха", desc: "Табло текущих заказов", href: "display.html", roles: ["all"] },
  { title: "Настройки", desc: "Смена пароля", href: "settings.html", roles: ["all"] },
  { title: "Админ", desc: "Пользователи системы", href: "admin.html", roles: ["admin"] }
];

const menu = document.getElementById("menu");
items.forEach(item => {
  if (item.roles.includes("all") || item.roles.includes(role)) {
    menu.innerHTML += `
      <a href="${item.href}" class="card">
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </a>`;
  }
});

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>
</body>
</html>
