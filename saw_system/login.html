<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Вход</title>
<link rel="stylesheet" href="saw.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .login-box { width: 100%; max-width: 380px; }
  .login-logo { display: block; margin: 0 auto 26px; height: 52px; }
</style>
</head>
<body>
<div class="wrap-narrow login-box">
  <img src="logo.png" alt="PRO MEBEL" class="login-logo">
  <div class="card">
    <h1 style="text-align:center; margin-bottom:18px;">Вход в систему</h1>
    <div class="field">
      <label class="field-label">Логин</label>
      <input id="login" autocomplete="username" placeholder="логин">
    </div>
    <div class="field">
      <label class="field-label">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="пароль">
    </div>
    <button class="btn btn-brand btn-block" id="btn" onclick="doLogin()">Войти</button>
    <div class="msg err" id="msg"></div>
  </div>
</div>

<script>

// Проигрывает SMIL-анимацию с нуля; onDone — после завершения
function playAnim(svgId, durationMs, onDone) {
  const overlay = document.getElementById('animOverlay');
  const svg = document.getElementById(svgId);
  if (!overlay || !svg || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (onDone) onDone();
    return;
  }
  overlay.classList.add('show');
  svg.setCurrentTime(0);       // сброс таймера SMIL — каждый показ с чистого листа
  svg.unpauseAnimations();
  setTimeout(() => {
    svg.pauseAnimations();
    overlay.classList.remove('show');
    if (onDone) onDone();
  }, durationMs);
}

const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";

window.addEventListener('load', () => { const s = document.getElementById('animCheck'); if (s) s.pauseAnimations(); });

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  if (!login || !password) { msg.textContent = 'Заполните логин и пароль'; return; }

  btn.disabled = true; btn.textContent = 'Проверяем…'; msg.textContent = '';
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'login', login, password }) });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      playAnim('animCheck', 1300, () => { window.location.href = 'index.html'; });
    } else {
      msg.textContent = 'Неверный логин или пароль';
    }
  } catch (e) {
    msg.textContent = 'Нет связи с сервером, попробуйте ещё раз';
  }
  btn.disabled = false; btn.textContent = 'Войти';
}
</script>
