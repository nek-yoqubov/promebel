<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Заказы</title>
<link rel="stylesheet" href="saw.css">
<style>
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .controls input { max-width: 300px; }
  .counters { display: flex; gap: 14px; margin-left: auto; }
  .counter { display: flex; align-items: center; gap: 8px; }
  .counter .label { font-size: 12px; color: var(--muted); font-weight: 600; }

  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .board { display: flex; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .col { min-width: 270px; scroll-snap-align: start; }
  }
  .col-head {
    display: flex; align-items: center; gap: 10px;
    padding: 0 4px 10px;
  }
  .col-head .name { font: 700 13px 'Unbounded', sans-serif; }
  .col-head .cnt { margin-left: auto; font: 600 13px 'IBM Plex Mono', monospace; color: var(--muted); }
  .col-body { display: flex; flex-direction: column; gap: 10px; min-height: 60px; }

  .order {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; box-shadow: var(--shadow);
  }
  .order .oid { font: 600 16px 'IBM Plex Mono', monospace; word-break: break-all; }
  .order .who { margin-top: 6px; font-weight: 600; }
  .order .meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .order .actions { margin-top: 10px; display: flex; gap: 8px; }
  .order .actions a {
    font: 700 12px 'Manrope', sans-serif; text-decoration: none;
    color: var(--brand);
  }
  .empty-col { font-size: 13px; color: var(--muted); padding: 12px 4px; }

  .done-block { margin-top: 26px; }
  .done-head {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    color: var(--muted); font-weight: 700; font-size: 13px; user-select: none;
  }
  .done-list { display: none; margin-top: 12px; display: none; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .done-list.open { display: grid; }
  .loading { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <img src="logo.png" alt="PRO MEBEL" class="logo">
    <div class="spacer"></div>
    <a href="index.html">Меню</a>
    <button class="linklike" onclick="localStorage.clear(); location.href='login.html'">Выйти</button>
  </div>

  <div class="controls">
    <a href="create.html" class="btn btn-brand" id="btnNew">+ Новый заказ</a>
    <input id="search" placeholder="Поиск по ID или клиенту" oninput="renderBoard()">
    <div class="counters" id="counters"></div>
  </div>

  <div id="content"><div class="loading">Загружаем заказы…</div></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";
const token = localStorage.getItem("token");
const role = localStorage.getItem("role") || "user";
if (!token) window.location.href = "login.html";
if (role === "user") document.getElementById('btnNew').style.display = 'none';

const COLS = [
  { status: 'Выгрузка со склада', name: 'Выгрузка', n: '1', badge: 'b-ware' },
  { status: 'Пила', name: 'Распил', n: '2', badge: 'b-saw' },
  { status: 'Кромка', name: 'Кромка', n: '3', badge: 'b-edge' },
  { status: 'Готово', name: 'Готово', n: '4', badge: 'b-ready' }
];

let orders = [];

async function load() {
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'list_orders', token }) });
    const data = await res.json();
    if (data.error === 'UNAUTHORIZED') { localStorage.clear(); location.href = 'login.html'; return; }
    orders = (data.orders || []).filter(o => o.id);
    renderBoard();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading">Нет связи с сервером. Обнови страницу.</div>';
  }
}

function pdfLink(o) {
  return o.pdf_token ? `pdf.html?id=${encodeURIComponent(o.id)}&t=${o.pdf_token}` : null;
}

function orderCard(o) {
  const pdf = pdfLink(o);
  return `
    <div class="order">
      <div class="oid">${o.id}</div>
      <div class="who">${o.customer || '—'}</div>
      <div class="meta">${o.date || ''}${o.total ? ' · в работе: ' + o.total : ''}</div>
      <div class="actions">
        ${o.phone ? `<a href="tel:+${o.phone}">Позвонить</a>` : ''}
        ${pdf ? `<a href="${pdf}" target="_blank">PDF</a>` : ''}
      </div>
    </div>`;
}

function renderBoard() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const match = o => !q || o.id.toLowerCase().includes(q) || (o.customer || '').toLowerCase().includes(q);

  const active = orders.filter(o => o.status !== '✅' && match(o));
  const done = orders.filter(o => o.status === '✅' && match(o));

  // Счётчики-гексагоны
  document.getElementById('counters').innerHTML = COLS.map(c => {
    const n = orders.filter(o => o.status === c.status).length;
    return `<div class="counter"><div class="hex ${n ? 'brand' : 'outline'}">${n}</div><div class="label">${c.name}</div></div>`;
  }).join('');

  let html = '<div class="board">';
  COLS.forEach(c => {
    const list = active.filter(o => o.status === c.status);
    html += `
      <div class="col">
        <div class="col-head">
          <div class="hex ${c.status === 'Готово' ? 'ok' : 'brand'}">${c.n}</div>
          <div class="name">${c.name}</div>
          <div class="cnt">${list.length}</div>
        </div>
        <div class="col-body">
          ${list.length ? list.map(orderCard).join('') : '<div class="empty-col">Пусто</div>'}
        </div>
      </div>`;
  });
  html += '</div>';

  html += `
    <div class="done-block">
      <div class="done-head" onclick="document.getElementById('doneList').classList.toggle('open')">
        <span class="badge b-done">✅ Выданные: ${done.length}</span>
        <span>показать / скрыть</span>
      </div>
      <div class="done-list" id="doneList">${done.map(orderCard).join('')}</div>
    </div>`;

  document.getElementById('content').innerHTML = html;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
