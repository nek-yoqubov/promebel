<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Документ заказа</title>
<link rel="stylesheet" href="saw.css?v=2">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .box { width: 100%; max-width: 420px; text-align: center; }
  .box img.logo { height: 46px; margin-bottom: 22px; }
  .status { font: 700 20px 'Unbounded', sans-serif; margin-bottom: 8px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .spinner {
    width: 34px; height: 38px; margin: 0 auto 14px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: var(--brand); animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="wrap-narrow box">
  <img src="logo.png" alt="PRO MEBEL" class="logo">
  <div class="card" id="content">
    <div class="spinner"></div>
    <div class="sub">Проверяем ссылку…</div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const t = params.get("t");
const content = document.getElementById("content");

function showError(text) {
  content.innerHTML = `<div class="status">✖</div><div class="sub">${text}</div>`;
}

async function loadPdf() {
  if (!id || !t) { showError("Неверная ссылка"); return; }
  try {
    const res = await fetch(API, { method: "POST", body: JSON.stringify({ action: "get_pdf_url", id, t }) });
    const data = await res.json();
    if (data.success && data.url) {
      content.innerHTML = `
        <div class="status">Заказ № ${id}</div>
        <div class="sub">Документ готов к загрузке</div>
        <a href="${data.url}" class="btn btn-brand btn-block" target="_blank">Скачать PDF</a>`;
    } else {
      showError("Ссылка недействительна или заказ не найден");
    }
  } catch (e) {
    showError("Нет связи с сервером, попробуйте позже");
  }
}
loadPdf();
</script>
</body>
</html>
