<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO MEBEL — Настройки</title>
<link rel="stylesheet" href="saw.css?v=2">
</head>
<body>
<div class="wrap-narrow">
  <div class="topbar">
    <img src="logo.png" alt="PRO MEBEL" class="logo">
    <div class="spacer"></div>
    <a href="index.html">← Меню</a>
  </div>

  <h1 style="margin-bottom:18px;">Смена пароля</h1>

  <div class="card">
    <div class="field">
      <label class="field-label">Текущий пароль</label>
      <input id="oldPass" type="password" autocomplete="current-password">
    </div>
    <div class="field">
      <label class="field-label">Новый пароль</label>
      <input id="newPass" type="password" autocomplete="new-password">
    </div>
    <div class="field">
      <label class="field-label">Новый пароль ещё раз</label>
      <input id="newPass2" type="password" autocomplete="new-password">
    </div>
    <button class="btn btn-brand btn-block" id="btn" onclick="changePass()">Сменить пароль</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxzI1zAz4wMJHIctiD_Z2X_AbolzhG3th6d1TfvUvIldBMrwYwUKhp8CT1RW2X4wW1yYA/exec";
const token = localStorage.getItem("token");
if (!token) window.location.href = "login.html";

function flash(text, ok) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function changePass() {
  const oldPass = document.getElementById("oldPass").value.trim();
  const newPass = document.getElementById("newPass").value.trim();
  const newPass2 = document.getElementById("newPass2").value.trim();
  const btn = document.getElementById('btn');

  if (!oldPass || !newPass || !newPass2) { flash("Заполни все поля"); return; }
  if (newPass.length < 4) { flash("Новый пароль — минимум 4 символа"); return; }
  if (newPass !== newPass2) { flash("Новые пароли не совпадают"); return; }

  btn.disabled = true; btn.textContent = 'Сохраняем…';
  try {
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify({ action: "change_password", token, old_password: oldPass, new_password: newPass })
    });
    const data = await res.json();
    if (data.success) {
      flash("Пароль изменён", true);
      document.getElementById("oldPass").value = "";
      document.getElementById("newPass").value = "";
      document.getElementById("newPass2").value = "";
    } else if (data.error === "WRONG_PASSWORD") {
      flash("Текущий пароль неверный");
    } else if (data.error === "SESSION_EXPIRED" || data.error === "UNAUTHORIZED") {
      flash("Сессия истекла — войди заново");
      setTimeout(() => location.href = 'login.html', 1200);
    } else {
      flash("Не получилось сменить пароль");
    }
  } catch (e) {
    flash("Нет связи с сервером");
  }
  btn.disabled = false; btn.textContent = 'Сменить пароль';
}
</script>
</body>
</html>
